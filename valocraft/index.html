ire : zone de feu (250 ¤) | **Sky Smoke** : place une fumée là où tu vises (longue portée) (offert, +100 ¤, max 3) | **Orbital Strike** : frappe orbitale dévastatrice sur la zone visée — **8 pts** |\n| **Omen** | **Shrouded Step** : téléportation courte là où tu vises (100 ¤, max 2) | **Paranoia** : ombre qui traverse les murs et aveugle tout sur son passage (300 ¤) | **Dark Cover** : fumée longue portée là où tu vises (offert, +150 ¤, max 2, recharge 30 s) | **From the Shadows** : téléportation n'importe où sur la map — **7 pts** |\n| **Viper** | **Snake Bite** : fiole d'acide : dégâts et vulnérabilité (200 ¤, max 2) | **Poison Cloud** : émetteur de nuage toxique, à activer / couper (carburant) (200 ¤) | **Toxic Screen** : long mur toxique à activer / couper (carburant) (offert) | **Viper's Pit** : immense nuage toxique autour de Viper : les ennemis n'y voient rien — **9 pts** |\n| **Harbor** | **Cascade** : vague qui avance, bloque la vue et ralentit (150 ¤) | **Cove** : sphère d'eau qui bloque la vue (350 ¤) | **High Tide** : long mur d'eau qui ralentit (offert) | **Reckoning** : 3 geysers qui sonnent les ennemis dans la zone visée — **7 pts** |\n| **Astra** | **Gravity Well** : carte tactique : attire les ennemis puis les rend vulnérables (150 ¤) | **Nova Pulse** : carte tactique : impulsion qui sonne (150 ¤) | **Nebula** : carte tactique : fumée n'importe où sur la map (offert, +150 ¤, max 2, recharge 25 s) | **Cosmic Divide** : carte tactique : mur cosmique géant qui bloque la vue (dans l'axe de ton regard) — **7 pts** |\n| **Clove** | **Pick-me-up** : après une élimination ou une assistance (3 s) : soin et vitesse (100 ¤) | **Meddle** : fragment qui affaiblit temporairement les ennemis (dégradation) (250 ¤) | **Ruse** : carte tactique : fumées n'importe où (2 offertes, max 2, recharge 40 s) | **Not Dead Yet** : s'active automatiquement à ta mort : tu reviens, élimine ou assiste en 12 s — **8 pts** |\n| **Miks** | **M-Pulse** : onde sonore : clic gauche sonne les ennemis, clic droit soigne les alliés (250 ¤) | **Harmonize** : stim de combat pour l'allié visé et toi (clic droit : toi seul) (200 ¤) | **Waveform** : carte tactique : mur d'ondes sonores qui bloque la vue (offert, +150 ¤, max 2, recharge 30 s) | **Bassquake** : onde de choc devant toi : repousse, ralentit et assourdit — **8 pts** |\n\n## Sentinelles\n\n| Agent | C | Q | E (signature) | X (ultime) |\n|---|---|---|---|---|\n| **Sage** | **Barrier Orb** : érige un mur de glace solide (400 ¤) | **Slow Orb** : zone qui ralentit tous ceux qui la traversent (200 ¤, max 2) | **Healing Orb** : soigne un allié visé (clic gauche) ou soi-même (clic droit) (offert, recharge 45 s) | **Resurrection** : ressuscite un allié mort visé — **8 pts** |\n| **Killjoy** | **Nanoswarm** : grenade qui libère un essaim de nanobots (200 ¤, max 2) | **Alarmbot** : piège : rend vulnérable et révèle l'ennemi qui approche (200 ¤) | **Turret** : tourelle qui tire sur les ennemis pendant 30 s (offert) | **Lockdown** : après 10 s, immobilise les ennemis dans un grand rayon — **8 pts** |\n| **Cypher** | **Trapwire** : fil tendu entre deux murs : révèle et ralentit qui le franchit (200 ¤, max 2) | **Cyber Cage** : petite fumée lancée (100 ¤, max 2) | **Spycam** : caméra murale qui révèle les ennemis en vue (45 s) (offert) | **Neural Theft** : vise un ennemi mort : révèle tous les ennemis deux fois — **6 pts** |\n| **Deadlock** | **GravNet** : grenade qui force les ennemis à s'accroupir (200 ¤) | **Sonic Sensor** : capteur qui sonne les ennemis qui font du bruit (200 ¤) | **Barrier Mesh** : barrière en croix qui bloque le passage (offert) | **Annihilation** : emprisonne le premier ennemi touché : il meurt au bout de 7 s — **7 pts** |\n| **Veto** | **Crosscut** : pose une balise (clic gauche), puis téléporte-toi dessus (clic gauche) (200 ¤) | **Chokehold** : piège qui immobilise et rend vulnérable (200 ¤, max 2) | **Interceptor** : dispositif qui détruit l'utilitaire ennemi proche (15 s) (offert) | **Evolution** : 25 s : immunisé aux effets, régénération, vitesse et cadence — **7 pts** |\n| **Chamber** | **Trademark** : piège qui ralentit et révèle les ennemis (200 ¤) | **Headhunter** : pistolet lourd : une charge = une balle (159 à la tête) (100 ¤, max 8) | **Rendezvous** : pose une ancre (clic gauche), puis téléporte-toi dessus (clic gauche, 25 blocs) (offert, recharge 30 s) | **Tour de Force** : sniper : 5 balles mortelles, ralentit autour des éliminés — **8 pts** |\n| **Vyse** | **Razorvine** : ronces qui blessent et ralentissent (150 ¤) | **Shear** : piège : un mur se dresse quand un ennemi passe (200 ¤) | **Arc Rose** : pose une rose (clic gauche), puis fais-la flasher (clic gauche) (offert, recharge 30 s) | **Steel Garden** : bloque les armes principales des ennemis proches pendant 8 s — **8 pts** |\n\n> **Miks** est un agent original de Valocraft.\n\n## Mécaniques des capacités\n\n- **Activation manuelle** : la touche prend la capacité en main, le **clic gauche** l'utilise. `controls.instant-abilities: true` rétablit le déclenchement à l'appui sur la touche.\n- **Lancers maintenus** : pour les objets lancés (grenades, fumées de Jett, flèches de Sova, Nanoswarm...), maintenir le clic gauche affiche la **trajectoire** (visible de toi seul), relâcher lance. **Clic droit** : lancer en cloche, sauf pour les capacités qui ont une variante au clic droit.\n- **Recharge visible** : l'icône de la signature reste dans la barre, grisée par le balayage de recharge.\n- **Pilotage à la première personne** : drone de Sova, tigre de Skye et drone de Tejo. Tu deviens la créature, ton corps reste sur place et peut être tué. Clic gauche = action, clic droit = retour dans ton corps.\n- **Capacités de balise** (Rendezvous, Gatecrash, Refract, Crosscut, Arc Rose) : le premier clic pose la balise, le second l'utilise.\n- **Carte tactique** (Sky Smoke, Dark Cover, Orbital Strike, From the Shadows, Nebula, Ruse, Waveform, Guided Salvo...) : une carte vue du dessus s'ouvre ; ZQSD pour viser, clic gauche pour poser, clic droit pour annuler.\n- **Jauges** affichées dans la barre d'action : énergie de **Neon** (High Gear vide la jauge, les éliminations la remplissent), carburant de **Viper** (émetteurs actifs = consommation), vent préparé de **Jett**.\n- **Utilitaire destructible** : les balles ennemies détruisent la tourelle (125 PV), la caméra (70), Leer et Interceptor (60), Sonic Sensor, Chokehold, Trademark et Shear (40), Alarmbot, Trapwire et Nanoswarm (20).\n\n## États\n\n| État | Effet | Causé par |\n|---|---|---|\n| **Sonné** | Ralenti, la vue tangue | Capacités qui sonnent |\n| **Aveuglé** | Écran **blanc** qui s'estompe (flashs) ou vision réduite | Flashs, Leer, Paranoia, Dizzy, Seekers |\n| **Vulnérable** | +50 % de dégâts reçus | Alarmbot, Snake Bite, Seize, Undercut... |\n| **Immobilisé** | Ni tir ni capacité | Lockdown, Thrash, Chokehold |\n| **Supprimé** | Plus de capacités | ZERO/point, NULL/cmd, Stealth Drone |\n| **Gêné** | Cadence réduite, ralenti | Saturate, Convergent Paths |\n| **Bloqué** | Arme principale inutilisable | Steel Garden |\n| **Immunisé** | Aucun effet négatif | Evolution (Veto) |\n| **Révélé** | Contour lumineux visible à travers les murs | Capacités de révélation |\n| **Intangible** | Aucun dégât | Dismiss, Dimensional Drift |\n\n## Apparence des agents\n\n- **Skin complet** : pendant la partie, tout le skin du joueur devient celui de son agent. Le skin d'origine revient au lobby (`agents.full-skin`).\n- Avec le plugin **SkinsRestorer**, les skins sont signés : le joueur voit aussi son propre skin d'agent (vue F5, bras). Sans lui, seuls les autres joueurs le voient.\n- On peut remplacer le skin d'un agent par une autre image de skin ou un pseudo Minecraft : `agents.skins.<agent>`.\n- `agents.full-skin: false` rétablit les **têtes d'agents** (`agents.wear-heads`).\n\n## Fumées\n\nLes fumées et les murs sont des modèles 3D opaques et teintés (orange pour Brimstone), visibles de loin. Un ennemi dans une fumée ou derrière est masqué, quelle que soit la distance ; à moins de 2,5 blocs, on se voit. Les balles traversent les fumées. Réglages : `agents.smokes-hide-players`, `agents.solid-smokes`.\n\n## Équilibrage\n\nLes capacités n'ont pas encore été équilibrées en partie réelle : vos retours sont les bienvenus. Les valeurs se règlent dans `abilities.yml`, sans recompiler.\n", "fr/changelog": "# Changelog\n\n\nToutes les évolutions de Valocraft, de la plus récente à la plus ancienne.\n\n## 2.2\n\n> Installation : remplacer l'ancien jar par `Valocraft-2.2.jar` dans `plugins/`. Le pack de textures est mis à jour automatiquement.\n\n### Ajouts\n\n#### Interface et visuels\n- **Tableau des scores complet (Tab)**, aligné en colonnes. En haut : map, round, phase, temps, score et camp (`game.custom-tab`).\n\n| | Alliés | Ennemis |\n|---|---|---|\n| Agent et pseudo | ✔ | ✔ (barré si mort) |\n| Crédits | crédits actuels | crédits **au début de la phase d'achat** |\n| Arme | arme en main | – |\n| Vie | PV + bouclier | – |\n| K / D / A | ✔ | ✔ |\n| Ultime | points ou PRÊTE | points ou PRÊTE |\n\n- **Mini-map tactique** pour Sky Smoke, Dark Cover, Orbital Strike et From the Shadows :\n  - carte de la map vue du dessus, avec les sites, les coéquipiers, les fumées et la portée maximale ;\n  - ZQSD pour déplacer le curseur, clic gauche pour poser, clic droit pour annuler (`agents.tactical-map`).\n- **Les fumées cachent vraiment** :\n  - fumées et murs en modèles 3D opaques et teintés, visibles de loin ;\n  - un ennemi dans une fumée ou derrière disparaît de l'écran, quelle que soit la distance (`agents.smokes-hide-players`, `agents.solid-smokes`).\n- **Têtes d'agents** portées par chaque joueur, quand le skin complet est désactivé (`agents.full-skin: false`, voir Agents).\n- **Boutique du lobby et Radianite (◆)** :\n  - gagnée à chaque fin de partie : victoire 150, défaite 60, +5 par élimination, +2 par assistance, +5 par round gagné, +50 pour le MVP ;\n  - agents à débloquer ;\n  - 6 collections de skins d'armes (Prime, Reaver, Glitchpop, Ion, Elderflame, Oni) pour 18 armes, soit 108 modèles ;\n  - achat en deux clics (confirmation).\n\n#### Modes de jeu\n\n| Mode | Règles |\n|---|---|\n| **Non classé** | 13 rounds gagnants, économie, spike, prolongations. |\n| **Compétition** | Comme le non classé, avec rang et RR. |\n| **Swiftplay** | Premier à 5 rounds, changement de côté après 4, économie et spike, sans prolongations (`modes.swiftplay`). |\n| **Replication** | Pendant la sélection, chacun vote pour un agent (doublons autorisés). Toute l'équipe joue ensuite l'agent le plus choisi. Premier à 5 rounds (`modes.replication`). |\n| **Escalation** | Deux équipes, réapparition, sans capacités. Chaque niveau impose une arme : Odin, Ares, Phantom, Vandal, Spectre, Judge, Bulldog, Guardian, Sheriff, Marshal, Operator, puis **couteau**. 3 éliminations d'équipe par niveau (1 au couteau) : la première équipe qui finit gagne, sinon la plus avancée après 10 min (`modes.escalation`). |\n| **Spike Rush** | Premier à 4 rounds, la même arme tirée au sort pour tout le monde, capacités pleines, une spike par attaquant. |\n| **Deathmatch** | Chacun pour soi, réapparition en 1,5 s, armes gratuites 10 s après la réapparition, une élimination soigne. 40 éliminations ou 6 min. |\n| **Team Deathmatch** | Deux équipes avec agents, réapparition, armes gratuites. 100 éliminations ou 9 min 30. |\n\n- L'hôte choisit le mode en créant la partie. `/vc map setmode <map> <mode>` fixe le mode par défaut d'une map.\n- Dans les modes à réapparition, on a 2 s de protection à l'apparition. Le point d'apparition est choisi le plus loin possible des ennemis.\n- **Classé (mode Compétition)** :\n  - rangs Fer, Bronze, Argent, Or, Platine, Diamant, Ascendant et Immortel (3 divisions chacun), puis Radiant ;\n  - 5 parties de placement ;\n  - RR selon le résultat (+20 / -16), la performance (score de combat) et l'écart de niveau entre les équipes ;\n  - quitter coûte -30 RR.\n\n#### Agents (29 au total)\n\n13 nouveaux agents :\n\n| Agent | C | Q | E | X |\n|---|---|---|---|---|\n| **Breach** | Aftershock | Flashpoint | Fault Line | Rolling Thunder |\n| **Astra** | Gravity Well | Nova Pulse | Nebula | Cosmic Divide |\n| **Fade** | Prowler | Seize | Haunt | Nightfall |\n| **Tejo** | Stealth Drone | Special Delivery | Guided Salvo | Armageddon |\n| **Clove** | Pick-me-up | Meddle | Ruse | Not Dead Yet |\n| **Deadlock** | GravNet | Sonic Sensor | Barrier Mesh | Annihilation |\n| **Veto** | Crosscut | Chokehold | Interceptor | Evolution |\n| **Iso** | Contingency | Undercut | Double Tap | Kill Contract |\n| **Chamber** | Trademark | Headhunter | Rendezvous | Tour de Force |\n| **KAY/O** | FRAG/ment | FLASH/drive | ZERO/point | NULL/cmd |\n| **Vyse** | Razorvine | Shear | Arc Rose | Steel Garden |\n| **Yoru** | Fakeout | Blindside | Gatecrash | Dimensional Drift |\n| **Waylay** | Saturate | Lightspeed | Refract | Convergent Paths |\n\nUn agent original : **Miks** (contrôleur).\n\n| C | Q | E | X |\n|---|---|---|---|\n| M-Pulse (clic gauche sonne, clic droit soigne) | Harmonize (stim pour l'allié visé et soi) | Waveform (fumées par carte tactique) | Bassquake (onde qui repousse, ralentit et assourdit) |\n\n- Nouveaux états :\n  - **supprimé** : plus de capacités ;\n  - **gêné** : cadence réduite et ralenti ;\n  - **bloqué** : arme principale inutilisable ;\n  - **immunisé** : aucun effet négatif.\n- Capacités de balise en deux temps (Rendezvous, Gatecrash, Refract, Crosscut, Arc Rose) : la première utilisation pose la balise, la seconde l'utilise.\n- **Pilotage à la première personne** du drone de Sova, du tigre de Skye et du drone de Tejo :\n  - tu deviens la créature, ton corps reste sur place et peut être tué ;\n  - clic gauche = action de la créature, clic droit = retour dans ton corps.\n- **Skin complet de l'agent** : pendant la partie, tout le skin du joueur devient celui de son agent, pas seulement la tête. Le skin d'origine revient au lobby (`agents.full-skin`).\n- **Compatibilité SkinsRestorer** (optionnelle) :\n  - MineSkin signe les skins d'agents : le joueur voit aussi son propre skin d'agent (vue F5, bras) ;\n  - les skins signés sont créés en arrière-plan au démarrage et gardés dans `data/agent-skins.yml` ;\n  - le skin de n'importe quel agent peut être remplacé par l'URL d'une image de skin ou un pseudo Minecraft (`agents.skins.<agent>`).\n\n#### Capacités\n- **Activation manuelle** : la touche 5 à 8 prend la capacité en main, le clic gauche l'utilise. Plus rien ne part en changeant de slot (`controls.instant-abilities: true` pour l'ancien comportement).\n- **Flashs blancs** : écran entièrement blanc qui s'estompe en 4 étapes, plus de vision noire. Pas de lunette pendant un flash.\n- **Lancers maintenus avec trajectoire** :\n  - maintenir le clic gauche affiche l'arc (visible de toi seul), relâcher lance ;\n  - clic droit = lancer en cloche ;\n  - les flèches de Sova vont plus loin quand on maintient plus longtemps.\n- **Recharge visible** : l'icône de la signature reste dans la barre avec le balayage de recharge de Minecraft.\n- **Utilitaire destructible** : les balles ennemies détruisent les objets posés.\n\n| Objet | PV |\n|---|---|\n| Tourelle | 125 |\n| Caméra | 70 |\n| Leer, Interceptor | 60 |\n| Sonic Sensor, Chokehold, Trademark, Shear | 40 |\n| Alarmbot, Trapwire, Nanoswarm | 20 |\n\n- **Ultimes ennemies** : leurs points sont affichés dans le tab. Une alerte (chat et son) prévient quand une ultime ennemie est prête.\n- **Kits plus fidèles** :\n  - **Neon** : jauge d'énergie, High Gear active / coupe le sprint, et s'accroupir en sprint fait une glissade ;\n  - **Viper** : jauge de carburant, Poison Cloud et Toxic Screen deviennent des émetteurs qu'on active et coupe ;\n  - **Jett** : Tailwind se prépare, puis on déclenche le dash ;\n  - **Iso** : Kill Contract ouvre une arène de verre en 1v1 au-dessus de la map ;\n  - **Chamber** : Tour de Force a une lunette plein écran au clic droit ;\n  - **Brimstone** : fumées orange.\n- **`abilities.yml`** : prix, charges, recharge, recharge par élimination et dégâts de chaque capacité, coût des ultimes, multiplicateurs globaux de dégâts et de durée. Pris en compte avec `/vc reload`, sans recompiler.\n\n#### Maps et chargement\n- **Mondes des maps chargés à la demande** :\n  - ils restent sur le disque et ne sont plus chargés au démarrage du serveur ;\n  - au lancement d'une partie, le serveur charge le monde, précharge les chunks des spawns et y place tout le monde ;\n  - un monde inutilisé est sauvegardé puis déchargé (`maps.unload-check`).\n- La **salle d'attente** et la **sélection d'agent** se font au lobby.\n- **Écran de chargement** : pendant le chargement de la map, un menu montre la carte (bannière), l'agent et le titre de chaque joueur, équipe rouge en haut et bleue en bas (`game.loading-time`).\n- **Les cartes de joueur sont de vraies bannières** : couleur de l'agent et symbole de son rôle. Elles apparaissent dans la boutique, à l'écran de chargement et dans le résumé de match.\n\n#### Progression et cosmétiques\n- **Battle pass** :\n  - 30 niveaux de 1 000 XP ;\n  - XP gagnée à chaque partie : victoire 600, défaite 300, +20 par élimination, +10 par assistance, +30 par round gagné, +150 pour le MVP ;\n  - une récompense par niveau, donnée automatiquement : Radianite, cartes, titres, bannières et sons d'élimination, sprays ;\n  - menu `/vc pass`. Changer `battlepass.season` remet tout le monde au niveau 0 ; les récompenses gagnées restent.\n- **Bannières d'élimination** : à chaque élimination, ton symbole s'affiche autant de fois que tes éliminations du round, aux couleurs de ta carte. La victime voit ta carte et ton titre. 8 styles : ❱ ✦ ❤ ☠ ⚡ ✪ ⚔ ♛.\n- **Sons d'élimination** :\n  - la note monte à chaque élimination du round, avec un son spécial au 5e ;\n  - 7 sons : Valorant, Carillon, Cloche, Xylophone, Pièces, Rétro 8-bit, Améthyste ;\n  - un clic droit dans la boutique permet d'écouter.\n- **Sprays** :\n  - accroupi + F en partie : ton spray se colle sur le mur, le sol ou le plafond visé ;\n  - textes (GG, EZ, NICE, ☠, ❤, ?, ACE, VALOCRAFT) ou emblème de l'un des 29 agents ;\n  - un par round, toutes les 30 s dans les modes à réapparition.\n- **Classements dans le lobby** : hologrammes posés avec `/vc leaderboard set <type>`, mis à jour toutes les minutes. Types : rang, éliminations, victoires, ACS, headshots, aces, battle pass.\n- **Boutique** : 14 couteaux, cartes de joueur, 12 titres, bannières et sons d'élimination, sprays.\n- **Missions du jour** : 3 missions tirées au sort chaque jour, 150 ◆ chacune (`/vc missions`).\n- **Fin de match** :\n  - score de combat, dégâts, premiers sangs, annonce des ACE ;\n  - rapport de dégâts à la mort ;\n  - menu « Résumé du match » avec les stats de chaque joueur (`/vc resume`).\n\n#### Jeu en équipe et social\n- **Demande d'arme** : cliquer sur une arme trop chère la demande à ton équipe. Un coéquipier qui a l'argent clique sur **[Acheter pour …]** : il paie et l'arme arrive directement dans ton inventaire.\n- **Groupes d'amis** :\n  - `/vc party invite|leave|kick|list|chat` ;\n  - le groupe suit son chef dans les parties et reste dans la même équipe.\n- **Équipes équilibrées** selon un niveau caché (MMR).\n- **Chat** : rang et titre devant les pseudos. Un message qui commence par `!` va à l'équipe seulement.\n\n#### Déroulement des parties\n- **Reconnexion** : un joueur déconnecté en pleine partie garde sa place 3 min et y est replacé à son retour.\n- **Votes** :\n  - `/vc ff` : abandon, à partir du round 5, 80 % de oui ;\n  - `/vc remake` : jusqu'au round 3, si un coéquipier est parti.\n- **AFK** : un joueur immobile reçoit un avertissement à 45 s et est exclu à 90 s.\n- **Compensation de latence** : les tirs sont vérifiés là où le tireur voyait sa cible, jusqu'à 200 ms en arrière.\n- **Bruits de pas** :\n  - courir s'entend chez les ennemis, avec un son qui dépend du bloc ;\n  - marcher accroupi est silencieux.\n- **Radar permanent** : une carte en main gauche montre les alliés, les ennemis repérés, la spike, les sites et les fumées de l'équipe.\n\n#### Administration\n- `/vc forcestart [map]` : lance la partie même avec un seul joueur. Une équipe vide n'est jamais « éliminée » et la partie ne compte pas en classé.\n- `/vc ult add|set <joueur> [points]` : ajoute ou fixe les points d'ultime (`set` sans nombre = ultime pleine).\n- `/vc pass addxp <joueur> <xp>` : donne de l'XP de battle pass.\n- `/vc leaderboard set <type> | remove | list` : classements du lobby.\n- **Tous les agents débloqués par défaut** (`progression.default-agents: [ALL]`).\n- **Stockage SQLite / MySQL** (`storage.type`), avec import automatique depuis `stats.yml`.\n- Admin Radianite : `/vc radianite give|take|set <joueur> <montant>`, `/vc radianite voir <joueur>`.\n\n### Corrections\n- **Icônes de capacités** :\n  - Cove de Harbor affichait une icône de Gekko (entrée manquante dans le pack) ;\n  - les icônes de Trademark et Rendezvous (Chamber) étaient inversées ;\n  - les icônes de FRAG/ment et FLASH/drive (KAY/O) étaient inversées.\n\n  La table des icônes du pack est maintenant reconstruite à partir des images qui existent vraiment.\n- Le clic droit pour quitter un drone ou un tigre piloté fonctionne (une télécommande dédiée est utilisée).\n- **Lunette des snipers** : vrai viseur plein écran en 16:9, porté par le casque, qui ne clignote plus.\n- **Tir continu** :\n  - maintenir le clic gauche tire à la vraie cadence de l'arme ;\n  - les armes peuvent « miner » le bloc visé jusqu'à 64 blocs (rien n'est cassé), donc le client envoie un signal à chaque tick ;\n  - l'animation de coup de bras est masquée.\n\n---\n\n## 2.1 — Mise à jour des agents\n\n### Ajouts\n\n#### 15 agents\nUne phase de **sélection d'agent** (25 s) s'ouvre après le compte à rebours. Chaque agent est unique dans une équipe. Un joueur qui ne choisit pas reçoit un agent libre au hasard.\n\n| Rôle | Agents |\n|---|---|\n| Duellistes | Jett, Phoenix, Raze, Reyna, Neon |\n| Initiateurs | Sova, Skye, Gekko |\n| Contrôleurs | Brimstone, Omen, Viper, Harbor |\n| Sentinelles | Sage, Killjoy, Cypher |\n\n- **Contrôles** :\n  - touches **5 / 6 / 7 / 8** = **C / Q / E / X** ;\n  - clic gauche pour lancer, clic droit pour la variante quand il y en a une ;\n  - les objets guidés (drone de Sova, faucon et tigre de Skye, Thrash de Gekko) suivent le regard ;\n  - Jett plane en maintenant la touche de saut.\n- **États** :\n\n| État | Effet |\n|---|---|\n| Sonné | ralenti, la vue tangue |\n| Aveuglé | vision noire (flashs, Leer, Paranoia, Dizzy, Seekers) |\n| Vulnérable | +50 % de dégâts reçus |\n| Immobilisé | ni tir, ni capacité |\n| Révélé | contour lumineux visible à travers les murs |\n| Intangible | aucun dégât |\n\n#### Système d'ultime\n- Points gagnés avec les éliminations, les morts, la pose et le désamorçage de la spike, et les **orbes d'ultime**. Ils sont conservés à la mi-temps.\n- Progression affichée en permanence dans la barre d'action. Quand l'ultime est prête : titre, son et message à l'équipe.\n- Ultime lancée : tout le monde entend la réplique de l'agent.\n- Orbes d'ultime : `/vc map addorb <map>`. Maintenir clic droit 1,5 s à côté d'un orbe donne +1 point.\n\n#### Autres ajouts\n- **Tyroliennes** : `/vc map addzipline <map>`. En jeu, F pour s'accrocher, saut ou accroupi pour lâcher.\n- **Lobby et matchmaking** : objets « Rejoindre un match », « Statistiques » et « Créer une partie ».\n- **Modèles 3D** pour toutes les armes, dont 11 nouveaux modèles : Shorty, Frenzy, Stinger, Bucky, Judge, Bulldog, Guardian, Phantom, Marshal, Outlaw, Odin.\n- **Contrôles Valorant** : clic gauche pour tirer, clic droit maintenu pour viser.\n- **Pack de textures** servi par le port Minecraft lui-même (compatible Pterodactyl) et mis à jour automatiquement.\n- **`/vc pack send | remove`**, et en admin `/vc pack send <joueur|all>`, `/vc pack info`, `/vc pack reload`.\n- **Import de maps** depuis ommo.me (`/vc import`), réservé aux serveurs privés (licence CC BY-NC-ND 4.0).\n\n### Corrections\n- L'écran ne « revient plus en arrière » pendant les rafales : le recul est entièrement dans la trajectoire des balles.\n\n---\n\n## 2.0\n\n### Ajouts\n- **Jeu de base** :\n  - rounds à la Valorant avec économie et phase d'achat ;\n  - pose et désamorçage de la spike ;\n  - murs pendant la phase d'achat, prolongations.\n- **Armes** :\n  - tout l'arsenal de Valorant, avec baisse des dégâts selon la distance, schémas de recul et pénétration des murs ;\n  - boucliers.\n- **Maps** : commandes de configuration (`/vc map ...`).\n- **Serveur et pack** :\n  - hébergement automatique du pack de textures ;\n  - compatibilité Pterodactyl.\n", "fr/commands": "# Commandes et permissions\n\n\nLa commande principale est `/vc` (alias `/valocraft`, `/valo`).\n\n## Commandes joueur\n\n| Commande | Description |\n|---|---|\n| `/vc join [map]` | Rejoindre une partie (menu sans argument) |\n| `/vc leave` | Quitter la partie |\n| `/vc list` | Lister les parties |\n| `/vc shop` | Boutique de la phase d'achat (ou touche F) |\n| `/vc lobby` | Retour au lobby |\n| `/vc boutique` | Boutique de collection (au lobby) |\n| `/vc radianite` | Ton solde de Radianite |\n| `/vc pass` | Battle pass |\n| `/vc missions` | Missions du jour |\n| `/vc resume` | Résumé de ton dernier match |\n| `/vc rang [joueur]` | Rang classé |\n| `/vc party invite\\|accept\\|deny\\|leave\\|kick\\|chat\\|list` | Groupe d'amis |\n| `/vc ff [non]` | Voter l'abandon (à partir du round 5) |\n| `/vc remake [non]` | Annuler la partie si un coéquipier est parti tôt |\n| `/vc pack send` / `remove` | (Re)recevoir / retirer le pack de textures |\n| `!message` (en partie) | Chat d'équipe |\n\n`/vc buyfor` est utilisée en interne par le bouton **[Acheter pour …]** des demandes d'arme.\n\n## Commandes admin\n\n| Commande | Description |\n|---|---|\n| `/vc setlobby` | Définir le lobby à ta position |\n| `/vc wand` | Baguette de sélection (clic gauche = pos1 / point A, clic droit = pos2 / point B) |\n| `/vc start <map>` | Forcer le début d'une partie (2 joueurs minimum) |\n| `/vc forcestart [map]` | Lancer **même avec 1 seul joueur** (sans map : la partie où tu es). Ne compte pas en classé. |\n| `/vc stop <map>` | Forcer l'arrêt d'une partie |\n| `/vc ult add\\|set <joueur> [points]` | Points d'ultime (`set` sans nombre = ultime pleine) |\n| `/vc pass addxp <joueur> <xp>` | Donner de l'XP de battle pass |\n| `/vc leaderboard set <type>` / `remove` / `list` | Classements du lobby ([Progression](page:progression)) |\n| `/vc give <arme\\|knife\\|spike> [joueur]` | Donner une arme, le couteau ou la spike |\n| `/vc reload` | Recharger `config.yml`, `weapons.yml` et `abilities.yml` |\n| `/vc pack send\\|remove <joueur\\|all>` | Envoyer / retirer le pack de textures |\n| `/vc pack info` / `reload` | Mode et lien du pack / le recharger |\n| `/vc radianite give\\|take\\|set <joueur> <montant>` | Gérer la Radianite d'un joueur |\n| `/vc radianite voir <joueur>` | Consulter le solde d'un joueur |\n| `/vc import list` / `<nom>` | Catalogue / télécharger une map ([Import de maps](page:importing-maps)) |\n\n## Commandes de map (admin)\n\nVoir [Création de map](page:map-setup) pour le déroulé.\n\n| Commande | Description |\n|---|---|\n| `/vc map create <id>` / `delete <id>` | Créer / supprimer une map |\n| `/vc map list` / `info <id>` | Lister / voir ce qui manque |\n| `/vc map setname <id> <nom>` | Nom affiché |\n| `/vc map setwaiting <id>` | Salle d'attente = ta position |\n| `/vc map addspawn <id> <attack\\|defend>` | Ajouter un spawn à ta position |\n| `/vc map clearspawns <id> <attack\\|defend>` | Vider les spawns |\n| `/vc map addsite <id> <A\\|B\\|C...>` / `removesite <id> <site>` | Site de spike (sélection) / le retirer |\n| `/vc map addwall <id> [bloc]` / `removewall <id> <n>` / `walls <id>` | Murs de pré-round |\n| `/vc map previewwalls <id>` | Afficher / masquer les murs |\n| `/vc map setplayers <id> <min> <max>` | Limites de joueurs |\n| `/vc map setmode <id> <mode>` | Mode par défaut (`unrated`, `competitive`, `swiftplay`, `replication`, `spike_rush`, `deathmatch`, `team_deathmatch`, `escalation`) |\n| `/vc map setmusic <id> <son\\|none>` | Musique de la map |\n| `/vc map addorb <id>` / `clearorbs <id>` | Orbes d'ultime |\n| `/vc map setminimap <id>` / `clearminimap <id>` | Zone de la carte tactique |\n| `/vc map addzipline <id>` / `ziplines <id>` / `removezipline <id> <n>` | Tyroliennes |\n| `/vc map enable\\|disable <id>` | Activer / désactiver |\n| `/vc map tp <id>` | Aller sur la map (charge son monde si besoin) |\n\n## Permissions\n\n| Permission | Par défaut | Description |\n|---|---|---|\n| `valocraft.play` | Tout le monde | Jouer à Valocraft |\n| `valocraft.admin` | Opérateurs | Commandes d'administration |\n| `valocraft.agents.all` | Personne | Débloquer tous les agents (déjà le cas par défaut avec `default-agents: [ALL]`) |\n| `valocraft.skins.all` | Personne | Débloquer tous les skins d'armes |\n", "fr/configuration": "# Configuration\n\n\nLes fichiers se trouvent dans `plugins/Valocraft/`. `/vc reload` recharge `config.yml`, `weapons.yml` et `abilities.yml`. Les nouvelles options sont ajoutées automatiquement à `config.yml` lors des mises à jour.\n\n## Fichiers et dossiers\n\n| Chemin | Rôle |\n|---|---|\n| `config.yml` | Réglages généraux, modes, contrôles, progression, battle pass, pack de textures, bibliothèque de maps |\n| `weapons.yml` | Statistiques de toutes les armes (commentées en tête du fichier) |\n| `abilities.yml` | Prix, charges, recharges et dégâts de chaque capacité, coût des ultimes |\n| `stats.yml` / `valocraft.db` | Profils des joueurs (YAML par défaut, SQLite ou MySQL) |\n| `leaderboards.yml` | Positions des classements du lobby |\n| `resourcepack.zip` | Pack de textures extrait du jar |\n| `maps/<id>.yml` | Un fichier par map |\n| `playerdata/` | Inventaires sauvegardés pendant une partie, rendus après un crash |\n| `data/` | Blocs temporaires à restaurer après un crash, mini-maps, skins d'agents signés (`agent-skins.yml`) |\n\n## Principales options de `config.yml`\n\n| Clé | Rôle |\n|---|---|\n| `game.countdown`, `game.rounds-to-win`, `game.loading-time` | Compte à rebours, rounds gagnants, durée minimale de l'écran de chargement |\n| `game.custom-tab`, `game.radar` | Tableau des scores personnalisé, radar en main gauche |\n| `modes.<mode>.*` | Réglages de chaque [mode](page:modes) (rounds, éliminations, temps, armes d'Escalation...) |\n| `maps.unload-check` | Secondes entre deux vérifications des mondes de maps à décharger |\n| `controls.fire-button`, `controls.aim-mode` | Bouton de tir (`LEFT` / `RIGHT`) et visée (`HOLD` / `TOGGLE`) |\n| `controls.continuous-fire`, `controls.semi-auto-hold`, `controls.hide-swing` | Tir continu ([Contrôles](page:controls)) |\n| `controls.instant-abilities` | `false` (défaut) : activation manuelle des capacités ; `true` : déclenchement à l'appui sur la touche |\n| `agents.select-time` | Durée de la sélection d'agent |\n| `agents.full-skin`, `agents.wear-heads` | Skin complet de l'agent / têtes d'agents |\n| `agents.skins-restorer`, `agents.skins.<agent>` | Skins signés via SkinsRestorer / skin personnalisé d'un agent (URL d'image ou pseudo) |\n| `agents.tactical-map`, `agents.smokes-hide-players`, `agents.solid-smokes` | Carte tactique, fumées qui cachent, fumées 3D |\n| `progression.*` | Radianite, prix, agents offerts (`default-agents: [ALL]`), `cosmetic-prices` |\n| `battlepass.*` | Saison, niveaux, XP, récompenses ([Progression](page:progression)) |\n| `leaderboards.refresh`, `leaderboards.size` | Classements du lobby |\n| `reconnect.*`, `surrender.*`, `remake.*`, `afk.*` | Reconnexion, votes, inactivité |\n| `ranked.*`, `missions.*`, `party.*`, `chat.*`, `footsteps.*` | Classé, missions, groupes, chat, bruits de pas |\n| `storage.type` | `yaml`, `sqlite` ou `mysql` (import automatique depuis `stats.yml`) |\n| `weapons.lag-compensation`, `weapons.practice-mode` | Compensation de latence, [Stand de tir](page:practice-range) |\n| `player.speed-bonus` | Bonus de vitesse de marche (le sprint est désactivé) |\n| `resource-pack.*` | Hébergement du pack ([Pack de textures](page:resource-pack)) |\n| `map-library` | Catalogue de `/vc import` |\n\n## `abilities.yml`\n\nCréé au premier démarrage avec les valeurs d'origine, complété automatiquement quand de nouvelles capacités apparaissent.\n\n```yaml\nglobal:\n  damage-multiplier: 1.0      # dégâts de toutes les capacités\n  duration-multiplier: 1.0    # durée des fumées, feux, pièges\nagents:\n  jett:\n    ult-cost: 8\n    cloudburst:\n      price: 200\n      max-charges: 2\n      free-charges: 0\n      cooldown: 0             # secondes pour regagner une charge offerte\n      kill-recharge: 0        # revient après N éliminations\n      damage-multiplier: 1.0\n```\n\nModifier, puis `/vc reload` : pas besoin de recompiler.\n\n## `weapons.yml`\n\nToutes les statistiques d'armes : dégâts, cadence, imprécision, recul, pénétration, zoom et plus. Voir [Armes](page:weapons).\n", "fr/controls": "# Contrôles\n\n\n| Touche | Action |\n|---|---|\n| **Clic gauche** | Tirer ; maintenir en visant un bloc à moins de 64 blocs pour le tir continu |\n| **Clic droit (maintenu)** | Viser / lunette |\n| **Q** | Recharger |\n| **Accroupi + Q** | Lâcher l'arme (ou la spike) |\n| **F** | Boutique pendant la phase d'achat, sinon ramasser l'arme visée |\n| **Accroupi + F** | Spray sur le mur visé |\n| **1 / 2 / 3 / 4** | Arme principale / pistolet / couteau / spike |\n| **5 / 6 / 7 / 8**, puis **clic gauche** | Prendre puis utiliser la capacité **C / Q / E / X** |\n| **F** près d'une corde | S'accrocher à une [tyrolienne](page:ziplines) |\n| **Clic droit maintenu** avec la spike, sur un site | Poser la spike (rester immobile) |\n| **Clic droit maintenu** sur la spike (défenseur) | Désamorcer (rester immobile) |\n| **Tab** | Tableau des scores |\n\n## Capacités\n\n- **Activation manuelle** : la touche 5 à 8 prend la capacité en main, le **clic gauche** l'utilise. Rien ne part en changeant de slot. Pour revenir au déclenchement direct (Tailwind, High Gear, Dismiss, ultimes instantanées...) : `controls.instant-abilities: true`.\n- **Objets lancés** : **maintenir** le clic gauche affiche la trajectoire (visible de toi seul), **relâcher** lance. **Clic droit** : lancer en cloche, ou la variante quand il y en a une (Curveball à droite, flèches de Sova sans rebond, Healing Orb sur soi, FLASH/drive rapide, M-Pulse qui soigne).\n- **Flèches de Sova** : plus tu maintiens, plus elles vont loin (jauge « Puissance »).\n- **Pilotage** (drone de Sova, tigre de Skye, drone de Tejo) : tu vois par les yeux de la créature, ZQSD pour te déplacer, clic gauche = action, clic droit = retour dans ton corps.\n- **Carte tactique** : ZQSD déplace le curseur (sprint pour aller plus vite), clic gauche pose, clic droit ou accroupi annule.\n- **Capacités de balise** : premier clic = poser, second clic = utiliser.\n- **Neon** : accroupi pendant High Gear = glissade. **Viper** : clic sur un émetteur posé = l'activer / le couper.\n- **Tour de Force** (Chamber) : clic droit = lunette, clic gauche = tirer.\n- **Jett** plane en maintenant la touche de saut.\n\n## Tir continu\n\nMinecraft n'envoie normalement qu'**un signal par clic gauche**. En partie, Valocraft utilise le bloc visé (jusqu'à **64 blocs**) pour recevoir un signal à chaque tick tant que le clic est maintenu : l'arme tire à sa cadence configurée. Aucun bloc n'est cassé, aucune fissure n'est visible et l'animation du bras est masquée. Un clic simple tire une balle ; les semi-automatiques tirent aussi en continu à leur cadence maximale.\n\nEn visant le ciel sans bloc à moins de 64 blocs, il faut cliquer. Le couteau frappe toujours à moins de 3 blocs. Réglages : `controls.continuous-fire`, `controls.semi-auto-hold`, `controls.hide-swing` ([Configuration](page:configuration)).\n\n## Interface\n\n- **Barre d'XP** : niveau = balles dans le chargeur, barre = chargeur / progression du rechargement.\n- **Cœurs** = PV (100 PV = 10 cœurs), **cœurs dorés** = bouclier.\n- **Barre d'action** : PV, munitions, crédits, ultime et jauges d'agent.\n- **Main gauche** : radar.\n", "fr/development": "# Développement\n\n\n## Compiler depuis les sources\n\nPrérequis : **Java 21** et **Maven**.\n\n```bash\nmvn package\n```\n\nLe jar se trouve dans `target/Valocraft-2.2.jar` (le pack `resourcepack/valocraft-pack.zip` est embarqué dedans).\n\n## Où modifier quoi\n\n| Quoi | Où |\n|---|---|\n| Prix, charges, recharges, dégâts des capacités, coût des ultimes | `abilities.yml` (sans recompiler) |\n| Comportement des capacités | `agent/Kits.java`, `agent/NewKits.java`, moteur dans `agent/AbilityManager.java` |\n| Liste des agents et capacités | `agent/Agent.java`, `agent/AbilityType.java` |\n| Statistiques des armes | `weapons.yml` (sans recompiler) |\n| Réglages généraux | `config.yml` (sans recompiler) |\n| Modes de jeu | `game/Mode.java`, `game/Game.java` |\n| Cosmétiques (bannières, sons, sprays) | `cosmetic/` |\n| Battle pass, progression | `stats/BattlePass.java`, `stats/Progression.java` |\n| Chargement des mondes de maps | `map/MapWorlds.java` |\n| Modèles d'armes | `resourcepack/valocraft-models/`, `resourcepack/ModelGenerator.java` |\n| Ressources générées (lunette, flashs, fumées, skins, icônes) | `resourcepack/PackGenerator22.java` |\n\n## Ressources du pack\n\n`PackGenerator22.java` génère les textures et modèles Valocraft dans `resourcepack/valocraft-models/` (lunette, overlays de flash, fumées, police du tableau, 108 skins d'armes) et reconstruit la table des icônes de capacités à partir des images présentes. Ensuite :\n\n```bash\ncd resourcepack\njava PackGenerator22.java valocraft-pack.zip valocraft-models\njar uf valocraft-pack.zip -C valocraft-models assets\n```\n\nPuis recompiler le plugin. Les modèles d'armes Valocraft s'ouvrent dans **Blockbench** (format Java Block/Item).\n\n## Intégrations optionnelles\n\n- **SkinsRestorer** : appelé par réflexion (`agent/SkinsRestorerHook.java`), aucune dépendance de compilation. Déclaré en `softdepend`.\n\n## Contribuer\n\n- Ouvrir une **issue** pour les bugs et les retours d'équilibrage (agent, capacité, situation).\n- Les pull requests sont les bienvenues.\n", "fr/gameplay": "# Déroulement du jeu\n\n\nValocraft reprend le mode spike de Valorant : les attaquants posent la spike, les défenseurs les en empêchent. D'autres règles existent selon le [mode de jeu](page:modes).\n\n## Déroulement d'une partie (Non classé / Compétition)\n\n1. **Salle d'attente au lobby**, choix d'équipe, compte à rebours.\n2. **Sélection d'agent (25 s)**, puis **écran de chargement** pendant le chargement de la map ([Lobby](page:lobby)).\n3. **Phase d'achat** : ouvrir la boutique avec `F`. Des murs de pré-round retiennent les équipes à leur spawn.\n4. **Round** (100 s) : les attaquants posent, les défenseurs défendent ou désamorcent.\n5. **Round suivant**. Changement de côté après **12 rounds**. Le premier à **13** gagne.\n6. **Prolongations** : départ avec 5000 crédits, victoire avec **2 rounds d'écart**.\n\n## Spike\n\n| Action | Durée |\n|---|---|\n| Pose | 4 s (clic droit maintenu avec la spike sur un site, rester immobile) |\n| Désamorçage | 7 s (clic droit maintenu sur la spike, rester immobile). La moitié de la progression est conservée. |\n| Explosion | 45 s après la pose |\n\nLâcher la spike ou une arme : **Accroupi + Q**.\n\n## Économie\n\nÉconomie à la Valorant (crédits ¤) : armes, bouclier et charges de capacités s'achètent dans la boutique pendant la phase d'achat. Les charges sont sur la ligne du bas ; la **signature (E)** de ton agent est offerte à chaque round.\n\n**Demander une arme** : dans la boutique, cliquer sur une arme trop chère envoie la demande à ton équipe. Un coéquipier qui a l'argent clique sur **[Acheter pour …]** : il paie et l'arme arrive dans ton inventaire (ton ancienne arme reste au sol).\n\n## Santé et interface\n\n- **Cœurs** = PV (100 PV = 10 cœurs). **Cœurs dorés** = bouclier.\n- **Barre d'XP** : niveau = balles dans le chargeur, barre = chargeur / progression du rechargement.\n- **Barre d'action** : PV, munitions, crédits, progression de l'ultime (`X ●●●○○○`) et jauges d'agent (énergie de Neon, carburant de Viper...).\n- **Radar** : une carte en main gauche montre les alliés, les ennemis repérés, la spike, les sites et les fumées de ton équipe (`game.radar`).\n\n## Tableau des scores (Tab)\n\nAppuie sur **Tab** pour voir la map, le round, la phase, le temps, le score et les camps, avec les joueurs alignés en colonnes. Alliés : crédits, arme en main, PV/bouclier, K/D/A et ultime. Ennemis : crédits au début de la phase d'achat, K/D/A et **points d'ultime** (en rouge quand l'ultime est prête). Le pseudo des ennemis morts est barré. `game.custom-tab: false` désactive ce tableau.\n\n## Fin de round et de match\n\n- **Premier sang** et **ACE** annoncés.\n- **Rapport de dégâts** dans le chat à la mort et en fin de round.\n- **Bannière et son d'élimination** à chaque élimination ([Progression et cosmétiques](page:progression)).\n- Fin de match : classement, menu **Résumé du match** (`/vc resume`), Radianite, XP de battle pass et RR en Compétition.\n\n## Reconnexion, votes et AFK\n\n- **Reconnexion** : un joueur déconnecté en pleine partie garde sa place 3 min et est replacé à son retour.\n- **Abandon** : `/vc ff`, à partir du round 5, 80 % de oui.\n- **Remake** : `/vc remake`, jusqu'au round 3, si un coéquipier est parti ; tout le monde doit voter oui.\n- **AFK** : avertissement à 45 s d'inactivité, exclusion à 90 s.\n\n## Déplacements et sons\n\n- Le **sprint est désactivé**, comme dans Valorant ; la vitesse de marche est augmentée (`player.speed-bonus`).\n- S'arrêter ou s'accroupir avant de tirer rend le tir précis. Courir ou sauter le rend imprécis.\n- **Bruits de pas** : courir s'entend chez les ennemis (son selon le bloc) ; marcher accroupi est silencieux.\n- Les [tyroliennes](page:ziplines) sont utilisables sur les maps qui en ont.\n\n## Murs de pré-round\n\nLes murs sont posés pendant la phase d'achat et retirés au début du round. Ils ne remplissent que les blocs **vides** et sont restaurés à l'identique : la map n'est jamais abîmée.\n\n## Voir aussi\n\n- [Modes de jeu](page:modes)\n- [Contrôles](page:controls)\n- [Agents](page:agents)\n- [Armes](page:weapons)\n", "fr/home": "<p align=\"center\">\n  <img src=\"https://cdn.modrinth.com/data/5AxXyQzL/39d04a022a5cfb4beb81c95012836130a1a9db6e.png\" alt=\"Logo Valocraft\" width=\"260\">\n<\/p>\n\n<h1 align=\"center\">Wiki Valocraft<\/h1>\n\n<p align=\"center\">\n  <b>Valorant dans Minecraft<\/b> : 29 agents, 8 modes de jeu, ultimes, classé, battle pass et maps chargées à la demande.<br>\n  Version <b>2.2<\/b> · Paper 1.21.4+ · Java 21\n<\/p>\n\n\n---\n\n**Valocraft** est une reproduction de Valorant refaite de zéro pour les serveurs Minecraft. Deux équipes de cinq maximum jouent des rounds de spike avec une économie à la Valorant, des armes hitscan, des capacités d'agents et des ultimes. Il y a aussi des modes rapides, du deathmatch et Escalation.\n\n> ⚠️ Valocraft 2.x est une réécriture complète. Rien des versions 1.x n'existe plus, et les configs et maps 1.x ne sont pas compatibles.\n\n## 🚀 Démarrage rapide\n\n1. [Installer le plugin](page:installation) sur un serveur Paper 1.21.4+.\n2. Définir le lobby avec `/vc setlobby`.\n3. [Créer une map](page:map-setup) ou [en importer une](page:importing-maps).\n4. Rejoindre depuis le lobby ([Lobby et matchmaking](page:lobby)) et jouer.\n\n## 📖 Où trouver quoi\n\n| Je veux... | Aller à |\n|---|---|\n| Installer ou mettre à jour le plugin | [Installation](page:installation) |\n| Rejoindre, héberger, voir ses stats et les classements | [Lobby et matchmaking](page:lobby) |\n| Comprendre une partie (rounds, économie, spike) | [Déroulement du jeu](page:gameplay) |\n| Connaître les modes (Swiftplay, Escalation...) | [Modes de jeu](page:modes) |\n| Connaître les touches | [Contrôles](page:controls) |\n| Voir tous les agents et capacités | [Agents](page:agents) |\n| Comprendre les points d'ultime et les orbes | [Système d'ultime](page:ultimate) |\n| Connaître les armes | [Armes](page:weapons) |\n| Battle pass, skins, sprays, bannières, classé | [Progression et cosmétiques](page:progression) |\n| Construire ma propre map | [Création de map](page:map-setup) |\n| Télécharger une map toute faite | [Import de maps](page:importing-maps) |\n| Ajouter des tyroliennes | [Tyroliennes](page:ziplines) |\n| Régler un souci de pack de textures | [Pack de textures](page:resource-pack) |\n| Trouver une commande | [Commandes et permissions](page:commands) |\n| Régler le plugin | [Configuration](page:configuration) |\n| Tester les armes hors partie | [Stand de tir](page:practice-range) |\n| Résoudre un problème | [Dépannage](page:troubleshooting) |\n| Compiler ou contribuer | [Développement](page:development) |\n| Lire les notes de version | [Changelog](page:changelog) |\n\n## ✨ Points forts\n\n- 🎭 **29 agents** (Duellistes, Initiateurs, Contrôleurs, Sentinelles), avec leur **skin complet** en partie\n- 🎮 **8 modes** : Non classé, Compétition, Swiftplay, Replication, Spike Rush, Deathmatch, Team Deathmatch, Escalation\n- ⚡ **Capacités fidèles** : flashs blancs, trajectoires des lancers, jauges de Neon et Viper, utilitaire destructible, pilotage des drones à la première personne\n- 🥇 **Classé** avec rangs et RR, **battle pass** de 30 niveaux, missions du jour\n- 🎨 **Cosmétiques** : skins d'armes, couteaux, cartes (bannières), titres, bannières et sons d'élimination, sprays\n- 🏆 **Classements en hologrammes** dans le lobby\n- 🌍 **Maps chargées à la demande**, avec écran de chargement aux cartes et titres de chaque joueur\n- 🔫 **Armes hitscan** avec tir continu, recul, pénétration, compensation de latence et modèles 3D\n- 🗺️ **Éditeur de maps en jeu** et import des maps Valorant d'Ommo\n- 📦 **Pack de textures auto-hébergé** servi sur le port Minecraft (compatible Pterodactyl)\n\n## 🔗 Liens\n\n- Téléchargement : [Valocraft sur Modrinth](https://modrinth.com/plugin/valocraft_stimoi)\n- Signaler un bug ou donner un retour d'équilibrage : ouvrir une issue sur ce dépôt\n", "fr/importing-maps": "# Import de maps\n\n\nValocraft peut télécharger les maps du projet [VALORANT x Minecraft d'Ommo](https://ommo.me/valorant-x-minecraft) directement depuis le jeu.\n\n## Commandes\n\n```\n/vc import list          catalogue + version Minecraft requise\n/vc import ascent        télécharge, installe le monde vc_ascent et crée la map Valocraft \"ascent\"\n```\n\n## Ce que fait l'import\n\n- Télécharge la map et l'installe comme monde `vc_<nom>`.\n- Crée une map Valocraft avec le même id.\n- Le monde est ensuite **chargé à la demande** : au lancement d'une partie sur cette map, ou avec `/vc map tp <nom>` pour la configurer. Il est déchargé quand plus personne ne l'utilise ([Création de map](page:map-setup)).\n\n## Ce qu'il reste à faire\n\nL'import ne place **pas** les points de jeu. Il faut encore définir :\n\n- La salle d'attente\n- Les spawns (attaque / défense)\n- Les sites de spike\n- Les murs de pré-round\n\nAller sur la map avec `/vc map tp ascent`, suivre [Création de map](page:map-setup), puis activer :\n\n```\n/vc map enable ascent\n```\n\n## Limites de version\n\nUne map sauvegardée dans une version de Minecraft **plus récente que le serveur** est refusée. **Lotus, Sunset et Breeze** demandent **Minecraft 1.21.11**.\n\n## Modifier le catalogue\n\nLe catalogue est la section `map-library` de `config.yml`.\n\n## ⚖️ Licence\n\nLes maps d'Ommo sont sous licence **CC BY-NC-ND 4.0**.\n\n- Autorisées sur un serveur **privé entre amis**.\n- Un serveur **public** nécessite une **licence commerciale** (contact@ommo.me).\n- **Ne pas republier** les maps.\n", "fr/installation": "# Installation\n\n\n## Prérequis\n\n| | |\n|---|---|\n| **Serveur** | Paper 1.21.4 ou plus récent |\n| **Java** | 21 |\n| **Dépendances** | Aucune obligatoire |\n| **Optionnel** | [SkinsRestorer](https://github.com/SkinsRestorer/SkinsRestorer) : skins d'agents signés, visibles aussi par le joueur lui-même |\n| **Pack de textures** | Embarqué dans le jar, envoyé automatiquement |\n\n## Nouvelle installation\n\n1. Placer `Valocraft-2.2.jar` dans le dossier `plugins/` du serveur (et SkinsRestorer si tu le veux).\n2. Démarrer le serveur. Le pack de textures est extrait dans `plugins/Valocraft/resourcepack.zip` au premier démarrage, et `abilities.yml` est créé.\n3. Se placer à l'endroit voulu pour le lobby et faire `/vc setlobby`.\n4. [Créer une map](page:map-setup) ou [en importer une](page:importing-maps), puis `/vc map enable <id>`.\n5. Optionnel : poser des [classements](page:progression) dans le lobby avec `/vc leaderboard set <type>`.\n\n## Mise à jour\n\n- Depuis une **2.x** : remplacer l'ancien jar par `Valocraft-2.2.jar` dans `plugins/`. Les joueurs reçoivent automatiquement le pack mis à jour. Les nouvelles options sont ajoutées à `config.yml` au démarrage.\n- Depuis la **1.x** : la 2.x est une réécriture complète qui ne partage rien avec la 1.x. Retirer l'ancien plugin et ses données, et repartir de zéro.\n\n## Mondes des maps\n\nLes mondes des maps (`vc_<map>`) **ne sont plus chargés au démarrage du serveur**. Ils restent sur le disque et sont chargés au lancement d'une partie, puis déchargés quand plus personne ne les utilise. Une map construite dans le monde principal (`world`) reste chargée en permanence. Voir [Création de map](page:map-setup).\n\n## Pack de textures\n\nRien à configurer par défaut. Le pack (HrdaValorant, modèles Valocraft) est servi **sur le port Minecraft lui-même** et envoyé à chaque joueur à la connexion. Le lien reprend l'adresse et le port utilisés par le joueur pour se connecter : aucun port supplémentaire à ouvrir, et ça fonctionne aussi sur Pterodactyl.\n\nVoir [Pack de textures](page:resource-pack) pour les alternatives et le dépannage.\n\n## SkinsRestorer (optionnel)\n\nAvec SkinsRestorer, les skins d'agents sont signés par MineSkin au démarrage (en arrière-plan, un toutes les 3 s), puis gardés dans `plugins/Valocraft/data/agent-skins.yml`. Le serveur doit avoir accès à Internet au premier démarrage. Sans SkinsRestorer, les autres joueurs voient quand même le skin de l'agent ; seul le joueur lui-même garde son skin en vue F5.\n\n## Étapes suivantes\n\n- [Lobby et matchmaking](page:lobby)\n- [Création de map](page:map-setup)\n- [Commandes et permissions](page:commands)\n", "fr/lobby": "# Lobby et matchmaking\n\n\nLe point de spawn du lobby se définit avec `/vc setlobby` (admin). Les joueurs y reviennent avec `/vc lobby`.\n\n## Objets du lobby\n\n| Objet | Rôle |\n|---|---|\n| ⭐ **Rejoindre un match** (étoile) | Rejoint la partie en attente la plus remplie. **Accroupi + clic droit** : liste de toutes les parties. |\n| 📖 **Statistiques** (livre) | Tes stats (K/D, % de tirs à la tête, victoires, MVP, agent favori, rang) et les classements. |\n| 🔨 **Créer une partie** (enclume) | Choisis une map libre et un [mode](page:modes), et deviens l'**hôte**. |\n| 💎 **Boutique** (émeraude) | Skins d'armes, couteaux, cartes, titres, bannières et sons d'élimination, sprays, battle pass, missions. Aussi `/vc boutique`. Voir [Progression et cosmétiques](page:progression). |\n\n## Héberger une partie\n\n1. Utiliser l'**enclume** (Créer une partie), choisir une map libre puis le mode.\n2. Tu deviens l'hôte. Les autres joueurs rejoignent avec l'étoile ou `/vc join <map>`.\n3. L'hôte reçoit un **objet vert** qui lance la partie dès **2 joueurs** (un admin peut lancer seul avec `/vc forcestart`).\n\n## Rejoindre par commande\n\n| Commande | Effet |\n|---|---|\n| `/vc join` | Ouvre le menu des parties |\n| `/vc join <map>` | Rejoint une map précise |\n| `/vc list` | Liste les parties |\n| `/vc leave` | Quitte la partie |\n\n## Déroulé avant le match\n\n1. **Salle d'attente au lobby** : les joueurs restent au lobby avec les objets de la partie (équipe, mode pour l'hôte, lancer, quitter). Le monde de la map n'est pas encore chargé.\n2. **Compte à rebours**, puis **sélection d'agent** (25 s) dans un menu, toujours au lobby. Voir [Agents](page:agents).\n3. **Écran de chargement** : pendant que le serveur charge le monde de la map, un menu montre la **carte (bannière)**, l'**agent** et le **titre** de chaque joueur, équipe rouge en haut et bleue en bas. La barre de boss affiche la progression.\n4. Tout le monde est placé sur la map et le premier round commence.\n\nÀ la fin de la partie, les joueurs reviennent au lobby et le monde de la map est déchargé.\n\n## Groupes d'amis\n\n| Commande | Effet |\n|---|---|\n| `/vc party invite <joueur>` | Inviter (le joueur reçoit les boutons [Accepter] / [Refuser]) |\n| `/vc party leave` / `kick <joueur>` / `list` | Quitter / exclure / voir le groupe |\n| `/vc party chat <message>` | Parler au groupe |\n\nQuand le chef rejoint une partie, tout le groupe le suit s'il reste de la place, et le groupe joue dans la même équipe. Les équipes sont équilibrées selon un niveau caché (MMR).\n\n## Classements du lobby\n\nDes hologrammes de classement (rang, éliminations, victoires, ACS, headshots, aces, battle pass) peuvent être posés dans le lobby par un admin. Voir [Progression et cosmétiques](page:progression).\n\n## Statistiques\n\nSuivies par joueur : éliminations / morts, assistances, tirs à la tête, victoires, MVP, premiers sangs, aces, dégâts, score de combat, agent favori, rang. Stockage dans `stats.yml`, SQLite ou MySQL ([Configuration](page:configuration)). `/vc resume` rouvre le résumé de ton dernier match et `/vc rang [joueur]` affiche un rang.\n", "fr/map-setup": "# Création de map\n\n\nLes maps se configurent **en jeu** avec `/vc map ...` et la baguette de sélection. Cette page construit une map nommée `ascent` de zéro. Pour éviter de la construire, voir [Import de maps](page:importing-maps).\n\n## Ce qu'il faut pour qu'une map soit jouable\n\n- Une **salle d'attente** (utilisée en fin de match et à la reconnexion)\n- Des spawns **attaque** et **défense** (5 chacun en général)\n- Au moins un **site de spike** (A, B, C...)\n- Des **murs de pré-round**\n- Les limites de joueurs\n- Être **activée**\n\n`/vc map info <id>` liste exactement ce qui manque.\n\n## Déroulé complet\n\n```\n/vc map create ascent\n/vc map setname ascent Ascent\n/vc map setwaiting ascent            (salle d'attente = ta position)\n/vc map addspawn ascent attack       (répéter pour chaque joueur, 5 en général)\n/vc map addspawn ascent defend\n/vc wand                             (clic gauche = pos1, clic droit = pos2)\n/vc map addsite ascent A             (sélection = zone de pose du site A)\n/vc map addsite ascent B\n/vc map addwall ascent               (sélection = mur de pré-round, verre vert par défaut)\n/vc map addwall ascent light_blue_stained_glass\n/vc map previewwalls ascent          (afficher / masquer les murs pour vérifier)\n/vc map setplayers ascent 2 10\n/vc map setmode ascent unrated       (mode par défaut, optionnel)\n/vc map setmusic ascent hrdavalorant.maps.ascent\n/vc map addorb ascent                (orbes d'ultime, optionnel)\n/vc map addzipline ascent            (tyroliennes, optionnel)\n/vc map enable ascent\n```\n\n## Étape par étape\n\n### 1. Créer et nommer\n\n`/vc map create <id>` puis `/vc map setname <id> <nom affiché>`.\n\n### 2. Salle d'attente et spawns\n\nSe placer à l'endroit voulu et faire `/vc map setwaiting <id>`. Répéter `/vc map addspawn <id> attack` et `/vc map addspawn <id> defend` à chaque position de spawn. `/vc map clearspawns <id> <attack|defend>` vide une liste.\n\n### 3. Sites de spike\n\n1. `/vc wand`\n2. **Clic gauche** = pos1, **clic droit** = pos2.\n3. `/vc map addsite <id> A` (et `B`, `C`...). La sélection devient la zone de pose. `/vc map removesite <id> <site>` en retire un.\n\n### 4. Murs de pré-round\n\nSélectionner la zone avec la baguette, puis `/vc map addwall <id> [bloc]`. Le bloc par défaut est le **verre vert**.\n\n- Les murs ne remplissent que les blocs **vides** et sont retirés à l'identique au début du round : la map n'est **jamais abîmée**.\n- `/vc map previewwalls <id>` affiche ou masque un aperçu ; `/vc map walls <id>` les liste, `/vc map removewall <id> <n>` en retire un.\n\n### 5. Joueurs, mode et musique\n\n`/vc map setplayers <id> <min> <max>`, `/vc map setmode <id> <mode>` ([Modes de jeu](page:modes)), `/vc map setmusic <id> <son|none>`.\n\n### 6. Options\n\n- [Orbes d'ultime](page:ultimate) : `/vc map addorb <id>` / `/vc map clearorbs <id>`\n- [Tyroliennes](page:ziplines)\n- Zone de la carte tactique et du radar : calculée à partir des spawns, sites, murs et orbes. Pour la régler, sélectionner la zone avec la baguette et faire `/vc map setminimap <id>` ; `/vc map clearminimap <id>` rétablit le calcul automatique.\n\n### 7. Activer\n\n`/vc map enable <id>` (et `disable` pour la retirer des parties).\n\n## Monde de la map : chargé à la demande\n\n- Une map construite dans son **propre monde** (par exemple `vc_ascent`, créé par [l'import](page:importing-maps)) n'est **pas chargée au démarrage du serveur**. Le monde est chargé au **lancement d'une partie**, pendant l'écran de chargement, puis **déchargé et sauvegardé** quand plus personne ne l'utilise (vérification toutes les 30 s, `maps.unload-check`).\n- `/vc map tp <id>` et `/vc map previewwalls <id>` chargent le monde à la demande pour configurer la map. Il est déchargé quand tu en sors.\n- Une map construite dans le **monde principal** (`world`) fonctionne aussi, mais ce monde reste toujours chargé.\n\n## Protection en cas de crash\n\nLes blocs posés (murs, spike, capacités) sont **enregistrés sur disque** dans `plugins/Valocraft/data/` et **restaurés au prochain chargement du monde** si le serveur plante.\n\n## Voir aussi\n\n- [Commandes et permissions](page:commands)\n- [Import de maps](page:importing-maps)\n", "fr/modes": "# Modes de jeu\n\n\nL'hôte choisit le mode en créant la partie (menu « Créer une partie ») ou en salle d'attente. Un admin fixe le mode par défaut d'une map avec `/vc map setmode <map> <mode>`. Les réglages de chaque mode sont dans la section `modes` de `config.yml`.\n\n## Les 8 modes\n\n| Mode | Clé | Règles |\n|---|---|---|\n| **Non classé** | `unrated` | 13 rounds gagnants, changement de côté après 12, économie, spike, prolongations. |\n| **Compétition** | `competitive` | Comme le non classé, avec rang et RR. Quitter la partie coûte des RR. |\n| **Swiftplay** | `swiftplay` | Premier à **5 rounds**, changement de côté après 4, économie et spike, sans prolongations. |\n| **Replication** | `replication` | Pendant la sélection, chacun vote pour un agent (doublons autorisés) ; **toute l'équipe joue l'agent le plus choisi**. Premier à 5 rounds. |\n| **Spike Rush** | `spike_rush` | Premier à 4 rounds (changement après 3). La même arme tirée au sort pour tout le monde, bouclier, capacités pleines, +1 point d'ultime par round, une spike par attaquant. |\n| **Deathmatch** | `deathmatch` | Chacun pour soi, sans agents. Réapparition en 1,5 s, armes gratuites 10 s après la réapparition, une élimination soigne. 40 éliminations ou 6 min. |\n| **Team Deathmatch** | `team_deathmatch` | Deux équipes avec agents, réapparition en 2 s, armes gratuites, orbes d'ultime. 100 éliminations ou 9 min 30. |\n| **Escalation** | `escalation` | Deux équipes, réapparition, sans capacités : chaque niveau impose une arme (voir plus bas). |\n\n## Escalation\n\n- Ordre des armes par défaut : Odin, Ares, Phantom, Vandal, Spectre, Judge, Bulldog, Guardian, Sheriff, Marshal, Operator, puis **couteau**.\n- Il faut **3 éliminations d'équipe** pour passer au niveau suivant (`kills-per-level`) ; au dernier niveau, **une seule élimination au couteau** suffit.\n- Toute l'équipe change d'arme en même temps. Pas de boutique.\n- La première équipe qui termine le dernier niveau gagne ; sinon, au bout de 10 min, l'équipe la plus avancée.\n- La barre de boss et le tableau de droite affichent le niveau de chaque équipe.\n\n```yaml\nmodes:\n  escalation:\n    time-limit: 600\n    kills-per-level: 3\n    levels: [odin, ares, phantom, vandal, spectre, judge, bulldog, guardian, sheriff, marshal, operator, knife]\n```\n\n## Modes à réapparition\n\nDeathmatch, Team Deathmatch et Escalation : 2 s de protection à l'apparition (sauf si on tire), point d'apparition le plus loin possible des ennemis. Un spray est disponible toutes les 30 s.\n\n## Compétition\n\n- Rangs : Fer, Bronze, Argent, Or, Platine, Diamant, Ascendant et Immortel (3 divisions chacun), puis Radiant.\n- **5 parties de placement**, puis RR selon le résultat (+20 / -16), la performance (score de combat) et l'écart de niveau entre les équipes. Un abandon coûte -30 RR.\n- Une partie lancée par `/vc forcestart` ne compte pas pour le classé.\n\nVoir aussi [Progression et cosmétiques](page:progression).\n", "fr/practice-range": "# Stand de tir\n\n\nHors partie, une arme obtenue avec `/vc give` tire sur les **mobs et les armor stands**. Elle ne tire jamais sur les joueurs.\n\nChaque tir touché affiche :\n\n- La **zone** touchée\n- Les **dégâts** infligés\n- La **distance**\n\nC'est le moyen le plus simple de régler `weapons.yml` avant d'ouvrir une partie.\n\n## Utilisation\n\n```\n/vc give <arme> [joueur]\n```\n\nTirer sur des mobs ou des armor stands, ajuster `weapons.yml`, puis `/vc reload`.\n\n## Désactivation\n\nRégler `weapons.practice-mode` dans `config.yml` pour le désactiver. Voir [Configuration](page:configuration).\n\nVoir aussi : [Armes](page:weapons).\n", "fr/progression": "# Progression et cosmétiques\n\n\nTout se passe dans la **boutique du lobby** (émeraude, ou `/vc boutique`). La monnaie est la **Radianite (◆)**. Achat en deux clics (le premier demande de confirmer).\n\n## Radianite\n\nGagnée à chaque fin de partie (`progression.rewards`) :\n\n| Source | Gain |\n|---|---|\n| Victoire | 150 ◆ |\n| Défaite | 60 ◆ |\n| Élimination | +5 ◆ |\n| Assistance | +2 ◆ |\n| Round gagné | +5 ◆ |\n| MVP | +50 ◆ |\n\nPlus les **missions du jour** (3 par jour, 150 ◆ chacune, `/vc missions`) et le **battle pass**. Admin : `/vc radianite give|take|set <joueur> <montant>`, `/vc radianite voir <joueur>`.\n\n## Battle pass\n\n- **30 niveaux de 1 000 XP** (`battlepass.levels`, `battlepass.xp-per-level`).\n- XP à chaque partie : victoire 600, défaite 300, égalité 400, +20 par élimination, +10 par assistance, +30 par round gagné, +150 pour le MVP (`battlepass.xp`).\n- **Une récompense par niveau**, donnée automatiquement : Radianite, cartes, titres, bannières et sons d'élimination, sprays.\n- Menu : `/vc pass` ou le bouton **Battle pass** de la boutique.\n- **Nouvelle saison** : changer `battlepass.season` remet tout le monde au niveau 0. Les récompenses gagnées restent.\n- Récompense d'un niveau modifiable : `battlepass.rewards.<niveau>: \"spray:gg\"` (types `radianite`, `card`, `title`, `killbanner`, `killsound`, `spray`).\n- Admin : `/vc pass addxp <joueur> <xp>`.\n\n## Ce qu'on peut acheter\n\n| Catégorie | Contenu |\n|---|---|\n| **Agents** | Tous offerts par défaut. Pour en faire payer : `progression.default-agents` (ex. `[JETT, PHOENIX, SOVA, BRIMSTONE, SAGE]`), `agent-price`. |\n| **Skins d'armes** | 6 collections × 18 armes (1 000 à 2 000 ◆), équipées arme par arme |\n| **Couteaux** | 14 couteaux du pack (600 à 2 500 ◆) |\n| **Cartes de joueur** | Une **bannière** par agent (couleur de l'agent, symbole de son rôle), 400 ◆ |\n| **Titres** | 12 titres (200 à 3 000 ◆) |\n| **Bannières d'élimination** | 8 styles : ❱ (offerte), ✦ ❤ ☠ ⚡ ✪ ⚔ ♛ |\n| **Sons d'élimination** | 7 sons : Valorant (offert), Carillon, Cloche, Xylophone, Pièces, Rétro 8-bit, Améthyste. Clic droit pour écouter. |\n| **Sprays** | Textes (GG offert, EZ, NICE, ☠, ❤, ?, ACE, VALOCRAFT) et emblèmes des 29 agents |\n\nPrix des bannières, sons et sprays : `progression.cosmetic-prices` (ex. `killbanner: {couronne: 1000}`).\n\n## Où on les voit\n\n- **Carte et titre** : écran de chargement, résumé de match, chat (titre devant le pseudo), statistiques, et pour la victime quand tu l'élimines.\n- **Bannière d'élimination** : à chaque élimination, ton symbole s'affiche autant de fois que tes éliminations du round, aux couleurs de ta carte.\n- **Son d'élimination** : la note monte à chaque élimination du round, son spécial au 5e.\n- **Spray** : **accroupi + F** en partie colle ton spray sur le mur, le sol ou le plafond visé (6 blocs). Un par round, toutes les 30 s dans les modes à réapparition ; ils disparaissent au round suivant.\n\n## Classé\n\nMode Compétition : rangs de Fer à Radiant, 5 parties de placement, RR selon le résultat, la performance et l'écart de niveau. Voir [Modes de jeu](page:modes). Le rang s'affiche dans le chat, la salle d'attente, l'écran de chargement, les statistiques et avec `/vc rang`.\n\n## Classements du lobby\n\nHologrammes mis à jour toutes les minutes, posés par un admin :\n\n```\n/vc leaderboard set <type>     à l'endroit où tu te trouves\n/vc leaderboard remove         retire le plus proche (5 blocs)\n/vc leaderboard list\n```\n\nTypes : `rank`, `kills`, `wins`, `acs` (à partir de 20 rounds), `headshots`, `aces`, `battlepass`. Réglages : `leaderboards.refresh`, `leaderboards.size`. Positions dans `plugins/Valocraft/leaderboards.yml`.\n", "fr/resource-pack": "# Pack de textures\n\n\nValocraft utilise le pack de textures **HrdaValorant** (son du Classic corrigé) ainsi que les modèles et textures Valocraft (armes, skins, fumées, lunette, flashs blancs). Il est **embarqué dans le jar du plugin**.\n\n## Fonctionnement par défaut\n\n1. Au démarrage, le pack est extrait dans `plugins/Valocraft/resourcepack.zip` (et remplacé automatiquement quand le plugin est mis à jour).\n2. Il est **servi sur le port Minecraft lui-même** et envoyé à chaque joueur à la connexion.\n3. Le lien de téléchargement reprend **l'adresse et le port utilisés par le joueur** pour se connecter.\n\nAucun port supplémentaire à ouvrir, et ça fonctionne sur **Pterodactyl**.\n\nUn joueur qui refuse le pack voit un message : sans lui, les armes, icônes de capacités et lunettes sont invisibles.\n\n## Commandes joueur\n\n| Commande | Effet |\n|---|---|\n| `/vc pack send` | (Re)recevoir le pack |\n| `/vc pack remove` | Retirer le pack |\n\n## Commandes admin\n\n| Commande | Effet |\n|---|---|\n| `/vc pack send <joueur\\|all>` | Envoyer le pack à un joueur ou à tout le monde |\n| `/vc pack remove <joueur\\|all>` | Retirer le pack pour un joueur ou tout le monde |\n| `/vc pack info` | Affiche le mode et le lien |\n| `/vc pack reload` | Recharge le pack après modification |\n\n## Alternatives\n\nÀ régler dans `config.yml` :\n\n| Objectif | Réglage |\n|---|---|\n| Utiliser un **port HTTP dédié** | `resource-pack.self-host.http-port: 8164` |\n| Utiliser une **URL externe** | `self-host.enabled: false`, puis `resource-pack.url` et `sha1` |\n\n## Lire la console\n\nPour chaque joueur, la console indique le **lien proposé** et la **réponse du client**, par exemple : `ACCEPTED`, `DECLINED`, `FAILED_DOWNLOAD`, `SUCCESSFULLY_LOADED`.\n\nVoir [Dépannage](page:troubleshooting) si le pack ne se charge pas, et [Développement](page:development) pour régénérer les ressources.\n", "fr/troubleshooting": "# Dépannage\n\n\n## Le pack de textures ne se charge pas\n\n1. Regarder la **console du serveur** : elle indique le lien proposé à chaque joueur et la réponse du client (`ACCEPTED`, `DECLINED`, `FAILED_DOWNLOAD`, `SUCCESSFULLY_LOADED`...).\n2. Demander au joueur de refaire `/vc pack send`.\n3. Admins : `/vc pack info` affiche le mode et le lien, `/vc pack reload` le recharge.\n4. Si l'hébergement sur le port Minecraft ne fonctionne pas chez vous, utiliser un port dédié (`resource-pack.self-host.http-port: 8164`) ou une URL externe. Voir [Pack de textures](page:resource-pack).\n\n## Une icône de capacité affiche le mauvais agent\n\nMettre à jour le plugin : le pack corrigé (icônes de Cove, Trademark / Rendezvous, FRAG/ment / FLASH/drive) est envoyé automatiquement. Si l'ancien pack reste en cache, faire `/vc pack send`.\n\n## Ma map ne démarre pas / n'est pas jouable\n\nFaire `/vc map info <id>` : la commande liste ce qui manque (salle d'attente, spawns, sites, murs, limites de joueurs, activation). Voir [Création de map](page:map-setup).\n\n## « Monde de la map introuvable »\n\nLe dossier du monde (`vc_<map>`) n'existe plus à côté du serveur, ou le nom de monde enregistré dans `maps/<id>.yml` (clé `world`) est faux. Les mondes ne sont plus chargés au démarrage : c'est normal de ne pas les voir dans `/mv list` ou équivalent tant qu'aucune partie n'est lancée.\n\n## Je ne vois pas mon propre skin d'agent en F5\n\nMinecraft n'accepte pour soi-même que des skins signés par Mojang. Les autres joueurs voient bien ton skin d'agent. Installer **SkinsRestorer** : les skins sont alors signés via MineSkin et visibles par tout le monde ([Installation](page:installation)). Le serveur doit avoir accès à Internet au premier démarrage.\n\n## Une partie lancée seule se termine tout de suite\n\nUtiliser `/vc forcestart` (et non `/vc start`) : une équipe vide n'est alors jamais considérée comme éliminée.\n\n## Ma capacité ne part pas quand j'appuie sur la touche\n\nC'est normal : la touche prend la capacité en main, le **clic gauche** l'utilise. Pour l'ancien comportement : `controls.instant-abilities: true` ([Contrôles](page:controls)).\n\n## Une map importée est refusée\n\nLa map a été sauvegardée dans une **version de Minecraft plus récente** que le serveur. Lotus, Sunset et Breeze demandent **Minecraft 1.21.11**. Voir [Import de maps](page:importing-maps).\n\n## Le tir ne continue pas quand je maintiens le clic gauche\n\nLe tir continu nécessite de viser un bloc à **64 blocs** ou moins. En visant le ciel, il faut cliquer. Vérifier `controls.continuous-fire` et `controls.semi-auto-hold` ([Contrôles](page:controls)).\n\n## Je ne peux ni tirer ni utiliser de capacités\n\nTu es peut-être **immobilisé**, **supprimé** ou **bloqué** (Lockdown, Thrash, ZERO/point, Steel Garden...), ou en train de piloter un drone. Voir le tableau des états sur [Agents](page:agents).\n\n## Un joueur a été exclu de la partie\n\nL'anti-AFK exclut un joueur qui ne bouge pas pendant 90 s (`afk.kick-after`). Un joueur déconnecté a 3 min pour revenir (`reconnect.timeout`).\n\n## Des joueurs ont perdu leurs objets après un crash\n\nLes inventaires sauvegardés pendant une partie sont dans `plugins/Valocraft/playerdata/` et **rendus à la reconnexion**. Les blocs temporaires (murs, spike, capacités) sont restaurés au prochain chargement du monde de la map.\n\n## J'ai mis à jour et quelque chose cloche\n\n- Ne garder que `Valocraft-2.2.jar` dans `plugins/`. Voir [Installation](page:installation).\n- Valocraft **1.x** n'est pas compatible avec la 2.x.\n\n## Toujours bloqué ?\n\nOuvrir une issue sur ce dépôt avec la version du serveur, la version de Valocraft et la partie utile de la console.\n", "fr/ultimate": "# Système d'ultime\n\n\nChaque agent a un ultime sur la touche **8** (X). Il coûte un certain nombre de **points d'ultime** (de 6 à 9 selon l'agent, indiqués sur la page [Agents](page:agents), modifiables dans `abilities.yml`).\n\n## Gagner des points\n\n- Les **éliminations**\n- Les **morts**\n- La **pose** et le **désamorçage** de la spike\n- Les **orbes d'ultime** (voir plus bas)\n- En Spike Rush : +1 point par round\n\nLes points sont **conservés à la mi-temps**.\n\n## Retours visuels et sonores\n\n| Moment | Ce qui se passe |\n|---|---|\n| Progression | Affichée en permanence dans la barre d'action (`X ●●●○○○`). La touche **8** montre l'ultime avec le nombre de points. |\n| **Ultime prête** | Titre à l'écran, son, et message à toute l'équipe. Les **ennemis** reçoivent une alerte dans le chat. |\n| **Ultime lancée** | Tout le monde entend la réplique de l'agent et le chat l'annonce. |\n| Tableau des scores | Les points d'ultime des alliés **et des ennemis** sont visibles (en rouge quand une ultime ennemie est prête). |\n\n## Utiliser l'ultime\n\nTouche **8** pour la prendre en main, **clic gauche** pour l'activer ([activation manuelle](page:controls)).\n\nCertaines ultimes transforment la touche 8 en arme tant qu'elles sont actives : Blade Storm, Hunter's Fury, Showstopper, Overdrive, Tour de Force (avec lunette au clic droit). **Blade Storm**, **Overdrive** et **Empress** sont prolongées ou rechargées par les éliminations. **Not Dead Yet** (Clove) s'active tout seul à la mort.\n\n## Orbes d'ultime\n\nLes orbes sont un élément de map placé par les admins.\n\n- **Placer** : `/vc map addorb <map>` à l'endroit où l'on se trouve.\n- **Tout retirer** : `/vc map clearorbs <map>`.\n- **Réapparition** : les orbes reviennent à **chaque round** (et en Team Deathmatch).\n- **Récupérer** : **maintenir clic droit 1,5 s** à côté d'un orbe pour gagner **+1 point d'ultime**.\n\n## Commandes admin\n\n| Commande | Effet |\n|---|---|\n| `/vc ult add <joueur> [points]` | Ajoute des points (1 par défaut) |\n| `/vc ult set <joueur> [points]` | Fixe les points ; sans nombre, l'ultime est pleine (avec les alertes « ultime prête ») |\n\nVoir [Création de map](page:map-setup) pour placer les orbes.\n", "fr/weapons": "# Armes\n\n\nToutes les armes ont un modèle 3D.\n\n## Arsenal\n\n| Catégorie | Armes |\n|---|---|\n| Mêlée | Knife (couteau) |\n| Pistolets | Classic, Ghost, Sheriff, Shorty, Frenzy |\n| SMG | Stinger, Spectre |\n| Fusils à pompe | Bucky, Judge |\n| Fusils d'assaut | Bulldog, Guardian, Phantom, Vandal |\n| Snipers | Marshal, Operator, Outlaw |\n| Armes lourdes | Ares, Odin |\n\nLes armes et charges s'achètent dans la boutique pendant la phase d'achat (`F`, ou `/vc shop`). Une arme trop chère peut être **demandée à un coéquipier** ([Déroulement du jeu](page:gameplay)).\n\n## Mécaniques\n\n| Mécanique | Fonctionnement |\n|---|---|\n| **Tir** | Hitscan, avec **compensation de latence** (jusqu'à 200 ms) |\n| **Précision** | L'imprécision augmente en déplacement ou en l'air et change accroupi. S'arrêter (ou s'accroupir) avant de tirer donne un tir précis. |\n| **Recul** | Montée puis balayage latéral, entièrement intégré à la trajectoire des balles (la vue ne bouge pas). |\n| **Dégâts** | Tête / corps / jambes, avec paliers selon la portée |\n| **Pénétration** | Les balles traversent les murs ; elles détruisent l'**utilitaire ennemi** touché (tourelle, caméra, pièges...) |\n| **Rechargement** | Touche **Q**. Progression sur la barre d'XP. |\n| **Visée / lunette** | Clic droit maintenu. Lunettes sur Operator, Marshal et Outlaw. Pas de lunette quand on est flashé. |\n| **Fusils à pompe** | Courte portée (Bucky, Judge) |\n| **Couteau** | **x3 dégâts** dans le dos |\n\n## Tir en maintenant le clic\n\nMaintenir le clic gauche en visant un bloc à moins de 64 blocs fait tirer l'arme à sa cadence réelle. Aucun bloc n'est abîmé et l'animation du bras est masquée. Les semi-automatiques tirent à leur cadence maximale tant que le clic est maintenu. Voir [Contrôles](page:controls).\n\n## Lunettes\n\nL'Operator, le Marshal, l'Outlaw et l'ultime de Chamber (Tour de Force) utilisent une lunette plein écran 16:9 : lentille ronde nette, noir autour, réticule fin et point rouge. Elle est portée par le casque et ne clignote pas.\n\n## Skins\n\nLa boutique du lobby propose six collections pour les 18 armes : Prime, Reaver, Glitchpop, Ion, Elderflame et Oni, ainsi que 14 couteaux. Les skins s'achètent et s'équipent arme par arme ; une arme ramassée garde le skin de son propriétaire. Voir [Progression et cosmétiques](page:progression).\n\n## Modèles\n\n- **Pack HrdaValorant** : Classic, Ghost, Sheriff, Spectre, Vandal, Ares, Operator, couteaux, boucliers.\n- **Modèles Valocraft**, créés pour le projet : Shorty, Frenzy, Stinger, Bucky, Judge, Bulldog, Guardian, Phantom, Marshal, Outlaw, Odin (composant `item_model`).\n\n## Réglages\n\nToutes les statistiques (dégâts, cadence, imprécision, recul, pénétration, zoom...) sont dans `weapons.yml`, commentées en tête du fichier. Recharger avec `/vc reload`. Pour tester, utiliser le [Stand de tir](page:practice-range).\n", "fr/ziplines": "# Tyroliennes\n\n\nLes tyroliennes sont un élément de map : une corde entre deux points sur laquelle les joueurs peuvent glisser. Elles peuvent être **horizontales, montantes ou descendantes**.\n\n## Utiliser une tyrolienne (joueurs)\n\n| Action | Touche |\n|---|---|\n| S'accrocher | **F**, près de la corde |\n| Glisser | **Avancer / reculer**, dans un sens ou dans l'autre selon où tu regardes |\n| Lâcher | **Saut** ou **accroupi** |\n\n- Arrivé au bout de la corde, le joueur est déposé sur la plateforme.\n- On **peut tirer** pendant le trajet.\n\n## Créer une tyrolienne (admins)\n\n1. Prendre la baguette : `/vc wand`.\n2. **Clic gauche** sur un bloc pour le point **A**, **clic droit** sur un bloc pour le point **B**. Les points sont les **centres des blocs cliqués**.\n3. Lancer :\n\n```\n/vc map addzipline <map>\n```\n\n### Gérer les tyroliennes\n\n```\n/vc map ziplines <map>               lister les tyroliennes\n/vc map removezipline <map> <n>      retirer la tyrolienne numéro n\n```\n\n## Notes techniques\n\nChaque tyrolienne est **une seule entité d'affichage**, et le déplacement est **interpolé côté client**. C'est fluide et peu coûteux pour le serveur.\n\nVoir aussi [Création de map](page:map-setup).\n"}</script>
<script>
// ---------- Navigation (slug -> titles). Page content lives in pages/<lang>/<slug>.md ----------
const NAV=[
 [{en:'Getting started',fr:'Démarrage'},[['home','Home','Accueil'],['installation','Installation','Installation'],['lobby','Lobby and Matchmaking','Lobby et matchmaking']]],
 [{en:'Playing',fr:'Jouer'},[['gameplay','Gameplay','Déroulement du jeu'],['modes','Game Modes','Modes de jeu'],['controls','Controls','Contrôles'],['agents','Agents','Agents'],['ultimate','Ultimate System','Système d\'ultime'],['weapons','Weapons','Armes'],['progression','Progression and Cosmetics','Progression et cosmétiques'],['ziplines','Ziplines','Tyroliennes']]],
 [{en:'Server admin',fr:'Administration'},[['map-setup','Map Setup','Création de map'],['importing-maps','Importing Maps','Import de maps'],['resource-pack','Resource Pack','Pack de textures'],['commands','Commands and Permissions','Commandes et permissions'],['configuration','Configuration','Configuration'],['practice-range','Practice Range','Stand de tir']]],
 [{en:'Help',fr:'Aide'},[['troubleshooting','Troubleshooting','Dépannage'],['development','Development','Développement'],['changelog','Changelog','Changelog']]]
];
const UI={en:{nf:'Page not found.',err:'Could not load this page.'},fr:{nf:'Page introuvable.',err:'Impossible de charger cette page.'}};
const $=s=>document.querySelector(s), cache={};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let lang=localStorage.getItem('vc-lang')||((navigator.language||'en').toLowerCase().startsWith('fr')?'fr':'en');
let slug='home';

// ---------- Minimal Markdown renderer ----------
function inl(s){
  const k=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{k.push('<code>'+esc(c)+'</code>');return '\u0002'+(k.length-1)+'\u0002'});
  s=esc(s)
   .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">')
   .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,u)=>{
     if(u.startsWith('page:'))return `<a href="#/${lang}/${u.slice(5)}">${t}</a>`;
     return `<a href="${u}" target="_blank" rel="noopener">${t}</a>`})
   .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
   .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,:;]|$)/g,'$1<em>$2</em>');
  return s.replace(/\u0002(\d+)\u0002/g,(m,i)=>k[i]);
}
function md(src){
  const codes=[];
  src=src.replace(/```\w*\n([\s\S]*?)```/g,(m,c)=>{codes.push('<pre><code>'+esc(c)+'</code></pre>');return '\n\u0000'+(codes.length-1)+'\u0000\n'});
  const L=src.split('\n'),out=[],blk=l=>/^(#{1,4} |>|\||[-*] |\d+\. |---+$|<|\u0000)/.test(l);
  let i=0;
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    if(/^\u0000\d+\u0000$/.test(l)){out.push(codes[+l.slice(1,-1)]);i++;continue}
    if(l[0]==='<'){const b=[];while(i<L.length&&L[i].trim()){b.push(L[i]);i++}out.push(b.join('\n'));continue}
    let m=l.match(/^(#{1,4}) (.*)/);
    if(m){out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^---+$/.test(l)){out.push('<hr>');i++;continue}
    if(l[0]==='>'){const b=[];while(i<L.length&&L[i][0]==='>'){b.push(L[i].replace(/^>\s?/,''));i++}out.push('<blockquote>'+inl(b.join(' '))+'</blockquote>');continue}
    if(l[0]==='|'){
      const rows=[];while(i<L.length&&L[i][0]==='|'){rows.push(L[i]);i++}
      const cells=r=>r.trim().replace(/\\\|/g,'\u0001').replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim().replace(/\u0001/g,'|')));
      const h=cells(rows[0]),body=rows.slice(2).map(cells);
      out.push('<table><thead><tr>'+h.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table>');continue}
    if(/^([-*]|\d+\.) /.test(l)){
      const ol=/^\d/.test(l),b=[];
      while(i<L.length&&/^([-*]|\d+\.) /.test(L[i])){b.push(L[i].replace(/^([-*]|\d+\.) /,''));i++}
      out.push((ol?'<ol>':'<ul>')+b.map(x=>`<li>${inl(x)}</li>`).join('')+(ol?'</ol>':'</ul>'));continue}
    const p=[];while(i<L.length&&L[i].trim()&&(!blk(L[i])||!p.length)){p.push(L[i]);i++}
    out.push('<p>'+inl(p.join(' '))+'</p>');
  }
  return out.join('\n');
}

// ---------- Router ----------
function buildNav(){
  $('#nav').innerHTML=NAV.map(([g,items])=>`<h4>${g[lang]}</h4>`+items.map(([s,e,f])=>`<a href="#/${lang}/${s}" class="${s===slug?'on':''}">${lang==='fr'?f:e}</a>`).join('')).join('');
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.documentElement.lang=lang;
}
async function route(){
  const m=location.hash.match(/^#\/(en|fr)\/([\w-]+)$/);
  if(!m){const u=`#/${lang}/home`;try{history.replaceState(null,'',u);return route()}catch(e){location.hash=u;return}}
  lang=m[1];slug=m[2];localStorage.setItem('vc-lang',lang);
  buildNav();$('#nav').classList.remove('open');
  const known=NAV.some(g=>g[1].some(x=>x[0]===slug)),key=lang+'/'+slug,main=$('#main');
  try{
    if(!known)throw 404;
    if(!cache[key]){if(window.PAGES&&PAGES[key]!=null)cache[key]=PAGES[key];else{const r=await fetch(`pages/${key}.md`);if(!r.ok)throw r.status;cache[key]=await r.text()}}
    main.innerHTML=md(cache[key]);
    const t=NAV.flatMap(g=>g[1]).find(x=>x[0]===slug);
    document.title=(slug==='home'?'':(lang==='fr'?t[2]:t[1])+' – ')+'Valocraft Wiki';
  }catch(e){main.innerHTML=`<h1>${e===404?UI[lang].nf:UI[lang].err}</h1><p><a href="#/${lang}/home">← ${lang==='fr'?'Accueil':'Home'}</a></p>`}
  scrollTo(0,0);
}
const mq=matchMedia('(prefers-color-scheme:dark)');
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':mq.matches};
const paintTheme=()=>{$('#theme').textContent=isDark()?'☀️':'🌙'};
$('#theme').onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('vc-theme',t)}catch(e){}paintTheme()};
mq.addEventListener('change',paintTheme);paintTheme();
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{location.hash=`#/${b.dataset.l}/${slug}`});
$('#menu').onclick=()=>$('#nav').classList.toggle('open');
addEventListener('hashchange',route);
route();
</script>
</body>
</html>
