n| 🔨 **Créer une partie** (enclume) | Choisis une map libre et deviens l'**hôte**. |\n| 💎 **Boutique** | Dépenser de la Radianite pour débloquer des agents et acheter des skins. Aussi accessible avec `/vc boutique`. |\n\nLe lobby propose aussi une boussole « Jouer » (menu des parties et partie rapide), une salle d'attente par map, le choix d'équipe et un compte à rebours.\n\n## Héberger une partie\n\n1. Utiliser l'**enclume** (Créer une partie) et choisir une map libre.\n2. Tu deviens l'hôte. Les autres joueurs rejoignent avec l'étoile ou `/vc join <map>`.\n3. L'hôte reçoit un **objet vert** qui lance la partie dès **2 joueurs**.\n\n## Rejoindre par commande\n\n| Commande | Effet |\n|---|---|\n| `/vc join` | Ouvre le menu des parties |\n| `/vc join <map>` | Rejoint une map précise |\n| `/vc list` | Liste les parties |\n| `/vc leave` | Quitte la partie |\n\n## Après le compte à rebours\n\nUne **phase de sélection d'agent (25 s)** s'ouvre. Voir [Agents](page:agents).\n\n## Statistiques\n\nLes stats sont suivies par joueur et enregistrées dans `plugins/Valocraft/stats.yml` :\n\n- Éliminations / morts (K/D)\n- Pourcentage de tirs à la tête\n- Victoires\n- MVP\n- Agent favori\n- Classements\n\n## Radianite et déblocages\n\nLa Radianite est attribuée en fin de partie. Victoires, défaites, éliminations, assists, rounds gagnés et récompenses MVP contribuent au gain ; les montants sont configurables. Cinq agents (Phoenix, Jett, Sova, Brimstone et Sage) sont offerts par défaut ; chacun des dix autres coûte 1 000 ◆ par défaut. La boutique propose aussi six collections de skins pour les 18 armes. Les skins s'achètent et s'équipent arme par arme ; une arme ramassée garde le skin de son propriétaire. Un clic de confirmation est requis pour acheter. Les prix, gains et agents offerts se règlent dans `progression` de `config.yml`.\n", "fr/map-setup": "# Création de map\n\n\nLes maps se configurent **en jeu** avec `/vc map ...` et la baguette de sélection. Cette page construit une map nommée `ascent` de zéro. Pour éviter de la construire, voir [Import de maps](page:importing-maps).\n\n## Ce qu'il faut pour qu'une map soit jouable\n\n- Une **salle d'attente**\n- Des spawns **attaque** et **défense** (5 chacun en général)\n- Au moins un **site de spike** (A, B, C...)\n- Des **murs de pré-round**\n- Les limites de joueurs\n- Être **activée**\n\n`/vc map info <id>` liste exactement ce qui manque.\n\n## Déroulé complet\n\n```\n/vc map create ascent\n/vc map setname ascent Ascent\n/vc map setwaiting ascent            (salle d'attente = ta position)\n/vc map addspawn ascent attack       (répéter pour chaque joueur, 5 en général)\n/vc map addspawn ascent defend\n/vc wand                             (clic gauche = pos1, clic droit = pos2)\n/vc map addsite ascent A             (sélection = zone de pose du site A)\n/vc map addsite ascent B\n/vc map addwall ascent               (sélection = mur de pré-round, verre vert par défaut)\n/vc map addwall ascent light_blue_stained_glass\n/vc map previewwalls ascent          (afficher / masquer les murs pour vérifier)\n/vc map setplayers ascent 2 10\n/vc map setmusic ascent hrdavalorant.maps.ascent\n/vc map addorb ascent                (orbes d'ultime, optionnel)\n/vc map addzipline ascent            (tyroliennes, optionnel)\n/vc map enable ascent\n```\n\n## Étape par étape\n\n### 1. Créer et nommer\n\n`/vc map create <id>` puis `/vc map setname <id> <nom affiché>`.\n\n### 2. Salle d'attente et spawns\n\nSe placer à l'endroit voulu et faire `/vc map setwaiting <id>`. Répéter `/vc map addspawn <id> attack` et `/vc map addspawn <id> defend` à chaque position de spawn.\n\n### 3. Sites de spike\n\n1. `/vc wand`\n2. **Clic gauche** = pos1, **clic droit** = pos2.\n3. `/vc map addsite <id> A` (et `B`, `C`...). La sélection devient la zone de pose.\n\n### 4. Murs de pré-round\n\nSélectionner la zone avec la baguette, puis `/vc map addwall <id> [bloc]`. Le bloc par défaut est le **verre vert** ; indiquer un autre bloc comme `light_blue_stained_glass` pour changer.\n\n- Les murs ne remplissent que les blocs **vides** de la zone et sont retirés à l'identique au début du round : la map n'est **jamais abîmée**.\n- `/vc map previewwalls <id>` affiche ou masque un aperçu pour vérifier le placement.\n\n### 5. Joueurs et musique\n\n`/vc map setplayers <id> <min> <max>` règle le nombre de joueurs, et `/vc map setmusic <id> <son>` la musique.\n\n### 6. Options\n\n- [Orbes d'ultime](page:ultimate) : `/vc map addorb <id>` / `/vc map clearorbs <id>`\n- [Tyroliennes](page:ziplines)\n- La zone de la carte tactique est calculée depuis les spawns, sites, murs et orbes. Pour la régler, sélectionner la zone avec la baguette et faire `/vc map setminimap <id>`. `/vc map clearminimap <id>` rétablit le calcul automatique.\n\n### 7. Activer\n\n`/vc map enable <id>`.\n\n## Protection en cas de crash\n\nLes blocs posés (murs, spike) sont **enregistrés sur disque** dans `plugins/Valocraft/data/` et **restaurés si le serveur plante**.\n\n## Voir aussi\n\n- [Commandes et permissions](page:commands)\n- [Import de maps](page:importing-maps)\n", "fr/practice-range": "# Stand de tir\n\n\nHors partie, une arme obtenue avec `/vc give` tire sur les **mobs et les armor stands**. Elle ne tire jamais sur les joueurs.\n\nChaque tir touché affiche :\n\n- La **zone** touchée\n- Les **dégâts** infligés\n- La **distance**\n\nC'est le moyen le plus simple de régler `weapons.yml` avant d'ouvrir une partie.\n\n## Utilisation\n\n```\n/vc give <arme> [joueur]\n```\n\nTirer sur des mobs ou des armor stands, ajuster `weapons.yml`, puis `/vc reload`.\n\n## Désactivation\n\nRégler `weapons.practice-mode` dans `config.yml` pour le désactiver. Voir [Configuration](page:configuration).\n\nVoir aussi : [Armes](page:weapons).\n", "fr/resource-pack": "# Pack de textures\n\n\nValocraft utilise le pack de textures **HrdaValorant** (son du Classic corrigé) ainsi que les modèles d'armes Valocraft. Il est **embarqué dans le jar du plugin**.\n\n## Fonctionnement par défaut\n\n1. Au premier démarrage, le pack est extrait dans `plugins/Valocraft/resourcepack.zip`.\n2. Il est **servi sur le port Minecraft lui-même** et envoyé à chaque joueur à la connexion.\n3. Le lien de téléchargement reprend **l'adresse et le port utilisés par le joueur** pour se connecter.\n\nAucun port supplémentaire à ouvrir, et ça fonctionne sur **Pterodactyl**. Le pack est mis à jour automatiquement avec le plugin.\n\n## Commandes joueur\n\n| Commande | Effet |\n|---|---|\n| `/vc pack send` | (Re)recevoir le pack |\n| `/vc pack remove` | Retirer le pack |\n\n## Commandes admin\n\n| Commande | Effet |\n|---|---|\n| `/vc pack send <joueur\\|all>` | Envoyer le pack à un joueur ou à tout le monde |\n| `/vc pack remove <joueur\\|all>` | Retirer le pack pour un joueur ou tout le monde |\n| `/vc pack info` | Affiche le mode et le lien |\n| `/vc pack reload` | Recharge le pack après modification |\n\n## Alternatives\n\nÀ régler dans `config.yml` :\n\n| Objectif | Réglage |\n|---|---|\n| Utiliser un **port HTTP dédié** | `resource-pack.self-host.http-port: 8164` |\n| Utiliser une **URL externe** | `self-host.enabled: false`, puis `resource-pack.url` et `sha1` |\n\n## Lire la console\n\nPour chaque joueur, la console indique le **lien proposé** et la **réponse du client**, par exemple : `ACCEPTED`, `DECLINED`, `FAILED_DOWNLOAD`, `SUCCESSFULLY_LOADED`.\n\nVoir [Dépannage](page:troubleshooting) si le pack ne se charge pas.\n", "fr/troubleshooting": "# Dépannage\n\n\n## Le pack de textures ne se charge pas\n\n1. Regarder la **console du serveur** : elle indique le lien proposé à chaque joueur et la réponse du client (`ACCEPTED`, `DECLINED`, `FAILED_DOWNLOAD`, `SUCCESSFULLY_LOADED`...).\n2. Demander au joueur de refaire `/vc pack send` pour le recevoir à nouveau.\n3. Admins : `/vc pack info` affiche le mode et le lien, `/vc pack reload` le recharge.\n4. Si l'hébergement sur le port Minecraft ne fonctionne pas chez vous, utiliser un port dédié (`resource-pack.self-host.http-port: 8164`) ou une URL externe. Voir [Pack de textures](page:resource-pack).\n\n## Ma map ne démarre pas / n'est pas jouable\n\nFaire `/vc map info <id>` : la commande liste ce qui manque (salle d'attente, spawns, sites, murs, limites de joueurs, activation). Voir [Création de map](page:map-setup).\n\n## Une map importée est refusée\n\nLa map a été sauvegardée dans une **version de Minecraft plus récente** que le serveur. Lotus, Sunset et Breeze demandent **Minecraft 1.21.11**. Voir [Import de maps](page:importing-maps).\n\n## Les armes automatiques tirent lentement\n\nMinecraft envoie **un signal par clic gauche** : avec le tir au clic gauche, les armes automatiques tirent donc au rythme des clics. Pour un tir en maintenant le bouton, mettre `controls.fire-button: RIGHT` dans `config.yml`. Voir [Contrôles](page:controls).\n\n## Mon écran « revient en arrière » pendant les rafales\n\nCorrigé dans la **2.1** : le recul ne déplace plus la caméra et est appliqué entièrement à la trajectoire des balles. Mettre à jour en 2.1. Voir [Armes](page:weapons).\n\n## Je ne peux ni tirer ni utiliser de capacités\n\nTu es peut-être **immobilisé** (Lockdown ou Thrash). Voir le tableau des états sur [Agents](page:agents).\n\n## Des joueurs ont perdu leurs objets après un crash\n\nLes inventaires sauvegardés pendant une partie sont dans `plugins/Valocraft/playerdata/` et **rendus à la reconnexion**. Les blocs temporaires (murs, spike) de `plugins/Valocraft/data/` sont restaurés automatiquement.\n\n## J'ai mis à jour et quelque chose cloche\n\n- Retirer l'ancien jar du plugin pour ne garder que `Valocraft-2.2.jar` dans `plugins/`. Voir [Installation](page:installation).\n- Valocraft **1.x** n'est pas compatible avec la 2.x.\n\n## Le tir ne continue pas quand je maintiens le clic gauche\n\nLe tir continu nécessite de viser un bloc à **64 blocs** ou moins. Si tu vises le ciel ou qu'aucun bloc n'est à portée, clique pour tirer une seule balle. Vérifie `controls.continuous-fire` et `controls.semi-auto-hold` dans `config.yml` ; voir [Contrôles](page:controls).\n\n## Toujours bloqué ?\n\nOuvrir une issue sur ce dépôt avec la version du serveur, la version de Valocraft et la partie utile de la console.\n", "fr/ultimate": "# Système d'ultime\n\n\nChaque agent a un ultime sur la touche **8** (X). Il coûte un certain nombre de **points d'ultime** (de 6 à 9 selon l'agent, indiqués sur la page [Agents](page:agents)).\n\n## Gagner des points\n\nLes points d'ultime se gagnent avec :\n\n- Les **éliminations**\n- Les **morts**\n- La **pose de la spike**\n- Le **désamorçage de la spike**\n- Les **orbes d'ultime** (voir plus bas)\n\nLes points sont **conservés à la mi-temps**.\n\n## Retours visuels et sonores\n\n| Moment | Ce qui se passe |\n|---|---|\n| Progression | Affichée en permanence dans la barre d'action (`X ●●●○○○`). La touche **8** montre l'ultime de l'agent avec le nombre de points. |\n| **Ultime prête** | Titre à l'écran, son, et message à toute l'équipe. |\n| **Ultime lancée** | Tout le monde entend la réplique de l'agent (pack HrdaValorant) et le chat l'annonce. |\n\n## Ultimes qui transforment la touche 8\n\nCertaines ultimes transforment la touche 8 en arme tant qu'elles sont actives :\n\n- Blade Storm\n- Hunter's Fury\n- Showstopper\n- Overdrive\n\n**Blade Storm**, **Overdrive** et **Empress** sont prolongées ou rechargées par les **éliminations**.\n\n## Ultimes instantanées\n\nElles s'activent dès qu'on appuie sur la touche : **Run it Back**, **Empress**, **Lockdown**, **Viper's Pit** et **Seekers**.\n\n## Orbes d'ultime\n\nLes orbes sont un élément de map placé par les admins.\n\n- **Placer** : `/vc map addorb <map>` à l'endroit où l'on se trouve.\n- **Tout retirer** : `/vc map clearorbs <map>`.\n- **Réapparition** : les orbes reviennent à **chaque round**.\n- **Récupérer** : **maintenir clic droit 1,5 s** à côté d'un orbe pour gagner **+1 point d'ultime**.\n\nVoir [Création de map](page:map-setup) pour le déroulé complet.\n", "fr/weapons": "# Armes\n\n\nToutes les armes ont un modèle 3D.\n\n## Arsenal\n\n| Catégorie | Armes |\n|---|---|\n| Mêlée | Knife (couteau) |\n| Pistolets | Classic, Ghost, Sheriff, Shorty, Frenzy |\n| SMG | Stinger, Spectre |\n| Fusils à pompe | Bucky, Judge |\n| Fusils d'assaut | Bulldog, Guardian, Phantom, Vandal |\n| Snipers | Marshal, Operator, Outlaw |\n| Armes lourdes | Ares, Odin |\n\nLes armes et charges s'achètent dans la boutique pendant la phase d'achat (`F`, ou `/vc shop`).\n\n## Mécaniques\n\n| Mécanique | Fonctionnement |\n|---|---|\n| **Tir** | Hitscan |\n| **Précision** | L'imprécision dépend du mouvement : elle augmente en déplacement ou en l'air, et change en position accroupie. S'arrêter (ou s'accroupir) avant de tirer donne un tir précis ; courir ou sauter le rend imprécis. |\n| **Recul** | Montée puis balayage latéral. Entièrement intégré à la trajectoire des balles. |\n| **Dégâts** | Tête / corps / jambes, avec paliers selon la portée |\n| **Pénétration** | Les balles traversent les murs |\n| **Rechargement** | Touche **Q**. La progression s'affiche sur la barre d'XP. |\n| **Visée / lunette** | Clic droit maintenu. Lunettes sur Operator, Marshal et Outlaw. |\n| **Fusils à pompe** | Armes de courte portée (Bucky, Judge) |\n| **Couteau** | **x3 dégâts** dans le dos |\n\n## Recul et caméra\n\nLe recul **ne déplace jamais la vue du joueur**. Le serveur ne peut imposer qu'une orientation absolue, ce qui faisait « revenir » l'écran en arrière pendant les rafales. Dans la 2.1, tout le recul est appliqué à la **trajectoire des balles**.\n\n## Tir en maintenant le clic (2.2)\n\nMaintenir le clic gauche en visant un bloc à moins de 64 blocs fait tirer l'arme à sa cadence réelle. Aucun bloc n'est miné ou abîmé et l'animation du bras est masquée. Les armes semi-automatiques tirent à leur cadence maximale tant que le clic est maintenu. Sans bloc visé à portée, un clic tire une seule balle. Voir [Contrôles](page:controls) et [Configuration](page:configuration).\n\n## Skins\n\nLa boutique du lobby propose six collections pour les 18 armes : Prime, Reaver, Glitchpop, Ion, Elderflame et Oni. Les skins coûtent de 1 000 à 2 000 Radianites, s'achètent et s'équipent arme par arme, et restent sur l'arme lorsqu'elle est lâchée par son propriétaire. Voir [Lobby et matchmaking](page:lobby).\n\n## Lunettes des snipers\n\nL'Operator, le Marshal et l'Outlaw utilisent une lunette plein écran au format 16:9, avec lentille circulaire nette, noir autour, réticule fin et point rouge. Elle ne clignote plus pendant les mises à jour de l'inventaire.\n\n## Modèles\n\n- **Pack HrdaValorant** : Classic, Ghost, Sheriff, Spectre, Vandal, Ares, Operator, couteau (et ses skins `model-data` 2 à 15), boucliers.\n- **Modèles Valocraft**, créés pour le projet (`assets/valocraft` du pack) : Shorty, Frenzy, Stinger, Bucky, Judge, Bulldog, Guardian, Phantom, Marshal, Outlaw, Odin. Ils utilisent le composant `item_model` (`item-model: valocraft:<arme>`, automatique).\n\nLes sources et outils des modèles sont décrits dans [Développement](page:development).\n\n## Réglages\n\nToutes les statistiques (dégâts, cadence, imprécision, recul, pénétration, zoom...) sont dans `weapons.yml`, commentées en tête du fichier. Recharger avec `/vc reload`. Pour tester sans risque, utiliser le [Stand de tir](page:practice-range).\n", "fr/ziplines": "# Tyroliennes\n\n\nLes tyroliennes sont un élément de map : une corde entre deux points sur laquelle les joueurs peuvent glisser. Elles peuvent être **horizontales, montantes ou descendantes**.\n\n## Utiliser une tyrolienne (joueurs)\n\n| Action | Touche |\n|---|---|\n| S'accrocher | **F**, près de la corde |\n| Glisser | **Avancer / reculer**, dans un sens ou dans l'autre selon où tu regardes |\n| Lâcher | **Saut** ou **accroupi** |\n\n- Arrivé au bout de la corde, le joueur est déposé sur la plateforme.\n- On **peut tirer** pendant le trajet.\n\n## Créer une tyrolienne (admins)\n\n1. Prendre la baguette : `/vc wand`.\n2. **Clic gauche** sur un bloc pour le point **A**, **clic droit** sur un bloc pour le point **B**. Les points sont les **centres des blocs cliqués**.\n3. Lancer :\n\n```\n/vc map addzipline <map>\n```\n\n### Gérer les tyroliennes\n\n```\n/vc map ziplines <map>               lister les tyroliennes\n/vc map removezipline <map> <n>      retirer la tyrolienne numéro n\n```\n\n## Notes techniques\n\nChaque tyrolienne est **une seule entité d'affichage**, et le déplacement est **interpolé côté client**. C'est fluide et peu coûteux pour le serveur.\n\nVoir aussi [Création de map](page:map-setup).\n"}</script>

let lang=localStorage.getItem('vc-lang')||((navigator.language||'en').toLowerCase().startsWith('fr')?'fr':'en');

// ---------- Minimal Markdown renderer ----------
function inl(s){
  const k=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{k.push('<code>'+esc(c)+'</code>');return '\u0002'+(k.length-1)+'\u0002'});
  s=esc(s)
   .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">')
   .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,u)=>{
     if(u.startsWith('page:'))return `<a href="#/${lang}/${u.slice(5)}">${t}</a>`;
     return `<a href="${u}" target="_blank" rel="noopener">${t}</a>`})
   .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
   .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,:;]|$)/g,'$1<em>$2</em>');
  return s.replace(/\u0002(\d+)\u0002/g,(m,i)=>k[i]);
}
function md(src){
  const codes=[];
  src=src.replace(/```\w*\n([\s\S]*?)```/g,(m,c)=>{codes.push('<pre><code>'+esc(c)+'</code></pre>');return '\n\u0000'+(codes.length-1)+'\u0000\n'});
  const L=src.split('\n'),out=[],blk=l=>/^(#{1,4} |>|\||[-*] |\d+\. |---+$|<|\u0000)/.test(l);
  let i=0;
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    if(/^\u0000\d+\u0000$/.test(l)){out.push(codes[+l.slice(1,-1)]);i++;continue}
    if(l[0]==='<'){const b=[];while(i<L.length&&L[i].trim()){b.push(L[i]);i++}out.push(b.join('\n'));continue}
    let m=l.match(/^(#{1,4}) (.*)/);
    if(m){out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^---+$/.test(l)){out.push('<hr>');i++;continue}
    if(l[0]==='>'){const b=[];while(i<L.length&&L[i][0]==='>'){b.push(L[i].replace(/^>\s?/,''));i++}out.push('<blockquote>'+inl(b.join(' '))+'</blockquote>');continue}
    if(l[0]==='|'){
      const rows=[];while(i<L.length&&L[i][0]==='|'){rows.push(L[i]);i++}
      const cells=r=>r.trim().replace(/\\\|/g,'\u0001').replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim().replace(/\u0001/g,'|')));
      const h=cells(rows[0]),body=rows.slice(2).map(cells);
      out.push('<table><thead><tr>'+h.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table>');continue}
    if(/^([-*]|\d+\.) /.test(l)){
      const ol=/^\d/.test(l),b=[];
      while(i<L.length&&/^([-*]|\d+\.) /.test(L[i])){b.push(L[i].replace(/^([-*]|\d+\.) /,''));i++}
      out.push((ol?'<ol>':'<ul>')+b.map(x=>`<li>${inl(x)}</li>`).join('')+(ol?'</ol>':'</ul>'));continue}
    const p=[];while(i<L.length&&L[i].trim()&&(!blk(L[i])||!p.length)){p.push(L[i]);i++}
    out.push('<p>'+inl(p.join(' '))+'</p>');
  }
  return out.join('\n');
}

// ---------- Router ----------
function buildNav(){
  $('#nav').innerHTML=NAV.map(([g,items])=>`<h4>${g[lang]}</h4>`+items.map(([s,e,f])=>`<a href="#/${lang}/${s}" class="${s===slug?'on':''}">${lang==='fr'?f:e}</a>`).join('')).join('');
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.documentElement.lang=lang;
}
async function route(){
  const m=location.hash.match(/^#\/(en|fr)\/([\w-]+)$/);
  if(!m){const u=`#/${lang}/home`;try{history.replaceState(null,'',u);return route()}catch(e){location.hash=u;return}}
  lang=m[1];slug=m[2];localStorage.setItem('vc-lang',lang);
  buildNav();$('#nav').classList.remove('open');
  const known=NAV.some(g=>g[1].some(x=>x[0]===slug)),key=lang+'/'+slug,main=$('#main');
  try{
    if(!known)throw 404;
    if(!cache[key]){if(window.PAGES&&PAGES[key]!=null)cache[key]=PAGES[key];else{const r=await fetch(`pages/${key}.md`);if(!r.ok)throw r.status;cache[key]=await r.text()}}
    main.innerHTML=md(cache[key]);
    const t=NAV.flatMap(g=>g[1]).find(x=>x[0]===slug);
    document.title=(slug==='home'?'':(lang==='fr'?t[2]:t[1])+' – ')+'Valocraft Wiki';
  }catch(e){main.innerHTML=`<h1>${e===404?UI[lang].nf:UI[lang].err}</h1><p><a href="#/${lang}/home">← ${lang==='fr'?'Accueil':'Home'}</a></p>`}
  scrollTo(0,0);
}
const mq=matchMedia('(prefers-color-scheme:dark)');
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':mq.matches};
const paintTheme=()=>{$('#theme').textContent=isDark()?'☀️':'🌙'};
$('#theme').onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('vc-theme',t)}catch(e){}paintTheme()};
mq.addEventListener('change',paintTheme);paintTheme();
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{location.hash=`#/${b.dataset.l}/${slug}`});
$('#menu').onclick=()=>$('#nav').classList.toggle('open');
addEventListener('hashchange',route);
route();
</script>
