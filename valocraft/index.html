<script id="pages-data">window.PAGES={"en/weapons": "# Weapons\n\n\nEvery weapon has a 3D model.\n\n## Arsenal\n\n| Category | Weapons |\n|---|---|\n| Melee | Knife |\n| Sidearms | Classic, Ghost, Sheriff, Shorty, Frenzy |\n| SMGs | Stinger, Spectre |\n| Shotguns | Bucky, Judge |\n| Rifles | Bulldog, Guardian, Phantom, Vandal |\n| Snipers | Marshal, Operator, Outlaw |\n| Heavies | Ares, Odin |\n\nWeapons and charges are bought in the shop during the buy phase (`F`, or `/vc shop`).\n\n## Mechanics\n\n| Mechanic | Behavior |\n|---|---|\n| **Shooting** | Hitscan |\n| **Accuracy** | Spread depends on movement: it grows when moving or in the air, and differs when crouching. Stop (or crouch) before shooting for accurate shots. Running or jumping makes them inaccurate. |\n| **Recoil** | Climb, then lateral sweep. Built entirely into the bullet trajectory. |\n| **Damage** | Head / body / legs, with range falloff tiers |\n| **Penetration** | Bullets can go through walls |\n| **Reload** | Reload with **Q**. Progress shows on the XP bar. |\n| **Aim / scope** | Hold right click. Scopes on Operator, Marshal and Outlaw. |\n| **Shotguns** | Close-range weapons (Bucky, Judge) |\n| **Knife** | **x3 damage** from behind |\n\n## Recoil and the camera\n\nRecoil **never moves the player's view**. The server can only force an absolute camera orientation, which made the screen snap back during bursts. In 2.1 all recoil is applied to the **bullet path** instead.\n\n## Models\n\n- **HrdaValorant pack**: Classic, Ghost, Sheriff, Spectre, Vandal, Ares, Operator, Knife (and its `model-data` skins 2 to 15), shields.\n- **Valocraft models**, made for this project (`assets/valocraft` in the pack): Shorty, Frenzy, Stinger, Bucky, Judge, Bulldog, Guardian, Phantom, Marshal, Outlaw, Odin. They use the `item_model` component (`item-model: valocraft:<weapon>`, automatic).\n\nModel sources and tools are covered in [Development](page:development).\n\n## Tuning\n\nAll stats (damage, fire rate, spread, recoil, penetration, zoom...) live in `weapons.yml`, with comments at the top of the file. Reload with `/vc reload`. To test changes safely, use the [Practice Range](page:practice-range).\n", "en/configuration": "# Configuration\n\n\nFiles live in `plugins/Valocraft/`. Reload `config.yml` and `weapons.yml` with `/vc reload`.\n\n## Files and folders\n\n| Path | Purpose |\n|---|---|\n| `config.yml` | General settings, controls, resource pack, map library |\n| `weapons.yml` | All weapon stats (commented at the top of the file) |\n| `stats.yml` | Player statistics |\n| `resourcepack.zip` | Resource pack extracted from the jar at first start |\n| `maps/<id>.yml` | One file per map |\n| `playerdata/` | Inventories saved during a game, returned on reconnect after a crash |\n| `data/` | Temporary blocks (walls, spike) restored after a crash |\n\n## `config.yml` options\n\n| Key | Purpose |\n|---|---|\n| `controls.fire-button` | `RIGHT` = fire on held right click, aim on left click. See [Controls](page:controls). |\n| `player.speed-bonus` | Walking speed bonus that stands in for Valorant's run speed (sprint is disabled) |\n| `weapons.practice-mode` | Enable or disable the [Practice Range](page:practice-range) |\n| `resource-pack.self-host.http-port` | Dedicated HTTP port for the pack (for example `8164`) |\n| `resource-pack.self-host.enabled` | Set to `false` to use an external URL |\n| `resource-pack.url` / `resource-pack.sha1` | External pack URL and its checksum |\n| `map-library` | Catalog for `/vc import` ([Importing Maps](page:importing-maps)) |\n\nExample, hold-to-fire:\n\n```yaml\ncontrols:\n  fire-button: RIGHT\n```\n\n## `weapons.yml`\n\nHolds every weapon stat: damage, fire rate, spread, recoil, penetration, zoom and more. See [Weapons](page:weapons).\n\n## Ability tuning\n\nAbility damage, durations and prices are defined in `AbilityType.java` and `Kits.java`. These are in the source, so changing them means rebuilding the plugin. See [Development](page:development).\n", "en/ziplines": "# Ziplines\n\n\nZiplines are a map feature: a rope between two points that players can ride. They can be **horizontal, ascending or descending**.\n\n## Riding a zipline (players)\n\n| Action | Key |\n|---|---|\n| Hook on | **F**, near the rope |\n| Slide | **Forward / backward**, in either direction depending on where you look |\n| Let go | **Jump** or **sneak** |\n\n- At the end of the rope, the player is dropped on the platform.\n- You **can shoot** while riding.\n\n## Creating a zipline (admins)\n\n1. Get the wand: `/vc wand`.\n2. **Left click** a block for point **A**, **right click** a block for point **B**. The points are the **centers of the clicked blocks**.\n3. Run:\n\n```\n/vc map addzipline <map>\n```\n\n### Managing ziplines\n\n```\n/vc map ziplines <map>               list the ziplines\n/vc map removezipline <map> <n>      remove zipline number n\n```\n\n## Technical notes\n\nEach zipline is a **single display entity**, and movement is **interpolated client side**. It is smooth and cheap on the server.\n\nSee also [Map Setup](page:map-setup).\n", "en/importing-maps": "# Importing Maps\n\n\nValocraft can download maps from Ommo's [VALORANT x Minecraft](https://ommo.me/valorant-x-minecraft) project directly from the game.\n\n## Commands\n\n```\n/vc import list          catalog + required Minecraft version\n/vc import ascent        downloads, installs the world vc_ascent and creates the Valocraft map \"ascent\"\n```\n\n## What the importer does\n\n- Downloads the map and installs it as the world `vc_<name>`.\n- Creates a Valocraft map with the same id.\n- **Loads the world automatically** on every server start.\n\n## What you still have to do\n\nThe importer does **not** place gameplay points. You still need to set:\n\n- Spawns (attack / defend)\n- Spike sites\n- Pre-round walls\n\nFollow [Map Setup](page:map-setup), then enable the map:\n\n```\n/vc map enable ascent\n```\n\n## Version limits\n\nA map saved in a **newer Minecraft version than your server** is refused. **Lotus, Sunset and Breeze** require **Minecraft 1.21.11**.\n\n## Editing the catalog\n\nThe map catalog is the `map-library` section of `config.yml`.\n\n## ⚖️ License\n\nOmmo's maps are under **CC BY-NC-ND 4.0**.\n\n- Allowed on a **private server among friends**.\n- A **public server** requires a **commercial license** (contact@ommo.me).\n- **Do not republish** the maps.\n", "en/lobby": "# Lobby and Matchmaking\n\n\nSet the lobby spawn with `/vc setlobby` (admin). Players return to it with `/vc lobby`.\n\n## Lobby items\n\n| Item | What it does |\n|---|---|\n| ⭐ **Join a match** | Joins the fullest waiting game. **Sneak + right-click** lists all games. |\n| 📖 **Statistics** | Your K/D, headshot %, wins, MVPs, favourite agent, and the leaderboards. |\n| 🔨 **Create a game** | Pick a free map and become its **host**. |\n\nThe lobby also offers a \"Play\" compass (games menu and quick match), a waiting room per map, team selection and a countdown.\n\n## Hosting a game\n\n1. Use the **anvil** (Create a game) and choose a free map.\n2. You become the host. Other players join through the star or `/vc join <map>`.\n3. The host gets a **green item** that starts the game with as few as **2 players**.\n\n## Joining by command\n\n| Command | Effect |\n|---|---|\n| `/vc join` | Opens the games menu |\n| `/vc join <map>` | Joins a specific map |\n| `/vc list` | Lists games |\n| `/vc leave` | Leaves the game |\n\n## After the countdown\n\nAn **agent select phase (25 s)** opens. See [Agents](page:agents).\n\n## Statistics\n\nStats are tracked per player and stored in `plugins/Valocraft/stats.yml`:\n\n- Kills / deaths (K/D)\n- Headshot percentage\n- Wins\n- MVPs\n- Favourite agent\n- Leaderboards\n", "en/gameplay": "# Gameplay\n\n\nValocraft follows Valorant's spike mode: attackers plant the spike, defenders stop them.\n\n## Match flow\n\n1. **Lobby / waiting room**: players join a map and pick a team.\n2. **Countdown**, then the **agent select phase (25 s)**.\n3. **Buy phase**: open the shop with `F`. Pre-round walls hold teams at their spawn.\n4. **Round** (100 s): attackers plant, defenders defend or defuse.\n5. **Next round**. Sides swap after **12 rounds**. First to **13** wins.\n6. **Overtime**: starts with 5000 credits, win by **2 rounds**.\n\n## Spike\n\n| Action | Time |\n|---|---|\n| Plant | 4 s (hold right click with the spike on a site, stay still) |\n| Defuse | 7 s (hold right click on the spike, stay still). Half progress is kept. |\n| Detonation | 45 s after planting |\n\nDrop the spike or a weapon with **Sneak + Q**.\n\n## Economy\n\nValocraft uses a Valorant-style economy (¤ credits). Weapons and ability charges are bought in the shop during the buy phase. Ability charges are on the bottom row of the shop; your agent's **signature (E)** is granted every round.\n\n## Health and HUD\n\n- **Hearts** = HP (100 HP = 10 hearts). **Golden hearts** = shield.\n- **XP bar**: level = bullets in the magazine, bar = magazine / reload progress.\n- **Action bar**: ultimate progress (`X ●●●○○○`).\n\n## Movement\n\n- **Sprint is disabled**, as in Valorant. Walking speed is raised (`player.speed-bonus` in `config.yml`) to match Valorant's run speed.\n- Standing still or crouching before shooting gives an accurate shot. Running or jumping makes it inaccurate.\n- You can use [ziplines](page:ziplines) on maps that have them.\n\n## Pre-round walls\n\nWalls are placed during the buy phase and removed at round start. They only fill **empty** blocks and are restored exactly, so the map is never damaged.\n\n## Related\n\n- [Controls](page:controls)\n- [Agents](page:agents)\n- [Ultimate System](page:ultimate)\n- [Weapons](page:weapons)\n", "en/ultimate": "# Ultimate System\n\n\nEvery agent has an ultimate on key **8** (X). It costs a number of **ultimate points** (6 to 9 depending on the agent, listed on the [Agents](page:agents) page).\n\n## Earning points\n\nYou gain ultimate points from:\n\n- **Kills**\n- **Deaths**\n- **Spike plant**\n- **Spike defuse**\n- **Ultimate orbs** (see below)\n\nPoints are **kept at halftime**.\n\n## Feedback\n\n| Moment | What happens |\n|---|---|\n| Progress | Always shown on the action bar (`X ●●●○○○`). Pressing **8** shows your ultimate and its point count. |\n| **Ultimate ready** | Title on screen, a sound, and a message to your whole team. |\n| **Ultimate cast** | Everyone hears the agent's voice line (HrdaValorant pack) and the chat announces it. |\n\n## Ultimates that change key 8\n\nSome ultimates turn key 8 into a weapon while active:\n\n- Blade Storm\n- Hunter's Fury\n- Showstopper\n- Overdrive\n\n**Blade Storm**, **Overdrive** and **Empress** are extended or refilled by **eliminations**.\n\n## Instant ultimates\n\nThese activate the moment you press the key: **Run it Back**, **Empress**, **Lockdown**, **Viper's Pit** and **Seekers**.\n\n## Ultimate orbs\n\nOrbs are a map feature placed by admins.\n\n- **Place**: `/vc map addorb <map>` at the position you stand on.\n- **Remove all**: `/vc map clearorbs <map>`.\n- **Respawn**: orbs reappear **every round**.\n- **Collect**: **hold right click for 1.5 s** next to an orb to gain **+1 ultimate point**.\n\nSee [Map Setup](page:map-setup) for the full map workflow.\n", "en/installation": "# Installation\n\n\n## Requirements\n\n| | |\n|---|---|\n| **Server** | Paper 1.21.4 or newer |\n| **Java** | 21 |\n| **Dependencies** | None (standalone) |\n| **Resource pack** | Embedded in the jar, sent automatically |\n\n## Fresh install\n\n1. Put `Valocraft-2.1.jar` in the `plugins/` folder of your server.\n2. Start the server. The resource pack is extracted to `plugins/Valocraft/resourcepack.zip` on first start.\n3. Stand where you want the lobby and run `/vc setlobby`.\n4. [Create a map](page:map-setup) or [import one](page:importing-maps), then `/vc map enable <id>`.\n\n## Updating\n\n- From **2.0.0**: delete `Valocraft-2.0.0.jar` from `plugins/` and drop in `Valocraft-2.1.jar`. Players get the updated resource pack automatically.\n- From **1.x**: 2.x is a full rewrite and shares nothing with 1.x. Remove the old plugin and its data, and start fresh.\n\n## Resource pack\n\nNothing to configure by default. The pack (HrdaValorant, with a corrected Classic sound) is served on the **Minecraft port itself** and sent to every player on join. The link reuses the address and port the player used to connect, so no extra port is required, and it works on Pterodactyl.\n\nSee [Resource Pack](page:resource-pack) for alternatives and troubleshooting.\n\n## Next steps\n\n- [Lobby and Matchmaking](page:lobby)\n- [Map Setup](page:map-setup)\n- [Commands and Permissions](page:commands)\n", "en/practice-range": "# Practice Range\n\n\nOutside a match, a weapon obtained with `/vc give` can be fired at **mobs and armor stands**. It never shoots players.\n\nEach hit displays:\n\n- The **zone** hit\n- The **damage** dealt\n- The **distance**\n\nThis is the easiest way to tune `weapons.yml` before opening a match.\n\n## Usage\n\n```\n/vc give <weapon> [player]\n```\n\nShoot at mobs or armor stands, adjust `weapons.yml`, then `/vc reload`.\n\n## Disabling\n\nSet `weapons.practice-mode` to disable it in `config.yml`. See [Configuration](page:configuration).\n\nRelated: [Weapons](page:weapons).\n", "en/development": "# Development\n\n\n## Building from source\n\nRequirements: **Java 21** and **Maven**.\n\n```bash\nmvn package\n```\n\nThe jar is produced at `target/Valocraft-2.1.jar`.\n\n## Where to change things\n\n| What | Where |\n|---|---|\n| Ability damage, durations, prices | `AbilityType.java` and `Kits.java` |\n| Weapon stats | `weapons.yml` (no rebuild needed) |\n| General settings | `config.yml` (no rebuild needed) |\n| Weapon models | `resourcepack/valocraft-models/` |\n| Model generator | `resourcepack/ModelGenerator.java` |\n| Model preview | `resourcepack/apercu-armes.png` |\n\n## Weapon models\n\nThe custom Valocraft models (Shorty, Frenzy, Stinger, Bucky, Judge, Bulldog, Guardian, Phantom, Marshal, Outlaw, Odin) are generated by `resourcepack/ModelGenerator.java` into `resourcepack/valocraft-models/`. They use the `item_model` component (`valocraft:<weapon>`).\n\nTo retouch a model, open it in **Blockbench** (Java Block/Item format).\n\n## Resource pack\n\nThe HrdaValorant pack is embedded in the jar and extracted to `plugins/Valocraft/resourcepack.zip` at first start. See [Resource Pack](page:resource-pack).\n\n## Contributing\n\n- Open an **issue** for bugs and balance feedback. Abilities have not yet been balanced in real matches, so reports with context (agent, ability, situation) are very useful.\n- Pull requests are welcome.\n", "en/home": "<p align=\"center\">\n  <img src=\"https://cdn.modrinth.com/data/5AxXyQzL/39d04a022a5cfb4beb81c95012836130a1a9db6e.png\" alt=\"Valocraft logo\" width=\"260\">\n<\/p>\n\n<h1 align=\"center\">Valocraft Wiki<\/h1>\n\n<p align=\"center\">\n  <b>Valorant in Minecraft<\/b>: 15 agents, ultimates, ziplines, matchmaking and a full spike mode.<br>\n  Version <b>2.1 (Agent Update)<\/b> · Paper 1.21.4+ · Java 21\n<\/p>\n\n\n---\n\n**Valocraft** is a from-scratch recreation of Valorant for Minecraft servers. Two teams of up to five play spike rounds with a Valorant-style economy, hitscan weapons, agent abilities and ultimates.\n\n> ⚠️ Valocraft 2.x is a complete rewrite. Nothing from the 1.x versions exists anymore, and 1.x configs and maps are not compatible.\n\n## 🚀 Quick start\n\n1. [Install the plugin](page:installation) on a Paper 1.21.4+ server.\n2. Set the lobby with `/vc setlobby`.\n3. [Create a map](page:map-setup) or [import one](page:importing-maps).\n4. Join from the lobby ([Lobby and Matchmaking](page:lobby)) and play.\n\n## 📖 Where to find what\n\n| I want to... | Go to |\n|---|---|\n| Install or update the plugin | [Installation](page:installation) |\n| Understand a match (rounds, economy, spike) | [Gameplay](page:gameplay) |\n| Learn the keys and controls | [Controls](page:controls) |\n| See every agent and ability | [Agents](page:agents) |\n| Understand ultimate points and orbs | [Ultimate System](page:ultimate) |\n| Know the weapons and their mechanics | [Weapons](page:weapons) |\n| Join, host or check stats | [Lobby and Matchmaking](page:lobby) |\n| Build my own map | [Map Setup](page:map-setup) |\n| Download a ready-made map | [Importing Maps](page:importing-maps) |\n| Add ziplines | [Ziplines](page:ziplines) |\n| Fix resource pack problems | [Resource Pack](page:resource-pack) |\n| Find a command | [Commands and Permissions](page:commands) |\n| Tune the plugin | [Configuration](page:configuration) |\n| Test weapons outside a match | [Practice Range](page:practice-range) |\n| Solve a problem | [Troubleshooting](page:troubleshooting) |\n| Build or contribute | [Development](page:development) |\n\n## ✨ Highlights\n\n- 🎭 **15 agents** across Duelists, Initiators, Controllers and Sentinels\n- ⚡ **Ultimate system** fed by kills, deaths, spike actions and ultimate orbs\n- 🧭 **Ziplines** you can ride and shoot from\n- 🏟️ **Lobby with matchmaking**, host-your-own games, stats and leaderboards\n- 🔫 **Hitscan weapons** with spread, recoil, penetration and 3D models\n- 🗺️ **In-game map editor** and importer for Ommo's Valorant maps\n- 📦 **Self-hosted resource pack** served on the Minecraft port (Pterodactyl compatible)\n\n## 🔗 Links\n\n- Download: [Valocraft on Modrinth](https://modrinth.com/plugin/valocraft_stimoi)\n- Report a bug or give balance feedback: open an issue on this repository\n", "en/commands": "# Commands and Permissions\n\n\nThe main command is `/vc`.\n\n## Player commands\n\n| Command | Description |\n|---|---|\n| `/vc join [map]` | Join a game (opens a menu with no argument) |\n| `/vc leave` | Leave the game |\n| `/vc list` | List games |\n| `/vc shop` | Open the shop |\n| `/vc lobby` | Return to the lobby |\n| `/vc pack send` | (Re)receive the resource pack |\n| `/vc pack remove` | Remove the resource pack |\n\n## Admin commands\n\n| Command | Description |\n|---|---|\n| `/vc setlobby` | Set the lobby at your position |\n| `/vc wand` | Get the selection wand (left click = pos1 / point A, right click = pos2 / point B) |\n| `/vc start <map>` | Force a match to start |\n| `/vc stop <map>` | Force a match to stop |\n| `/vc give <weapon\\|knife\\|spike> [player]` | Give a weapon, the knife or the spike |\n| `/vc reload` | Reload `config.yml` and `weapons.yml` |\n| `/vc pack send <player\\|all>` | Send the resource pack |\n| `/vc pack remove <player\\|all>` | Remove the resource pack |\n| `/vc pack info` | Pack mode and link |\n| `/vc pack reload` | Reload the pack after editing it |\n| `/vc import list` | Show the map catalog |\n| `/vc import <name>` | Download and install a map ([Importing Maps](page:importing-maps)) |\n\n## Map commands (admin)\n\nSee [Map Setup](page:map-setup) for the workflow.\n\n| Command | Description |\n|---|---|\n| `/vc map create <id>` | Create a map |\n| `/vc map setname <id> <name>` | Set the display name |\n| `/vc map setwaiting <id>` | Waiting room = your position |\n| `/vc map addspawn <id> <attack\\|defend>` | Add a spawn at your position |\n| `/vc map addsite <id> <A\\|B\\|C...>` | Spike site from your wand selection |\n| `/vc map addwall <id> [block]` | Pre-round wall from your wand selection |\n| `/vc map previewwalls <id>` | Show / hide the walls |\n| `/vc map setplayers <id> <min> <max>` | Player limits |\n| `/vc map setmusic <id> <sound>` | Map music |\n| `/vc map addorb <id>` | Add an ultimate orb at your position |\n| `/vc map clearorbs <id>` | Remove all orbs |\n| `/vc map addzipline <id>` | Zipline between the two wand points |\n| `/vc map ziplines <id>` | List ziplines |\n| `/vc map removezipline <id> <n>` | Remove a zipline |\n| `/vc map info <id>` | Show what is missing for the map to be playable |\n| `/vc map enable <id>` | Enable the map |\n\n## Permissions\n\n| Permission | Default | Description |\n|---|---|---|\n| `valocraft.play` | Everyone | Play Valocraft |\n| `valocraft.admin` | Ops | Admin commands |\n", "en/troubleshooting": "# Troubleshooting\n\n\n## The resource pack doesn't load\n\n1. Check the **server console**: it logs the link offered to each player and the client's response (`ACCEPTED`, `DECLINED`, `FAILED_DOWNLOAD`, `SUCCESSFULLY_LOADED`...).\n2. Ask the player to run `/vc pack send` to receive it again.\n3. Admins: `/vc pack info` shows the mode and link, `/vc pack reload` reloads it.\n4. If the Minecraft-port hosting doesn't work for you, use a dedicated port (`resource-pack.self-host.http-port: 8164`) or an external URL. See [Resource Pack](page:resource-pack).\n\n## My map won't start / isn't playable\n\nRun `/vc map info <id>`: it lists what is missing (waiting room, spawns, sites, walls, player limits, enable). See [Map Setup](page:map-setup).\n\n## An imported map is refused\n\nThe map was saved in a **newer Minecraft version** than your server. Lotus, Sunset and Breeze require **Minecraft 1.21.11**. See [Importing Maps](page:importing-maps).\n\n## Automatic weapons fire slowly\n\nMinecraft sends **one signal per left click**, so with left-click shooting automatic weapons fire at your click rate. For hold-to-fire, set `controls.fire-button: RIGHT` in `config.yml`. See [Controls](page:controls).\n\n## My screen \"goes back\" during bursts\n\nFixed in **2.1**: recoil no longer moves the camera and is applied entirely to the bullet path. Update to 2.1. See [Weapons](page:weapons).\n\n## I can't use abilities or shoot\n\nYou may be **immobilized** (Lockdown or Thrash). See the status effects table on [Agents](page:agents).\n\n## Players lost their items after a crash\n\nInventories saved during a game are stored in `plugins/Valocraft/playerdata/` and **returned on reconnect**. Temporary blocks (walls, spike) in `plugins/Valocraft/data/` are restored automatically.\n\n## I updated and things look wrong\n\n- Remove the **old jar** (`Valocraft-2.0.0.jar`) so only `Valocraft-2.1.jar` remains. See [Installation](page:installation).\n- Valocraft **1.x** is not compatible with 2.x.\n\n## Still stuck?\n\nOpen an issue on this repository with your server version, the Valocraft version and the relevant console output.\n", "en/map-setup": "# Map Setup\n\n\nMaps are configured **in game** with `/vc map ...` and the selection wand. This page builds a map called `ascent` from scratch. To skip building, see [Importing Maps](page:importing-maps).\n\n## What a playable map needs\n\n- A **waiting room**\n- **Attacker** and **defender** spawns (usually 5 each)\n- At least one **spike site** (A, B, C...)\n- **Pre-round walls**\n- Player limits\n- To be **enabled**\n\n`/vc map info <id>` lists exactly what is still missing.\n\n## Walkthrough\n\n```\n/vc map create ascent\n/vc map setname ascent Ascent\n/vc map setwaiting ascent            (waiting room = your position)\n/vc map addspawn ascent attack       (repeat for each player, usually 5)\n/vc map addspawn ascent defend\n/vc wand                             (left click = pos1, right click = pos2)\n/vc map addsite ascent A             (selection = plant zone of site A)\n/vc map addsite ascent B\n/vc map addwall ascent               (selection = pre-round wall, green glass by default)\n/vc map addwall ascent light_blue_stained_glass\n/vc map previewwalls ascent          (show / hide the walls to check them)\n/vc map setplayers ascent 2 10\n/vc map setmusic ascent hrdavalorant.maps.ascent\n/vc map addorb ascent                (ultimate orbs, optional)\n/vc map addzipline ascent            (ziplines, optional)\n/vc map enable ascent\n```\n\n## Step by step\n\n### 1. Create and name\n\n`/vc map create <id>` then `/vc map setname <id> <display name>`.\n\n### 2. Waiting room and spawns\n\nStand where you want it and run `/vc map setwaiting <id>`. Repeat `/vc map addspawn <id> attack` and `/vc map addspawn <id> defend` at each spawn position.\n\n### 3. Spike sites\n\n1. `/vc wand`\n2. **Left click** = pos1, **right click** = pos2.\n3. `/vc map addsite <id> A` (and `B`, `C`...). The selection becomes the plant zone.\n\n### 4. Pre-round walls\n\nSelect the area with the wand, then `/vc map addwall <id> [block]`. The default block is **green glass**; pass another block name such as `light_blue_stained_glass` to change it.\n\n- Walls only fill **empty** blocks of the zone and are removed identically at round start, so the map is **never damaged**.\n- `/vc map previewwalls <id>` toggles a preview so you can check placement.\n\n### 5. Players and music\n\n`/vc map setplayers <id> <min> <max>` sets the player range, and `/vc map setmusic <id> <sound>` sets the music.\n\n### 6. Optional features\n\n- [Ultimate orbs](page:ultimate): `/vc map addorb <id>` / `/vc map clearorbs <id>`\n- [Ziplines](page:ziplines)\n\n### 7. Enable\n\n`/vc map enable <id>`.\n\n## Crash safety\n\nPlaced blocks (walls, spike) are **saved to disk** in `plugins/Valocraft/data/` and **restored if the server crashes**.\n\n## Related\n\n- [Commands and Permissions](page:commands)\n- [Importing Maps](page:importing-maps)\n", "en/resource-pack": "# Resource Pack\n\n\nValocraft uses the **HrdaValorant** resource pack (with a corrected Classic sound) plus the Valocraft weapon models. It is **embedded in the plugin jar**.\n\n## How it works by default\n\n1. On first start the pack is extracted to `plugins/Valocraft/resourcepack.zip`.\n2. It is **served on the Minecraft port itself** and sent to every player on join.\n3. The download link reuses the **address and port the player connected with**.\n\nSo there is **no extra port to open**, and it works on **Pterodactyl**. The pack is updated automatically when the plugin updates.\n\n## Player commands\n\n| Command | Effect |\n|---|---|\n| `/vc pack send` | (Re)receive the pack |\n| `/vc pack remove` | Remove the pack |\n\n## Admin commands\n\n| Command | Effect |\n|---|---|\n| `/vc pack send <player\\|all>` | Send the pack to a player or everyone |\n| `/vc pack remove <player\\|all>` | Remove the pack for a player or everyone |\n| `/vc pack info` | Show the mode and link |\n| `/vc pack reload` | Reload the pack after editing it |\n\n## Alternatives\n\nSet in `config.yml`:\n\n| Goal | Setting |\n|---|---|\n| Use a **dedicated HTTP port** | `resource-pack.self-host.http-port: 8164` |\n| Use an **external URL** | `self-host.enabled: false`, then `resource-pack.url` and `sha1` |\n\n## Reading the console\n\nFor each player, the console logs the **link offered** and the **client's response**, for example: `ACCEPTED`, `DECLINED`, `FAILED_DOWNLOAD`, `SUCCESSFULLY_LOADED`.\n\nSee [Troubleshooting](page:troubleshooting) if the pack does not load.\n", "en/agents": "# Agents\n\n\nValocraft has **15 agents** in four roles. After the countdown, a **25 s agent select phase** opens:\n\n- Each agent is **unique within a team**.\n- A player who doesn't choose gets a **random free agent**.\n- The menu groups agents by role and shows abilities, prices and ultimate cost.\n- The agent's **voice line** (HrdaValorant pack) plays to the whole team on lock-in.\n\n**How to read the tables:** prices are in ¤, and the number after the price is the **max charges**. *Free* means granted every round. Ultimate costs are in **points** (see [Ultimate System](page:ultimate)). Keys are **5 / 6 / 7 / 8** = **C / Q / E / X** ([Controls](page:controls)). Charges are bought in the shop's bottom row.\n\n## Duelists\n\n| Agent | C | Q | E (signature) | X (ultimate) |\n|---|---|---|---|---|\n| **Jett** | Cloudburst: thrown smoke (200 ¤, 2) | Updraft: high jump (150 ¤, 2) | Tailwind: dash in movement direction (free, returns after 2 kills) | Blade Storm: 5 precise knives, refilled on kill (8) |\n| **Phoenix** | Blaze: fire wall that heals Phoenix (200 ¤) | Curveball: curving flash (250 ¤, 2) | Hot Hands: fire zone that heals Phoenix (free, returns after 2 kills) | Run it Back: 10 s, respawns at start point if killed (6) |\n| **Raze** | Boom Bot: seeking explosive robot (300 ¤) | Blast Pack: charge that launches everyone, Raze included (200 ¤, 2) | Paint Shells: cluster grenade (free, returns after 2 kills) | Showstopper: devastating rocket (8) |\n| **Reyna** | Leer: eye that blinds those who look at it (250 ¤, 2) | Devour: +100 HP after a kill (200 ¤, 2) | Dismiss: intangible and fast for 2 s after a kill (free) | Empress: 30 s of fire rate and speed, extended by kills (6) |\n| **Neon** | Fast Lane: two electric walls (300 ¤) | Relay Bolt: concussive lightning bolt (200 ¤, 2) | High Gear: 8 s sprint, 30 s recharge | Overdrive: precise electric beam for 12 s, extended by kills (7) |\n\n## Initiators\n\n| Agent | C | Q | E (signature) | X (ultimate) |\n|---|---|---|---|---|\n| **Sova** | Owl Drone: gaze-guided drone that reveals (400 ¤) | Shock Bolt: explosive arrow (150 ¤, 2) | Recon Bolt: reveals enemies in view, 40 s recharge | Hunter's Fury: 3 shots that pierce walls (8) |\n| **Skye** | Regrowth: heals nearby allies (200 ¤) | Trailblazer: guided tiger that concusses (250 ¤) | Guiding Light: guided hawk that flashes (1 free, 250 ¤, 40 s recharge) | Seekers: 3 seekers on the 3 nearest enemies (8) |\n| **Gekko** | Mosh Pit: deadly puddle (250 ¤) | Wingman: creature that concusses the first enemy (300 ¤) | Dizzy: blinds enemies in view, 30 s recharge | Thrash: guided creature that immobilizes (8) |\n\n## Controllers\n\n| Agent | C | Q | E (signature) | X (ultimate) |\n|---|---|---|---|---|\n| **Brimstone** | Stim Beacon: fire rate and speed for allies (200 ¤) | Incendiary: incendiary grenade (250 ¤) | Sky Smoke: long-range smoke where you aim (1 free, 100 ¤, 3) | Orbital Strike: strike on the targeted area (8) |\n| **Omen** | Shrouded Step: short teleport (100 ¤, 2) | Paranoia: shadow that passes through walls and blinds (300 ¤) | Dark Cover: long-range smoke (1 free, 150 ¤, 30 s recharge) | From the Shadows: teleport anywhere (7) |\n| **Viper** | Snake Bite: acid + vulnerable (200 ¤, 2) | Poison Cloud: toxic cloud (200 ¤) | Toxic Screen: 30-block toxic wall through walls (free) | Viper's Pit: huge cloud, enemies inside can't see (9) |\n| **Harbor** | Cascade: moving wave that slows (150 ¤) | Cove: water sphere (350 ¤) | High Tide: long water wall (free) | Reckoning: 3 geysers that concuss (7) |\n\n## Sentinels\n\n| Agent | C | Q | E (signature) | X (ultimate) |\n|---|---|---|---|---|\n| **Sage** | Barrier Orb: destructible ice wall (400 ¤) | Slow Orb: slowing zone (200 ¤, 2) | Healing Orb: heal an ally (left click) or yourself (right click), 45 s recharge | Resurrection: revives a targeted dead ally (8) |\n| **Killjoy** | Nanoswarm: nanobot swarm (200 ¤, 2) | Alarmbot: trap that applies vulnerable (200 ¤) | Turret: 30 s turret (free) | Lockdown: immobilizes enemies within 20 blocks after 10 s (8) |\n| **Cypher** | Trapwire: tripwire between two walls, reveals and concusses (200 ¤, 2) | Cyber Cage: small smoke (100 ¤, 2) | Spycam: camera that reveals for 45 s (free) | Neural Theft: on a dead enemy, reveals all enemies twice (6) |\n\n## Status effects\n\n| Status | Effect | Caused by |\n|---|---|---|\n| **Concussed** | Slowed, screen sways | Concussive abilities |\n| **Blinded** | Black vision | Flashes, Leer, Paranoia, Dizzy, Seekers |\n| **Vulnerable** | +50% damage taken | Alarmbot, Snake Bite |\n| **Immobilized** | Cannot shoot or use abilities | Lockdown, Thrash |\n| **Revealed** | Glowing outline visible through walls | Reveal abilities |\n| **Intangible** | Takes no damage | Dismiss |\n\n## Minecraft adaptations\n\n- **Smokes** are made of particles and blind anyone standing inside them.\n- **Flashes** turn vision **black**, not white.\n- The outline of **revealed** enemies is visible to **everyone**, not only the revealing team.\n\n## Balance\n\nAbilities have **not yet been balanced in real matches**. Feedback is welcome through GitHub issues. Server owners can tune damage, durations and prices in `AbilityType.java` and `Kits.java` (see [Development](page:development)).\n", "en/controls": "# Controls\n\n\n| Key | Action |\n|---|---|\n| **Left click** | Shoot (automatic weapons: click fast to fire in bursts) |\n| **Right click (hold)** | Aim / scope |\n| **Q** | Reload |\n| **Sneak + Q** | Drop the weapon (or the spike) |\n| **F** | Shop during the buy phase, otherwise pick up the targeted weapon |\n| **1 / 2 / 3 / 4** | Primary / sidearm / knife / spike |\n| **5 / 6 / 7 / 8** | Agent abilities **C / Q / E / X** |\n| **F** near a rope | Hook onto a [zipline](page:ziplines) |\n| **Hold right click** with the spike on a site | Plant the spike (stay still) |\n| **Hold right click** on the spike (defender) | Defuse (stay still) |\n\n## Ability controls\n\n- **Instant abilities** activate as soon as you press the key: Updraft, Tailwind, Devour, Dismiss, High Gear, Regrowth, and the ultimates Run it Back, Empress, Lockdown, Viper's Pit and Seekers.\n- **All other abilities**: **left click** to cast, **right click** for the variant when one exists (Curveball on right click, Sova's arrows without bounce, Healing Orb on self, Blade Storm all knives at once).\n- **Guided abilities** (Sova's drone, Skye's hawk and tiger, Gekko's Thrash) follow your gaze.\n- **Jett** glides while holding the jump key.\n\n## Automatic fire and the left-click limit\n\nMinecraft only sends the server **one signal per left click** (nothing while the button stays held). With left-click shooting, automatic weapons therefore fire at your click rate, up to their maximum fire rate.\n\nFor true hold-to-fire, set this in `config.yml`:\n\n```yaml\ncontrols:\n  fire-button: RIGHT\n```\n\nFire is then on **held right click**, and aim is on **left click**.\n\n## HUD\n\n- **XP bar**: level = bullets in the magazine, bar = magazine / reload progress.\n- **Hearts** = HP (100 HP = 10 hearts), **golden hearts** = shield.\n", "fr/weapons": "# Armes\n\n\nToutes les armes ont un modèle 3D.\n\n## Arsenal\n\n| Catégorie | Armes |\n|---|---|\n| Mêlée | Knife (couteau) |\n| Pistolets | Classic, Ghost, Sheriff, Shorty, Frenzy |\n| SMG | Stinger, Spectre |\n| Fusils à pompe | Bucky, Judge |\n| Fusils d'assaut | Bulldog, Guardian, Phantom, Vandal |\n| Snipers | Marshal, Operator, Outlaw |\n| Armes lourdes | Ares, Odin |\n\nLes armes et charges s'achètent dans la boutique pendant la phase d'achat (`F`, ou `/vc shop`).\n\n## Mécaniques\n\n| Mécanique | Fonctionnement |\n|---|---|\n| **Tir** | Hitscan |\n| **Précision** | L'imprécision dépend du mouvement : elle augmente en déplacement ou en l'air, et change en position accroupie. S'arrêter (ou s'accroupir) avant de tirer donne un tir précis ; courir ou sauter le rend imprécis. |\n| **Recul** | Montée puis balayage latéral. Entièrement intégré à la trajectoire des balles. |\n| **Dégâts** | Tête / corps / jambes, avec paliers selon la portée |\n| **Pénétration** | Les balles traversent les murs |\n| **Rechargement** | Touche **Q**. La progression s'affiche sur la barre d'XP. |\n| **Visée / lunette** | Clic droit maintenu. Lunettes sur Operator, Marshal et Outlaw. |\n| **Fusils à pompe** | Armes de courte portée (Bucky, Judge) |\n| **Couteau** | **x3 dégâts** dans le dos |\n\n## Recul et caméra\n\nLe recul **ne déplace jamais la vue du joueur**. Le serveur ne peut imposer qu'une orientation absolue, ce qui faisait « revenir » l'écran en arrière pendant les rafales. Dans la 2.1, tout le recul est appliqué à la **trajectoire des balles**.\n\n## Modèles\n\n- **Pack HrdaValorant** : Classic, Ghost, Sheriff, Spectre, Vandal, Ares, Operator, couteau (et ses skins `model-data` 2 à 15), boucliers.\n- **Modèles Valocraft**, créés pour le projet (`assets/valocraft` du pack) : Shorty, Frenzy, Stinger, Bucky, Judge, Bulldog, Guardian, Phantom, Marshal, Outlaw, Odin. Ils utilisent le composant `item_model` (`item-model: valocraft:<arme>`, automatique).\n\nLes sources et outils des modèles sont décrits dans [Développement](page:development).\n\n## Réglages\n\nToutes les statistiques (dégâts, cadence, imprécision, recul, pénétration, zoom...) sont dans `weapons.yml`, commentées en tête du fichier. Recharger avec `/vc reload`. Pour tester sans risque, utiliser le [Stand de tir](page:practice-range).\n", "fr/configuration": "# Configuration\n\n\nLes fichiers se trouvent dans `plugins/Valocraft/`. Recharger `config.yml` et `weapons.yml` avec `/vc reload`.\n\n## Fichiers et dossiers\n\n| Chemin | Rôle |\n|---|---|\n| `config.yml` | Réglages généraux, contrôles, pack de textures, bibliothèque de maps |\n| `weapons.yml` | Statistiques de toutes les armes (commentées en tête du fichier) |\n| `stats.yml` | Statistiques des joueurs |\n| `resourcepack.zip` | Pack de textures extrait du jar au premier démarrage |\n| `maps/<id>.yml` | Un fichier par map |\n| `playerdata/` | Inventaires sauvegardés pendant une partie, rendus à la reconnexion après un crash |\n| `data/` | Blocs temporaires (murs, spike) à restaurer après un crash |\n\n## Options de `config.yml`\n\n| Clé | Rôle |\n|---|---|\n| `controls.fire-button` | `RIGHT` = tir au clic droit maintenu, visée au clic gauche. Voir [Contrôles](page:controls). |\n| `player.speed-bonus` | Bonus de vitesse de marche qui remplace la course de Valorant (le sprint est désactivé) |\n| `weapons.practice-mode` | Active ou désactive le [Stand de tir](page:practice-range) |\n| `resource-pack.self-host.http-port` | Port HTTP dédié au pack (par exemple `8164`) |\n| `resource-pack.self-host.enabled` | Mettre `false` pour utiliser une URL externe |\n| `resource-pack.url` / `resource-pack.sha1` | URL externe du pack et sa somme de contrôle |\n| `map-library` | Catalogue de `/vc import` ([Import de maps](page:importing-maps)) |\n\nExemple, tir en maintenant le bouton :\n\n```yaml\ncontrols:\n  fire-button: RIGHT\n```\n\n## `weapons.yml`\n\nContient toutes les statistiques d'armes : dégâts, cadence, imprécision, recul, pénétration, zoom et plus. Voir [Armes](page:weapons).\n\n## Réglage des capacités\n\nLes dégâts, durées et prix des capacités sont définis dans `AbilityType.java` et `Kits.java`. Ils sont dans le code source : les modifier demande de recompiler le plugin. Voir [Développement](page:development).\n", "fr/ziplines": "# Tyroliennes\n\n\nLes tyroliennes sont un élément de map : une corde entre deux points sur laquelle les joueurs peuvent glisser. Elles peuvent être **horizontales, montantes ou descendantes**.\n\n## Utiliser une tyrolienne (joueurs)\n\n| Action | Touche |\n|---|---|\n| S'accrocher | **F**, près de la corde |\n| Glisser | **Avancer / reculer**, dans un sens ou dans l'autre selon où tu regardes |\n| Lâcher | **Saut** ou **accroupi** |\n\n- Arrivé au bout de la corde, le joueur est déposé sur la plateforme.\n- On **peut tirer** pendant le trajet.\n\n## Créer une tyrolienne (admins)\n\n1. Prendre la baguette : `/vc wand`.\n2. **Clic gauche** sur un bloc pour le point **A**, **clic droit** sur un bloc pour le point **B**. Les points sont les **centres des blocs cliqués**.\n3. Lancer :\n\n```\n/vc map addzipline <map>\n```\n\n### Gérer les tyroliennes\n\n```\n/vc map ziplines <map>               lister les tyroliennes\n/vc map removezipline <map> <n>      retirer la tyrolienne numéro n\n```\n\n## Notes techniques\n\nChaque tyrolienne est **une seule entité d'affichage**, et le déplacement est **interpolé côté client**. C'est fluide et peu coûteux pour le serveur.\n\nVoir aussi [Création de map](page:map-setup).\n", "fr/importing-maps": "# Import de maps\n\n\nValocraft peut télécharger les maps du projet [VALORANT x Minecraft d'Ommo](https://ommo.me/valorant-x-minecraft) directement depuis le jeu.\n\n## Commandes\n\n```\n/vc import list          catalogue + version Minecraft requise\n/vc import ascent        télécharge, installe le monde vc_ascent et crée la map Valocraft \"ascent\"\n```\n\n## Ce que fait l'import\n\n- Télécharge la map et l'installe comme monde `vc_<nom>`.\n- Crée une map Valocraft avec le même id.\n- **Charge le monde automatiquement** à chaque démarrage du serveur.\n\n## Ce qu'il reste à faire\n\nL'import ne place **pas** les points de jeu. Il faut encore définir :\n\n- Les spawns (attaque / défense)\n- Les sites de spike\n- Les murs de pré-round\n\nSuivre [Création de map](page:map-setup), puis activer la map :\n\n```\n/vc map enable ascent\n```\n\n## Limites de version\n\nUne map sauvegardée dans une version de Minecraft **plus récente que le serveur** est refusée. **Lotus, Sunset et Breeze** demandent **Minecraft 1.21.11**.\n\n## Modifier le catalogue\n\nLe catalogue est la section `map-library` de `config.yml`.\n\n## ⚖️ Licence\n\nLes maps d'Ommo sont sous licence **CC BY-NC-ND 4.0**.\n\n- Autorisées sur un serveur **privé entre amis**.\n- Un serveur **public** nécessite une **licence commerciale** (contact@ommo.me).\n- **Ne pas republier** les maps.\n", "fr/lobby": "# Lobby et matchmaking\n\n\nLe point de spawn du lobby se définit avec `/vc setlobby` (admin). Les joueurs y reviennent avec `/vc lobby`.\n\n## Objets du lobby\n\n| Objet | Rôle |\n|---|---|\n| ⭐ **Rejoindre un match** (étoile) | Rejoint la partie en attente la plus remplie. **Accroupi + clic droit** : liste de toutes les parties. |\n| 📖 **Statistiques** (livre) | Tes stats (K/D, % de tirs à la tête, victoires, MVP, agent favori) et les classements. |\n| 🔨 **Créer une partie** (enclume) | Choisis une map libre et deviens l'**hôte**. |\n\nLe lobby propose aussi une boussole « Jouer » (menu des parties et partie rapide), une salle d'attente par map, le choix d'équipe et un compte à rebours.\n\n## Héberger une partie\n\n1. Utiliser l'**enclume** (Créer une partie) et choisir une map libre.\n2. Tu deviens l'hôte. Les autres joueurs rejoignent avec l'étoile ou `/vc join <map>`.\n3. L'hôte reçoit un **objet vert** qui lance la partie dès **2 joueurs**.\n\n## Rejoindre par commande\n\n| Commande | Effet |\n|---|---|\n| `/vc join` | Ouvre le menu des parties |\n| `/vc join <map>` | Rejoint une map précise |\n| `/vc list` | Liste les parties |\n| `/vc leave` | Quitte la partie |\n\n## Après le compte à rebours\n\nUne **phase de sélection d'agent (25 s)** s'ouvre. Voir [Agents](page:agents).\n\n## Statistiques\n\nLes stats sont suivies par joueur et enregistrées dans `plugins/Valocraft/stats.yml` :\n\n- Éliminations / morts (K/D)\n- Pourcentage de tirs à la tête\n- Victoires\n- MVP\n- Agent favori\n- Classements\n", "fr/gameplay": "# Déroulement du jeu\n\n\nValocraft reprend le mode spike de Valorant : les attaquants posent la spike, les défenseurs les en empêchent.\n\n## Déroulement d'une partie\n\n1. **Lobby / salle d'attente** : les joueurs rejoignent une map et choisissent une équipe.\n2. **Compte à rebours**, puis **phase de sélection d'agent (25 s)**.\n3. **Phase d'achat** : ouvrir la boutique avec `F`. Des murs de pré-round retiennent les équipes à leur spawn.\n4. **Round** (100 s) : les attaquants posent, les défenseurs défendent ou désamorcent.\n5. **Round suivant**. Changement de côté après **12 rounds**. Le premier à **13** gagne.\n6. **Prolongations** : départ avec 5000 crédits, victoire avec **2 rounds d'écart**.\n\n## Spike\n\n| Action | Durée |\n|---|---|\n| Pose | 4 s (clic droit maintenu avec la spike sur un site, rester immobile) |\n| Désamorçage | 7 s (clic droit maintenu sur la spike, rester immobile). La moitié de la progression est conservée. |\n| Explosion | 45 s après la pose |\n\nLâcher la spike ou une arme : **Accroupi + Q**.\n\n## Économie\n\nValocraft utilise une économie à la Valorant (crédits ¤). Armes et charges de capacités s'achètent dans la boutique pendant la phase d'achat. Les charges sont sur la ligne du bas de la boutique ; la **signature (E)** de ton agent est offerte à chaque round.\n\n## Santé et interface\n\n- **Cœurs** = PV (100 PV = 10 cœurs). **Cœurs dorés** = bouclier.\n- **Barre d'XP** : niveau = balles dans le chargeur, barre = chargeur / progression du rechargement.\n- **Barre d'action** : progression de l'ultime (`X ●●●○○○`).\n\n## Déplacements\n\n- Le **sprint est désactivé**, comme dans Valorant. La vitesse de marche est augmentée (`player.speed-bonus` dans `config.yml`) pour correspondre à la course de Valorant.\n- S'arrêter ou s'accroupir avant de tirer rend le tir précis. Courir ou sauter le rend imprécis.\n- Les [tyroliennes](page:ziplines) sont utilisables sur les maps qui en ont.\n\n## Murs de pré-round\n\nLes murs sont posés pendant la phase d'achat et retirés au début du round. Ils ne remplissent que les blocs **vides** et sont restaurés à l'identique : la map n'est jamais abîmée.\n\n## Voir aussi\n\n- [Contrôles](page:controls)\n- [Agents](page:agents)\n- [Système d'ultime](page:ultimate)\n- [Armes](page:weapons)\n", "fr/ultimate": "# Système d'ultime\n\n\nChaque agent a un ultime sur la touche **8** (X). Il coûte un certain nombre de **points d'ultime** (de 6 à 9 selon l'agent, indiqués sur la page [Agents](page:agents)).\n\n## Gagner des points\n\nLes points d'ultime se gagnent avec :\n\n- Les **éliminations**\n- Les **morts**\n- La **pose de la spike**\n- Le **désamorçage de la spike**\n- Les **orbes d'ultime** (voir plus bas)\n\nLes points sont **conservés à la mi-temps**.\n\n## Retours visuels et sonores\n\n| Moment | Ce qui se passe |\n|---|---|\n| Progression | Affichée en permanence dans la barre d'action (`X ●●●○○○`). La touche **8** montre l'ultime de l'agent avec le nombre de points. |\n| **Ultime prête** | Titre à l'écran, son, et message à toute l'équipe. |\n| **Ultime lancée** | Tout le monde entend la réplique de l'agent (pack HrdaValorant) et le chat l'annonce. |\n\n## Ultimes qui transforment la touche 8\n\nCertaines ultimes transforment la touche 8 en arme tant qu'elles sont actives :\n\n- Blade Storm\n- Hunter's Fury\n- Showstopper\n- Overdrive\n\n**Blade Storm**, **Overdrive** et **Empress** sont prolongées ou rechargées par les **éliminations**.\n\n## Ultimes instantanées\n\nElles s'activent dès qu'on appuie sur la touche : **Run it Back**, **Empress**, **Lockdown**, **Viper's Pit** et **Seekers**.\n\n## Orbes d'ultime\n\nLes orbes sont un élément de map placé par les admins.\n\n- **Placer** : `/vc map addorb <map>` à l'endroit où l'on se trouve.\n- **Tout retirer** : `/vc map clearorbs <map>`.\n- **Réapparition** : les orbes reviennent à **chaque round**.\n- **Récupérer** : **maintenir clic droit 1,5 s** à côté d'un orbe pour gagner **+1 point d'ultime**.\n\nVoir [Création de map](page:map-setup) pour le déroulé complet.\n", "fr/installation": "# Installation\n\n\n## Prérequis\n\n| | |\n|---|---|\n| **Serveur** | Paper 1.21.4 ou plus récent |\n| **Java** | 21 |\n| **Dépendances** | Aucune (autonome) |\n| **Pack de textures** | Embarqué dans le jar, envoyé automatiquement |\n\n## Nouvelle installation\n\n1. Placer `Valocraft-2.1.jar` dans le dossier `plugins/` du serveur.\n2. Démarrer le serveur. Le pack de textures est extrait dans `plugins/Valocraft/resourcepack.zip` au premier démarrage.\n3. Se placer à l'endroit voulu pour le lobby et faire `/vc setlobby`.\n4. [Créer une map](page:map-setup) ou [en importer une](page:importing-maps), puis `/vc map enable <id>`.\n\n## Mise à jour\n\n- Depuis la **2.0.0** : supprimer `Valocraft-2.0.0.jar` de `plugins/` et mettre `Valocraft-2.1.jar`. Les joueurs reçoivent automatiquement le pack mis à jour.\n- Depuis la **1.x** : la 2.x est une réécriture complète qui ne partage rien avec la 1.x. Retirer l'ancien plugin et ses données, et repartir de zéro.\n\n## Pack de textures\n\nRien à configurer par défaut. Le pack (HrdaValorant, son du Classic corrigé) est servi **sur le port Minecraft lui-même** et envoyé à chaque joueur à la connexion. Le lien reprend l'adresse et le port utilisés par le joueur pour se connecter : aucun port supplémentaire à ouvrir, et ça fonctionne aussi sur Pterodactyl.\n\nVoir [Pack de textures](page:resource-pack) pour les alternatives et le dépannage.\n\n## Étapes suivantes\n\n- [Lobby et matchmaking](page:lobby)\n- [Création de map](page:map-setup)\n- [Commandes et permissions](page:commands)\n", "fr/practice-range": "# Stand de tir\n\n\nHors partie, une arme obtenue avec `/vc give` tire sur les **mobs et les armor stands**. Elle ne tire jamais sur les joueurs.\n\nChaque tir touché affiche :\n\n- La **zone** touchée\n- Les **dégâts** infligés\n- La **distance**\n\nC'est le moyen le plus simple de régler `weapons.yml` avant d'ouvrir une partie.\n\n## Utilisation\n\n```\n/vc give <arme> [joueur]\n```\n\nTirer sur des mobs ou des armor stands, ajuster `weapons.yml`, puis `/vc reload`.\n\n## Désactivation\n\nRégler `weapons.practice-mode` dans `config.yml` pour le désactiver. Voir [Configuration](page:configuration).\n\nVoir aussi : [Armes](page:weapons).\n", "fr/development": "# Développement\n\n\n## Compiler depuis les sources\n\nPrérequis : **Java 21** et **Maven**.\n\n```bash\nmvn package\n```\n\nLe jar se trouve dans `target/Valocraft-2.1.jar`.\n\n## Où modifier quoi\n\n| Quoi | Où |\n|---|---|\n| Dégâts, durées et prix des capacités | `AbilityType.java` et `Kits.java` |\n| Statistiques des armes | `weapons.yml` (sans recompiler) |\n| Réglages généraux | `config.yml` (sans recompiler) |\n| Modèles d'armes | `resourcepack/valocraft-models/` |\n| Générateur de modèles | `resourcepack/ModelGenerator.java` |\n| Aperçu des modèles | `resourcepack/apercu-armes.png` |\n\n## Modèles d'armes\n\nLes modèles Valocraft (Shorty, Frenzy, Stinger, Bucky, Judge, Bulldog, Guardian, Phantom, Marshal, Outlaw, Odin) sont générés par `resourcepack/ModelGenerator.java` dans `resourcepack/valocraft-models/`. Ils utilisent le composant `item_model` (`valocraft:<arme>`).\n\nPour retoucher un modèle, l'ouvrir dans **Blockbench** (format Java Block/Item).\n\n## Pack de textures\n\nLe pack HrdaValorant est embarqué dans le jar et extrait dans `plugins/Valocraft/resourcepack.zip` au premier démarrage. Voir [Pack de textures](page:resource-pack).\n\n## Contribuer\n\n- Ouvrir une **issue** pour les bugs et les retours d'équilibrage. Les capacités n'ont pas encore été équilibrées en partie réelle : un rapport avec du contexte (agent, capacité, situation) est très utile.\n- Les pull requests sont les bienvenues.\n", "fr/home": "<p align=\"center\">\n  <img src=\"https://cdn.modrinth.com/data/5AxXyQzL/39d04a022a5cfb4beb81c95012836130a1a9db6e.png\" alt=\"Logo Valocraft\" width=\"260\">\n<\/p>\n\n<h1 align=\"center\">Wiki Valocraft<\/h1>\n\n<p align=\"center\">\n  <b>Valorant dans Minecraft<\/b> : 15 agents, ultimes, tyroliennes, matchmaking et mode spike complet.<br>\n  Version <b>2.1 (Agent Update)<\/b> · Paper 1.21.4+ · Java 21\n<\/p>\n\n\n---\n\n**Valocraft** est une reproduction de Valorant refaite de zéro pour les serveurs Minecraft. Deux équipes de cinq maximum jouent des rounds de spike avec une économie à la Valorant, des armes hitscan, des capacités d'agents et des ultimes.\n\n> ⚠️ Valocraft 2.x est une réécriture complète. Rien des versions 1.x n'existe plus, et les configs et maps 1.x ne sont pas compatibles.\n\n## 🚀 Démarrage rapide\n\n1. [Installer le plugin](page:installation) sur un serveur Paper 1.21.4+.\n2. Définir le lobby avec `/vc setlobby`.\n3. [Créer une map](page:map-setup) ou [en importer une](page:importing-maps).\n4. Rejoindre depuis le lobby ([Lobby et matchmaking](page:lobby)) et jouer.\n\n## 📖 Où trouver quoi\n\n| Je veux... | Aller à |\n|---|---|\n| Installer ou mettre à jour le plugin | [Installation](page:installation) |\n| Comprendre une partie (rounds, économie, spike) | [Déroulement du jeu](page:gameplay) |\n| Connaître les touches | [Contrôles](page:controls) |\n| Voir tous les agents et capacités | [Agents](page:agents) |\n| Comprendre les points d'ultime et les orbes | [Système d'ultime](page:ultimate) |\n| Connaître les armes | [Armes](page:weapons) |\n| Rejoindre, héberger, voir ses stats | [Lobby et matchmaking](page:lobby) |\n| Construire ma propre map | [Création de map](page:map-setup) |\n| Télécharger une map toute faite | [Import de maps](page:importing-maps) |\n| Ajouter des tyroliennes | [Tyroliennes](page:ziplines) |\n| Régler un souci de pack de textures | [Pack de textures](page:resource-pack) |\n| Trouver une commande | [Commandes et permissions](page:commands) |\n| Régler le plugin | [Configuration](page:configuration) |\n| Tester les armes hors partie | [Stand de tir](page:practice-range) |\n| Résoudre un problème | [Dépannage](page:troubleshooting) |\n| Compiler ou contribuer | [Développement](page:development) |\n\n## ✨ Points forts\n\n- 🎭 **15 agents** répartis en Duellistes, Initiateurs, Contrôleurs et Sentinelles\n- ⚡ **Système d'ultime** alimenté par les éliminations, les morts, la spike et les orbes d'ultime\n- 🧭 **Tyroliennes** sur lesquelles on peut glisser et tirer\n- 🏟️ **Lobby avec matchmaking**, parties hébergées, stats et classements\n- 🔫 **Armes hitscan** avec imprécision, recul, pénétration et modèles 3D\n- 🗺️ **Éditeur de maps en jeu** et import des maps Valorant d'Ommo\n- 📦 **Pack de textures auto-hébergé** servi sur le port Minecraft (compatible Pterodactyl)\n\n## 🔗 Liens\n\n- Téléchargement : [Valocraft sur Modrinth](https://modrinth.com/plugin/valocraft_stimoi)\n- Signaler un bug ou donner un retour d'équilibrage : ouvrir une issue sur ce dépôt\n", "fr/commands": "# Commandes et permissions\n\n\nLa commande principale est `/vc`.\n\n## Commandes joueur\n\n| Commande | Description |\n|---|---|\n| `/vc join [map]` | Rejoindre une partie (menu sans argument) |\n| `/vc leave` | Quitter la partie |\n| `/vc list` | Lister les parties |\n| `/vc shop` | Ouvrir la boutique |\n| `/vc lobby` | Retour au lobby |\n| `/vc pack send` | (Re)recevoir le pack de textures |\n| `/vc pack remove` | Retirer le pack de textures |\n\n## Commandes admin\n\n| Commande | Description |\n|---|---|\n| `/vc setlobby` | Définir le lobby à ta position |\n| `/vc wand` | Obtenir la baguette de sélection (clic gauche = pos1 / point A, clic droit = pos2 / point B) |\n| `/vc start <map>` | Forcer le début d'une partie |\n| `/vc stop <map>` | Forcer l'arrêt d'une partie |\n| `/vc give <arme\\|knife\\|spike> [joueur]` | Donner une arme, le couteau ou la spike |\n| `/vc reload` | Recharger `config.yml` et `weapons.yml` |\n| `/vc pack send <joueur\\|all>` | Envoyer le pack de textures |\n| `/vc pack remove <joueur\\|all>` | Retirer le pack de textures |\n| `/vc pack info` | Mode et lien du pack |\n| `/vc pack reload` | Recharger le pack après modification |\n| `/vc import list` | Afficher le catalogue de maps |\n| `/vc import <nom>` | Télécharger et installer une map ([Import de maps](page:importing-maps)) |\n\n## Commandes de map (admin)\n\nVoir [Création de map](page:map-setup) pour le déroulé.\n\n| Commande | Description |\n|---|---|\n| `/vc map create <id>` | Créer une map |\n| `/vc map setname <id> <nom>` | Définir le nom affiché |\n| `/vc map setwaiting <id>` | Salle d'attente = ta position |\n| `/vc map addspawn <id> <attack\\|defend>` | Ajouter un spawn à ta position |\n| `/vc map addsite <id> <A\\|B\\|C...>` | Site de spike à partir de la sélection |\n| `/vc map addwall <id> [bloc]` | Mur de pré-round à partir de la sélection |\n| `/vc map previewwalls <id>` | Afficher / masquer les murs |\n| `/vc map setplayers <id> <min> <max>` | Limites de joueurs |\n| `/vc map setmusic <id> <son>` | Musique de la map |\n| `/vc map addorb <id>` | Ajouter un orbe d'ultime à ta position |\n| `/vc map clearorbs <id>` | Retirer tous les orbes |\n| `/vc map addzipline <id>` | Tyrolienne entre les deux points de la baguette |\n| `/vc map ziplines <id>` | Lister les tyroliennes |\n| `/vc map removezipline <id> <n>` | Retirer une tyrolienne |\n| `/vc map info <id>` | Voir ce qui manque pour que la map soit jouable |\n| `/vc map enable <id>` | Activer la map |\n\n## Permissions\n\n| Permission | Par défaut | Description |\n|---|---|---|\n| `valocraft.play` | Tout le monde | Jouer à Valocraft |\n| `valocraft.admin` | Opérateurs | Commandes d'administration |\n", "fr/troubleshooting": "# Dépannage\n\n\n## Le pack de textures ne se charge pas\n\n1. Regarder la **console du serveur** : elle indique le lien proposé à chaque joueur et la réponse du client (`ACCEPTED`, `DECLINED`, `FAILED_DOWNLOAD`, `SUCCESSFULLY_LOADED`...).\n2. Demander au joueur de refaire `/vc pack send` pour le recevoir à nouveau.\n3. Admins : `/vc pack info` affiche le mode et le lien, `/vc pack reload` le recharge.\n4. Si l'hébergement sur le port Minecraft ne fonctionne pas chez vous, utiliser un port dédié (`resource-pack.self-host.http-port: 8164`) ou une URL externe. Voir [Pack de textures](page:resource-pack).\n\n## Ma map ne démarre pas / n'est pas jouable\n\nFaire `/vc map info <id>` : la commande liste ce qui manque (salle d'attente, spawns, sites, murs, limites de joueurs, activation). Voir [Création de map](page:map-setup).\n\n## Une map importée est refusée\n\nLa map a été sauvegardée dans une **version de Minecraft plus récente** que le serveur. Lotus, Sunset et Breeze demandent **Minecraft 1.21.11**. Voir [Import de maps](page:importing-maps).\n\n## Les armes automatiques tirent lentement\n\nMinecraft envoie **un signal par clic gauche** : avec le tir au clic gauche, les armes automatiques tirent donc au rythme des clics. Pour un tir en maintenant le bouton, mettre `controls.fire-button: RIGHT` dans `config.yml`. Voir [Contrôles](page:controls).\n\n## Mon écran « revient en arrière » pendant les rafales\n\nCorrigé dans la **2.1** : le recul ne déplace plus la caméra et est appliqué entièrement à la trajectoire des balles. Mettre à jour en 2.1. Voir [Armes](page:weapons).\n\n## Je ne peux ni tirer ni utiliser de capacités\n\nTu es peut-être **immobilisé** (Lockdown ou Thrash). Voir le tableau des états sur [Agents](page:agents).\n\n## Des joueurs ont perdu leurs objets après un crash\n\nLes inventaires sauvegardés pendant une partie sont dans `plugins/Valocraft/playerdata/` et **rendus à la reconnexion**. Les blocs temporaires (murs, spike) de `plugins/Valocraft/data/` sont restaurés automatiquement.\n\n## J'ai mis à jour et quelque chose cloche\n\n- Retirer l'**ancien jar** (`Valocraft-2.0.0.jar`) pour ne garder que `Valocraft-2.1.jar`. Voir [Installation](page:installation).\n- Valocraft **1.x** n'est pas compatible avec la 2.x.\n\n## Toujours bloqué ?\n\nOuvrir une issue sur ce dépôt avec la version du serveur, la version de Valocraft et la partie utile de la console.\n", "fr/map-setup": "# Création de map\n\n\nLes maps se configurent **en jeu** avec `/vc map ...` et la baguette de sélection. Cette page construit une map nommée `ascent` de zéro. Pour éviter de la construire, voir [Import de maps](page:importing-maps).\n\n## Ce qu'il faut pour qu'une map soit jouable\n\n- Une **salle d'attente**\n- Des spawns **attaque** et **défense** (5 chacun en général)\n- Au moins un **site de spike** (A, B, C...)\n- Des **murs de pré-round**\n- Les limites de joueurs\n- Être **activée**\n\n`/vc map info <id>` liste exactement ce qui manque.\n\n## Déroulé complet\n\n```\n/vc map create ascent\n/vc map setname ascent Ascent\n/vc map setwaiting ascent            (salle d'attente = ta position)\n/vc map addspawn ascent attack       (répéter pour chaque joueur, 5 en général)\n/vc map addspawn ascent defend\n/vc wand                             (clic gauche = pos1, clic droit = pos2)\n/vc map addsite ascent A             (sélection = zone de pose du site A)\n/vc map addsite ascent B\n/vc map addwall ascent               (sélection = mur de pré-round, verre vert par défaut)\n/vc map addwall ascent light_blue_stained_glass\n/vc map previewwalls ascent          (afficher / masquer les murs pour vérifier)\n/vc map setplayers ascent 2 10\n/vc map setmusic ascent hrdavalorant.maps.ascent\n/vc map addorb ascent                (orbes d'ultime, optionnel)\n/vc map addzipline ascent            (tyroliennes, optionnel)\n/vc map enable ascent\n```\n\n## Étape par étape\n\n### 1. Créer et nommer\n\n`/vc map create <id>` puis `/vc map setname <id> <nom affiché>`.\n\n### 2. Salle d'attente et spawns\n\nSe placer à l'endroit voulu et faire `/vc map setwaiting <id>`. Répéter `/vc map addspawn <id> attack` et `/vc map addspawn <id> defend` à chaque position de spawn.\n\n### 3. Sites de spike\n\n1. `/vc wand`\n2. **Clic gauche** = pos1, **clic droit** = pos2.\n3. `/vc map addsite <id> A` (et `B`, `C`...). La sélection devient la zone de pose.\n\n### 4. Murs de pré-round\n\nSélectionner la zone avec la baguette, puis `/vc map addwall <id> [bloc]`. Le bloc par défaut est le **verre vert** ; indiquer un autre bloc comme `light_blue_stained_glass` pour changer.\n\n- Les murs ne remplissent que les blocs **vides** de la zone et sont retirés à l'identique au début du round : la map n'est **jamais abîmée**.\n- `/vc map previewwalls <id>` affiche ou masque un aperçu pour vérifier le placement.\n\n### 5. Joueurs et musique\n\n`/vc map setplayers <id> <min> <max>` règle le nombre de joueurs, et `/vc map setmusic <id> <son>` la musique.\n\n### 6. Options\n\n- [Orbes d'ultime](page:ultimate) : `/vc map addorb <id>` / `/vc map clearorbs <id>`\n- [Tyroliennes](page:ziplines)\n\n### 7. Activer\n\n`/vc map enable <id>`.\n\n## Protection en cas de crash\n\nLes blocs posés (murs, spike) sont **enregistrés sur disque** dans `plugins/Valocraft/data/` et **restaurés si le serveur plante**.\n\n## Voir aussi\n\n- [Commandes et permissions](page:commands)\n- [Import de maps](page:importing-maps)\n", "fr/resource-pack": "# Pack de textures\n\n\nValocraft utilise le pack de textures **HrdaValorant** (son du Classic corrigé) ainsi que les modèles d'armes Valocraft. Il est **embarqué dans le jar du plugin**.\n\n## Fonctionnement par défaut\n\n1. Au premier démarrage, le pack est extrait dans `plugins/Valocraft/resourcepack.zip`.\n2. Il est **servi sur le port Minecraft lui-même** et envoyé à chaque joueur à la connexion.\n3. Le lien de téléchargement reprend **l'adresse et le port utilisés par le joueur** pour se connecter.\n\nAucun port supplémentaire à ouvrir, et ça fonctionne sur **Pterodactyl**. Le pack est mis à jour automatiquement avec le plugin.\n\n## Commandes joueur\n\n| Commande | Effet |\n|---|---|\n| `/vc pack send` | (Re)recevoir le pack |\n| `/vc pack remove` | Retirer le pack |\n\n## Commandes admin\n\n| Commande | Effet |\n|---|---|\n| `/vc pack send <joueur\\|all>` | Envoyer le pack à un joueur ou à tout le monde |\n| `/vc pack remove <joueur\\|all>` | Retirer le pack pour un joueur ou tout le monde |\n| `/vc pack info` | Affiche le mode et le lien |\n| `/vc pack reload` | Recharge le pack après modification |\n\n## Alternatives\n\nÀ régler dans `config.yml` :\n\n| Objectif | Réglage |\n|---|---|\n| Utiliser un **port HTTP dédié** | `resource-pack.self-host.http-port: 8164` |\n| Utiliser une **URL externe** | `self-host.enabled: false`, puis `resource-pack.url` et `sha1` |\n\n## Lire la console\n\nPour chaque joueur, la console indique le **lien proposé** et la **réponse du client**, par exemple : `ACCEPTED`, `DECLINED`, `FAILED_DOWNLOAD`, `SUCCESSFULLY_LOADED`.\n\nVoir [Dépannage](page:troubleshooting) si le pack ne se charge pas.\n", "fr/agents": "# Agents\n\n\nValocraft compte **15 agents** répartis en quatre rôles. Après le compte à rebours, une **phase de sélection d'agent de 25 s** s'ouvre :\n\n- Chaque agent est **unique dans une équipe**.\n- Un joueur qui ne choisit pas reçoit un **agent libre au hasard**.\n- Le menu affiche les agents par rôle, avec capacités, prix et coût de l'ultime.\n- La **réplique** de l'agent (pack HrdaValorant) est jouée à toute l'équipe au verrouillage.\n\n**Lire les tableaux :** les prix sont en ¤ et le nombre après le prix est le **nombre de charges max**. *Offert* = donné à chaque round. Le coût des ultimes est en **points** (voir [Système d'ultime](page:ultimate)). Touches **5 / 6 / 7 / 8** = **C / Q / E / X** ([Contrôles](page:controls)). Les charges s'achètent sur la ligne du bas de la boutique.\n\n## Duellistes\n\n| Agent | C | Q | E (signature) | X (ultime) |\n|---|---|---|---|---|\n| **Jett** | Cloudburst : fumée lancée (200 ¤, 2) | Updraft : saut en hauteur (150 ¤, 2) | Tailwind : dash dans la direction du mouvement (offert, revient après 2 kills) | Blade Storm : 5 couteaux précis, rechargés à chaque kill (8) |\n| **Phoenix** | Blaze : mur de feu, soigne Phoenix (200 ¤) | Curveball : flash courbée (250 ¤, 2) | Hot Hands : zone de feu, soigne Phoenix (offert, revient après 2 kills) | Run it Back : 10 s, renaît au point de départ s'il meurt (6) |\n| **Raze** | Boom Bot : robot qui traque et explose (300 ¤) | Blast Pack : charge qui projette tout le monde, Raze compris (200 ¤, 2) | Paint Shells : grenade à fragmentation (offerte, revient après 2 kills) | Showstopper : roquette dévastatrice (8) |\n| **Reyna** | Leer : œil qui aveugle ceux qui le regardent (250 ¤, 2) | Devour : +100 PV après un kill (200 ¤, 2) | Dismiss : intangible et rapide 2 s après un kill (offert) | Empress : 30 s de cadence et vitesse, prolongée par les kills (6) |\n| **Neon** | Fast Lane : deux murs électriques (300 ¤) | Relay Bolt : éclair qui sonne (200 ¤, 2) | High Gear : sprint 8 s, recharge 30 s | Overdrive : rayon électrique précis 12 s, prolongé par les kills (7) |\n\n## Initiateurs\n\n| Agent | C | Q | E (signature) | X (ultime) |\n|---|---|---|---|---|\n| **Sova** | Owl Drone : drone guidé par le regard qui révèle (400 ¤) | Shock Bolt : flèche explosive (150 ¤, 2) | Recon Bolt : révèle les ennemis en vue, recharge 40 s | Hunter's Fury : 3 tirs qui traversent les murs (8) |\n| **Skye** | Regrowth : soigne les alliés proches (200 ¤) | Trailblazer : tigre guidé qui sonne (250 ¤) | Guiding Light : faucon guidé qui flashe (1 offert, 250 ¤, recharge 40 s) | Seekers : 3 traqueurs sur les 3 ennemis les plus proches (8) |\n| **Gekko** | Mosh Pit : flaque très dangereuse (250 ¤) | Wingman : créature qui sonne le premier ennemi (300 ¤) | Dizzy : aveugle les ennemis en vue, recharge 30 s | Thrash : créature guidée qui immobilise (8) |\n\n## Contrôleurs\n\n| Agent | C | Q | E (signature) | X (ultime) |\n|---|---|---|---|---|\n| **Brimstone** | Stim Beacon : cadence et vitesse des alliés (200 ¤) | Incendiary : grenade incendiaire (250 ¤) | Sky Smoke : fumée longue portée là où tu vises (1 offerte, 100 ¤, 3) | Orbital Strike : frappe sur la zone visée (8) |\n| **Omen** | Shrouded Step : téléportation courte (100 ¤, 2) | Paranoia : ombre qui traverse les murs et aveugle (300 ¤) | Dark Cover : fumée longue portée (1 offerte, 150 ¤, recharge 30 s) | From the Shadows : téléportation n'importe où (7) |\n| **Viper** | Snake Bite : acide + vulnérabilité (200 ¤, 2) | Poison Cloud : nuage toxique (200 ¤) | Toxic Screen : mur toxique de 30 blocs à travers les murs (offert) | Viper's Pit : immense nuage, les ennemis n'y voient rien (9) |\n| **Harbor** | Cascade : vague mobile qui ralentit (150 ¤) | Cove : sphère d'eau (350 ¤) | High Tide : long mur d'eau (offert) | Reckoning : 3 geysers qui sonnent (7) |\n\n## Sentinelles\n\n| Agent | C | Q | E (signature) | X (ultime) |\n|---|---|---|---|---|\n| **Sage** | Barrier Orb : mur de glace destructible (400 ¤) | Slow Orb : zone de ralentissement (200 ¤, 2) | Healing Orb : soigne un allié (clic gauche) ou soi-même (clic droit), recharge 45 s | Resurrection : ressuscite un allié mort visé (8) |\n| **Killjoy** | Nanoswarm : essaim de nanobots (200 ¤, 2) | Alarmbot : piège, rend vulnérable (200 ¤) | Turret : tourelle 30 s (offerte) | Lockdown : immobilise les ennemis dans 20 blocs après 10 s (8) |\n| **Cypher** | Trapwire : fil entre deux murs, révèle et sonne (200 ¤, 2) | Cyber Cage : petite fumée (100 ¤, 2) | Spycam : caméra qui révèle 45 s (offerte) | Neural Theft : sur un ennemi mort, révèle tous les ennemis 2 fois (6) |\n\n## États\n\n| État | Effet | Causé par |\n|---|---|---|\n| **Sonné** | Ralenti, la vue tangue | Capacités qui sonnent |\n| **Aveuglé** | Vision noire | Flashs, Leer, Paranoia, Dizzy, Seekers |\n| **Vulnérable** | +50 % de dégâts reçus | Alarmbot, Snake Bite |\n| **Immobilisé** | Impossible de tirer ou d'utiliser une capacité | Lockdown, Thrash |\n| **Révélé** | Contour lumineux visible à travers les murs | Capacités de révélation |\n| **Intangible** | Aucun dégât | Dismiss |\n\n## Adaptations dues à Minecraft\n\n- Les **fumées** sont faites de particules et aveuglent ceux qui sont dedans.\n- Les **flashs** rendent la vision **noire** et non blanche.\n- Le contour des ennemis **révélés** est visible par **tout le monde**, pas seulement par l'équipe qui révèle.\n\n## Équilibrage\n\nLes capacités n'ont **pas encore été équilibrées en partie réelle**. Vos retours sont les bienvenus via les issues GitHub. Les propriétaires de serveur peuvent régler dégâts, durées et prix dans `AbilityType.java` et `Kits.java` (voir [Développement](page:development)).\n", "fr/controls": "# Contrôles\n\n\n| Touche | Action |\n|---|---|\n| **Clic gauche** | Tirer (armes automatiques : cliquer vite pour tirer en rafale) |\n| **Clic droit (maintenu)** | Viser / lunette |\n| **Q** | Recharger |\n| **Accroupi + Q** | Lâcher l'arme (ou la spike) |\n| **F** | Boutique pendant la phase d'achat, sinon ramasser l'arme visée |\n| **1 / 2 / 3 / 4** | Arme principale / pistolet / couteau / spike |\n| **5 / 6 / 7 / 8** | Capacités de l'agent **C / Q / E / X** |\n| **F** près d'une corde | S'accrocher à une [tyrolienne](page:ziplines) |\n| **Clic droit maintenu** avec la spike, sur un site | Poser la spike (rester immobile) |\n| **Clic droit maintenu** sur la spike (défenseur) | Désamorcer (rester immobile) |\n\n## Contrôles des capacités\n\n- **Capacités instantanées** : elles s'activent dès qu'on appuie sur la touche. Updraft, Tailwind, Devour, Dismiss, High Gear, Regrowth, et les ultimes Run it Back, Empress, Lockdown, Viper's Pit et Seekers.\n- **Toutes les autres** : **clic gauche** pour lancer, **clic droit** pour la variante quand il y en a une (Curveball à droite, flèches de Sova sans rebond, Healing Orb sur soi, Blade Storm tous les couteaux).\n- **Capacités guidées** (drone de Sova, faucon et tigre de Skye, Thrash de Gekko) : elles suivent ton regard.\n- **Jett** plane en maintenant la touche de saut.\n\n## Tir automatique et limite du clic gauche\n\nMinecraft n'envoie au serveur qu'**un signal par clic gauche** (rien tant que le bouton reste enfoncé). Avec le tir au clic gauche, les armes automatiques tirent donc au rythme des clics, jusqu'à leur cadence maximale.\n\nPour un vrai tir automatique en maintenant le bouton, mettre dans `config.yml` :\n\n```yaml\ncontrols:\n  fire-button: RIGHT\n```\n\nLe tir se fait alors au **clic droit maintenu**, et la visée au **clic gauche**.\n\n## Interface\n\n- **Barre d'XP** : niveau = balles dans le chargeur, barre = chargeur / progression du rechargement.\n- **Cœurs** = PV (100 PV = 10 cœurs), **cœurs dorés** = bouclier.\n"}</script>
<script>
// ---------- Navigation (slug -> titles). Page content lives in pages/<lang>/<slug>.md ----------
const NAV=[
 [{en:'Getting started',fr:'Démarrage'},[['home','Home','Accueil'],['installation','Installation','Installation'],['lobby','Lobby and Matchmaking','Lobby et matchmaking']]],
 [{en:'Playing',fr:'Jouer'},[['gameplay','Gameplay','Déroulement du jeu'],['controls','Controls','Contrôles'],['agents','Agents','Agents'],['ultimate','Ultimate System','Système d\'ultime'],['weapons','Weapons','Armes'],['ziplines','Ziplines','Tyroliennes']]],
 [{en:'Server admin',fr:'Administration'},[['map-setup','Map Setup','Création de map'],['importing-maps','Importing Maps','Import de maps'],['resource-pack','Resource Pack','Pack de textures'],['commands','Commands and Permissions','Commandes et permissions'],['configuration','Configuration','Configuration'],['practice-range','Practice Range','Stand de tir']]],
 [{en:'Help',fr:'Aide'},[['troubleshooting','Troubleshooting','Dépannage'],['development','Development','Développement']]]
];
const UI={en:{nf:'Page not found.',err:'Could not load this page.'},fr:{nf:'Page introuvable.',err:'Impossible de charger cette page.'}};
const $=s=>document.querySelector(s), cache={};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let lang=localStorage.getItem('vc-lang')||((navigator.language||'en').toLowerCase().startsWith('fr')?'fr':'en');
let slug='home';

// ---------- Minimal Markdown renderer ----------
function inl(s){
  const k=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{k.push('<code>'+esc(c)+'</code>');return '\u0002'+(k.length-1)+'\u0002'});
  s=esc(s)
   .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">')
   .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,u)=>{
     if(u.startsWith('page:'))return `<a href="#/${lang}/${u.slice(5)}">${t}</a>`;
     return `<a href="${u}" target="_blank" rel="noopener">${t}</a>`})
   .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
   .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,:;]|$)/g,'$1<em>$2</em>');
  return s.replace(/\u0002(\d+)\u0002/g,(m,i)=>k[i]);
}
function md(src){
  const codes=[];
  src=src.replace(/```\w*\n([\s\S]*?)```/g,(m,c)=>{codes.push('<pre><code>'+esc(c)+'</code></pre>');return '\n\u0000'+(codes.length-1)+'\u0000\n'});
  const L=src.split('\n'),out=[],blk=l=>/^(#{1,4} |>|\||[-*] |\d+\. |---+$|<|\u0000)/.test(l);
  let i=0;
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    if(/^\u0000\d+\u0000$/.test(l)){out.push(codes[+l.slice(1,-1)]);i++;continue}
    if(l[0]==='<'){const b=[];while(i<L.length&&L[i].trim()){b.push(L[i]);i++}out.push(b.join('\n'));continue}
    let m=l.match(/^(#{1,4}) (.*)/);
    if(m){out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^---+$/.test(l)){out.push('<hr>');i++;continue}
    if(l[0]==='>'){const b=[];while(i<L.length&&L[i][0]==='>'){b.push(L[i].replace(/^>\s?/,''));i++}out.push('<blockquote>'+inl(b.join(' '))+'</blockquote>');continue}
    if(l[0]==='|'){
      const rows=[];while(i<L.length&&L[i][0]==='|'){rows.push(L[i]);i++}
      const cells=r=>r.trim().replace(/\\\|/g,'\u0001').replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim().replace(/\u0001/g,'|')));
      const h=cells(rows[0]),body=rows.slice(2).map(cells);
      out.push('<table><thead><tr>'+h.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table>');continue}
    if(/^([-*]|\d+\.) /.test(l)){
      const ol=/^\d/.test(l),b=[];
      while(i<L.length&&/^([-*]|\d+\.) /.test(L[i])){b.push(L[i].replace(/^([-*]|\d+\.) /,''));i++}
      out.push((ol?'<ol>':'<ul>')+b.map(x=>`<li>${inl(x)}</li>`).join('')+(ol?'</ol>':'</ul>'));continue}
    const p=[];while(i<L.length&&L[i].trim()&&(!blk(L[i])||!p.length)){p.push(L[i]);i++}
    out.push('<p>'+inl(p.join(' '))+'</p>');
  }
  return out.join('\n');
}

// ---------- Router ----------
function buildNav(){
  $('#nav').innerHTML=NAV.map(([g,items])=>`<h4>${g[lang]}</h4>`+items.map(([s,e,f])=>`<a href="#/${lang}/${s}" class="${s===slug?'on':''}">${lang==='fr'?f:e}</a>`).join('')).join('');
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.documentElement.lang=lang;
}
async function route(){
  const m=location.hash.match(/^#\/(en|fr)\/([\w-]+)$/);
  if(!m){const u=`#/${lang}/home`;try{history.replaceState(null,'',u);return route()}catch(e){location.hash=u;return}}
  lang=m[1];slug=m[2];localStorage.setItem('vc-lang',lang);
  buildNav();$('#nav').classList.remove('open');
  const known=NAV.some(g=>g[1].some(x=>x[0]===slug)),key=lang+'/'+slug,main=$('#main');
  try{
    if(!known)throw 404;
    if(!cache[key]){if(window.PAGES&&PAGES[key]!=null)cache[key]=PAGES[key];else{const r=await fetch(`pages/${key}.md`);if(!r.ok)throw r.status;cache[key]=await r.text()}}
    main.innerHTML=md(cache[key]);
    const t=NAV.flatMap(g=>g[1]).find(x=>x[0]===slug);
    document.title=(slug==='home'?'':(lang==='fr'?t[2]:t[1])+' – ')+'Valocraft Wiki';
  }catch(e){main.innerHTML=`<h1>${e===404?UI[lang].nf:UI[lang].err}</h1><p><a href="#/${lang}/home">← ${lang==='fr'?'Accueil':'Home'}</a></p>`}
  scrollTo(0,0);
}
const mq=matchMedia('(prefers-color-scheme:dark)');
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':mq.matches};
const paintTheme=()=>{$('#theme').textContent=isDark()?'☀️':'🌙'};
$('#theme').onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('vc-theme',t)}catch(e){}paintTheme()};
mq.addEventListener('change',paintTheme);paintTheme();
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{location.hash=`#/${b.dataset.l}/${slug}`});
$('#menu').onclick=()=>$('#nav').classList.toggle('open');
addEventListener('hashchange',route);
route();
</script>
