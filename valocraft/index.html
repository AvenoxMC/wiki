<script id="pages-data">window.PAGES={"en/agents": "# Agents\n\n\nValocraft has **29 agents** in four roles. All of them are unlocked by default (`progression.default-agents: [ALL]`).\n\n## Agent select\n\nAfter the countdown, **agent select** (25 s) opens **in the lobby**, as a menu:\n\n- Each agent is **unique within a team**, except in [Replication](page:modes) mode where the whole team plays the most-picked agent.\n- A player who doesn't choose gets a **random free agent**.\n- The agent's **voice line** plays to the whole team on lock-in.\n- During the match, the player wears their agent's **full skin** (see below).\n\n**How to read the tables:** prices are in ¤; *max* = maximum charges; *free* = granted every round; *cooldown* = time to get the free charge back. Ultimate costs are in **points** ([Ultimate System](page:ultimate)). Keys **5 / 6 / 7 / 8** = **C / Q / E / X**, then **left click** to use ([Controls](page:controls)). Charges are bought in the shop's bottom row. Everything can be tuned in `abilities.yml` ([Configuration](page:configuration)).\n\n## Duelists\n\n| Agent | C | Q | E (signature) | X (ultimate) |\n|---|---|---|---|---|\n| **Jett** | **Cloudburst**: thrown smoke that blocks vision (200 ¤, max 2) | **Updraft**: launches Jett into the air (150 ¤, max 2) | **Tailwind**: use to charge the wind (7.5 s), use again to dash; returns after 2 kills (free) | **Blade Storm**: 5 precise knives, refilled on kill — **8 pts** |\n| **Phoenix** | **Blaze**: flame wall that blocks vision and heals Phoenix (200 ¤) | **Curveball**: curving flash: left click curves left, right click curves right (250 ¤, max 2) | **Hot Hands**: fireball: zone that burns enemies and heals Phoenix (free) | **Run it Back**: for 10 s, if Phoenix dies he respawns at the starting point — **6 pts** |\n| **Raze** | **Boom Bot**: robot that rushes the nearest enemy and explodes (300 ¤) | **Blast Pack**: charge that knocks back everyone around (Raze included) (200 ¤, max 2) | **Paint Shells**: cluster grenade; returns after 2 kills (free) | **Showstopper**: rocket launcher: one devastating rocket — **8 pts** |\n| **Reyna** | **Leer**: eye that blinds enemies who look at it (250 ¤, max 2) | **Devour**: after a kill (3 s): heal 100 HP (200 ¤, max 2) | **Dismiss**: after a kill (3 s): invulnerable and fast for 2 s (free, max 2) | **Empress**: 30 s frenzy: faster fire rate and movement — **6 pts** |\n| **Neon** | **Fast Lane**: two electric walls that block vision (300 ¤) | **Relay Bolt**: bolt that bounces, then concusses nearby enemies (200 ¤, max 2) | **High Gear**: toggles the sprint (energy gauge); crouch while sprinting to slide (free) | **Overdrive**: 12 s: precise electric beam and max speed; refills energy — **7 pts** |\n| **Iso** | **Contingency**: energy wall that moves forward and blocks vision (200 ¤) | **Undercut**: bolt that goes through walls and makes vulnerable (200 ¤, max 2) | **Double Tap**: shield that absorbs one bullet (12 s); returns after 2 kills (free) | **Kill Contract**: Iso and the enemy hit fight alone in a glass arena above the map (15 s) — **7 pts** |\n| **Yoru** | **Fakeout**: decoy that walks forward and blinds enemies who approach (100 ¤) | **Blindside**: flash that bounces off walls (250 ¤, max 2) | **Gatecrash**: place a rift (left click), then teleport to it (left click) (free, 35 s cooldown) | **Dimensional Drift**: 10 s invisible and untouchable (can't shoot); left click to exit — **8 pts** |\n| **Waylay** | **Saturate**: light orb that slows and hinders (lower fire rate) (200 ¤) | **Lightspeed**: two quick dashes (150 ¤) | **Refract**: place a beacon here (left click), then come back to it (left click, 8 s) (free, 30 s cooldown) | **Convergent Paths**: beam that slows and hinders every enemy in front of you — **8 pts** |\n\n## Initiators\n\n| Agent | C | Q | E (signature) | X (ultimate) |\n|---|---|---|---|---|\n| **Sova** | **Owl Drone**: drone you pilot in first person, its dart marks enemies (400 ¤) | **Shock Bolt**: explosive arrow (left click: 1 bounce, right click: none); hold to shoot further (150 ¤, max 2) | **Recon Bolt**: arrow that reveals enemies in its line of sight; hold to shoot further (free, 40 s cooldown) | **Hunter's Fury**: 3 energy blasts that go through walls — **8 pts** |\n| **Skye** | **Regrowth**: heals nearby allies (60 HP) (200 ¤) | **Trailblazer**: tiger you pilot in first person, its leap concusses (250 ¤) | **Guiding Light**: guided hawk that explodes into a flash (free, +250 ¤, max 2, 40 s cooldown) | **Seekers**: 3 trackers that chase the 3 nearest enemies — **8 pts** |\n| **Gekko** | **Mosh Pit**: creature that bursts into a very dangerous puddle (250 ¤) | **Wingman**: creature that walks forward and concusses the first enemy it meets (300 ¤) | **Dizzy**: flying creature that blinds enemies in view (free, 30 s cooldown) | **Thrash**: guided creature that detains enemies on impact — **8 pts** |\n| **Breach** | **Aftershock**: charge through a wall: 3 blasts on the other side (200 ¤) | **Flashpoint**: flash that goes through the targeted wall (250 ¤, max 2) | **Fault Line**: straight seismic wave that concusses enemies (free, 35 s cooldown) | **Rolling Thunder**: cone earthquake: concusses and knocks up enemies — **9 pts** |\n| **Fade** | **Prowler**: guided creature that blinds the first enemy it meets (250 ¤, max 2) | **Seize**: orb that detains enemies and makes them vulnerable (200 ¤) | **Haunt**: thrown eye that reveals enemies in view (free, 40 s cooldown) | **Nightfall**: nightmare wave: reveals and weakens the enemies it hits — **8 pts** |\n| **Tejo** | **Stealth Drone**: drone you pilot in first person: reveals, then suppresses at the end (300 ¤) | **Special Delivery**: sticky concussive grenade (200 ¤) | **Guided Salvo**: tactical map: missile on the chosen point (free, max 2, 40 s cooldown) | **Armageddon**: tactical map: line of bombs (along your view) — **8 pts** |\n| **KAY/O** | **FRAG/ment**: grenade that explodes several times (200 ¤) | **FLASH/drive**: flash: left click normal, right click quick (250 ¤, max 2) | **ZERO/point**: knife that suppresses nearby enemies' abilities (free, 40 s cooldown) | **NULL/cmd**: 12 s of suppression pulses, fire rate and speed — **8 pts** |\n\n## Controllers\n\n| Agent | C | Q | E (signature) | X (ultimate) |\n|---|---|---|---|---|\n| **Brimstone** | **Stim Beacon**: zone that boosts allies' fire rate and speed (200 ¤) | **Incendiary**: incendiary grenade: fire zone (250 ¤) | **Sky Smoke**: places a smoke where you aim on the tactical map (free, +100 ¤, max 3) | **Orbital Strike**: devastating orbital strike on the targeted zone — **8 pts** |\n| **Omen** | **Shrouded Step**: short teleport where you aim (100 ¤, max 2) | **Paranoia**: shadow that goes through walls and blinds everything it touches (300 ¤) | **Dark Cover**: long-range smoke placed on the tactical map (free, +150 ¤, max 2, 30 s cooldown) | **From the Shadows**: teleport anywhere on the map — **7 pts** |\n| **Viper** | **Snake Bite**: acid vial: damage and vulnerability (200 ¤, max 2) | **Poison Cloud**: toxic cloud emitter you toggle on and off (fuel) (200 ¤) | **Toxic Screen**: long toxic wall you toggle on and off (fuel) (free) | **Viper's Pit**: huge toxic cloud around Viper: enemies inside can't see — **9 pts** |\n| **Harbor** | **Cascade**: wave that moves forward, blocks vision and slows (150 ¤) | **Cove**: water sphere that blocks vision (350 ¤) | **High Tide**: long water wall that slows (free) | **Reckoning**: 3 geysers that concuss enemies in the targeted zone — **7 pts** |\n| **Astra** | **Gravity Well**: tactical map: pulls enemies in, then makes them vulnerable (150 ¤) | **Nova Pulse**: tactical map: concussive pulse (150 ¤) | **Nebula**: tactical map: smoke anywhere on the map (free, +150 ¤, max 2, 25 s cooldown) | **Cosmic Divide**: tactical map: giant cosmic wall that blocks vision (along your view) — **7 pts** |\n| **Clove** | **Pick-me-up**: after a kill or assist (3 s): heal and speed (100 ¤) | **Meddle**: fragment that temporarily weakens enemies (decay) (250 ¤) | **Ruse**: tactical map: smokes anywhere (2 free, max 2, 40 s cooldown) | **Not Dead Yet**: triggers on death: you come back, get a kill or assist within 12 s — **8 pts** |\n| **Miks** | **M-Pulse**: sound wave: left click concusses enemies, right click heals allies (250 ¤) | **Harmonize**: combat stim for the targeted ally and you (right click: you only) (200 ¤) | **Waveform**: tactical map: wall of sound waves that blocks vision (free, +150 ¤, max 2, 30 s cooldown) | **Bassquake**: shockwave in front of you: knocks back, slows and deafens — **8 pts** |\n\n## Sentinels\n\n| Agent | C | Q | E (signature) | X (ultimate) |\n|---|---|---|---|---|\n| **Sage** | **Barrier Orb**: raises a solid ice wall (400 ¤) | **Slow Orb**: zone that slows everyone crossing it (200 ¤, max 2) | **Healing Orb**: heals the targeted ally (left click) or yourself (right click) (free, 45 s cooldown) | **Resurrection**: revives a dead ally you look at — **8 pts** |\n| **Killjoy** | **Nanoswarm**: grenade that releases a swarm of nanobots (200 ¤, max 2) | **Alarmbot**: trap: reveals and makes the approaching enemy vulnerable (200 ¤) | **Turret**: turret that shoots enemies for 30 s (free) | **Lockdown**: after 10 s, detains enemies in a large radius — **8 pts** |\n| **Cypher** | **Trapwire**: wire between two walls: reveals and slows whoever crosses it (200 ¤, max 2) | **Cyber Cage**: small thrown smoke (100 ¤, max 2) | **Spycam**: wall camera that reveals enemies in view (45 s) (free) | **Neural Theft**: aim at a dead enemy: reveals all enemies twice — **6 pts** |\n| **Deadlock** | **GravNet**: grenade that forces enemies to crouch (200 ¤) | **Sonic Sensor**: sensor that concusses enemies who make noise (200 ¤) | **Barrier Mesh**: cross-shaped barrier that blocks the way (free) | **Annihilation**: traps the first enemy hit: they die after 7 s — **7 pts** |\n| **Veto** | **Crosscut**: place a beacon (left click), then teleport to it (left click) (200 ¤) | **Chokehold**: trap that detains and makes vulnerable (200 ¤, max 2) | **Interceptor**: device that destroys nearby enemy utility (15 s) (free) | **Evolution**: 25 s: immune to effects, regeneration, speed and fire rate — **7 pts** |\n| **Chamber** | **Trademark**: trap that slows and reveals enemies (200 ¤) | **Headhunter**: heavy pistol: one charge = one bullet (159 to the head) (100 ¤, max 8) | **Rendezvous**: place an anchor (left click), then teleport to it (left click, 25 blocks) (free, 30 s cooldown) | **Tour de Force**: sniper with a full-screen scope (right click): 5 lethal bullets, slows around kills — **8 pts** |\n| **Vyse** | **Razorvine**: thorns that hurt and slow (150 ¤) | **Shear**: trap: a wall rises when an enemy walks by (200 ¤) | **Arc Rose**: place a rose (left click), then make it flash (left click) (free, 30 s cooldown) | **Steel Garden**: jams nearby enemies' primary weapons for 8 s — **8 pts** |\n\n> **Miks** is an original Valocraft agent.\n\n## Ability mechanics\n\n- **Manual activation**: the key takes the ability in hand, **left click** uses it. `controls.instant-abilities: true` restores trigger-on-keypress.\n- **Hold to throw**: for thrown abilities (grenades, Jett's smokes, Sova's bolts, Nanoswarm...), holding left click shows the **trajectory** (visible only to you), releasing throws. **Right click**: underhand lob, except for abilities that have a right-click variant.\n- **Visible cooldown**: the signature icon stays in the hotbar with the cooldown sweep.\n- **First-person piloting**: Sova's drone, Skye's tiger and Tejo's drone. You become the creature, your body stays behind and can be killed. Left click = action, right click = back to your body.\n- **Anchor abilities** (Rendezvous, Gatecrash, Refract, Crosscut, Arc Rose): the first click places the anchor, the second uses it.\n- **Tactical map** (Sky Smoke, Dark Cover, Orbital Strike, From the Shadows, Nebula, Ruse, Waveform, Guided Salvo...): a top-down map opens; WASD to aim, left click to place, right click to cancel.\n- **Gauges** in the action bar: **Neon**'s energy (High Gear drains it, kills refill it), **Viper**'s fuel (active emitters consume it), **Jett**'s charged wind.\n- **Destructible utility**: enemy bullets destroy the Turret (125 HP), Spycam (70), Leer and Interceptor (60), Sonic Sensor, Chokehold, Trademark and Shear (40), Alarmbot, Trapwire and Nanoswarm (20).\n\n## Status effects\n\n| Status | Effect | Caused by |\n|---|---|---|\n| **Concussed** | Slowed, view wobbles | Concussive abilities |\n| **Blinded** | **White** screen that fades (flashes) or reduced vision | Flashes, Leer, Paranoia, Dizzy, Seekers |\n| **Vulnerable** | +50% damage taken | Alarmbot, Snake Bite, Seize, Undercut... |\n| **Detained** | No shooting, no abilities | Lockdown, Thrash, Chokehold |\n| **Suppressed** | No abilities | ZERO/point, NULL/cmd, Stealth Drone |\n| **Hindered** | Lower fire rate, slowed | Saturate, Convergent Paths |\n| **Jammed** | Primary weapon unusable | Steel Garden |\n| **Immune** | No negative effects | Evolution (Veto) |\n| **Revealed** | Glowing outline visible through walls | Reveal abilities |\n| **Intangible** | No damage | Dismiss, Dimensional Drift |\n\n## Agent appearance\n\n- **Full skin**: during the match, the player's whole skin becomes their agent's. The original skin comes back in the lobby (`agents.full-skin`).\n- With the **SkinsRestorer** plugin, skins are signed: the player also sees their own agent skin (F5 view, arms). Without it, only other players see it.\n- An agent's skin can be replaced with another skin image or a Minecraft username: `agents.skins.<agent>`.\n- `agents.full-skin: false` brings back **agent heads** (`agents.wear-heads`).\n\n## Smokes\n\nSmokes and walls are opaque, tinted 3D models (orange for Brimstone), visible from afar. An enemy inside or behind a smoke is hidden at any distance; within 2.5 blocks, players see each other. Bullets go through smokes. Settings: `agents.smokes-hide-players`, `agents.solid-smokes`.\n\n## Balancing\n\nAbilities haven't been balanced in real matches yet: feedback is welcome. Values are tuned in `abilities.yml`, no recompiling.\n", "en/changelog": "# Changelog\n\n\nAll notable changes to Valocraft, newest first.\n\n## 2.2\n\n> Replace the jar in `plugins/`; the resource pack updates automatically.\n\n### Added\n\n#### Interface and visuals\n- **Full scoreboard (Tab)**, aligned in columns.\n\n| | Allies | Enemies |\n|---|---|---|\n| Agent and name | ✔ | ✔ |\n| Credits | current credits | credits at the start of the buy phase |\n| Weapon | weapon in hand | – |\n| Health | HP + shield | – |\n| K / D / A | ✔ | ✔ |\n| Ultimate | ✔ | – |\n\n- **Tactical minimap** for Sky Smoke, Dark Cover, Orbital Strike and From the Shadows: a rendered top-down map of the level with a cursor, the sites, teammates and smokes.\n- **Smokes really hide players**:\n  - smokes and walls are opaque, tinted 3D models, visible from afar;\n  - an enemy inside or behind a smoke disappears from your screen at any distance.\n- **Agent heads** worn by every player when full agent skins are turned off (`agents.full-skin: false`, see Agents).\n- **Lobby shop and Radianite**:\n  - agents to unlock;\n  - 6 weapon skin collections (Prime, Reaver, Glitchpop, Ion, Elderflame, Oni) on 18 weapons, i.e. 108 models.\n\n#### Game modes\n- **Swiftplay**: first to 5 rounds, side swap after 4, economy and spike, no overtime (`modes.swiftplay`).\n- **Replication**:\n  - during agent select, everyone votes for an agent (duplicates allowed);\n  - the whole team then plays the most-picked agent;\n  - first to 5 rounds (`modes.replication`).\n- **Escalation**:\n  - two teams, respawns, no abilities;\n  - each level forces a weapon: Odin, Ares, Phantom, Vandal, Spectre, Judge, Bulldog, Guardian, Sheriff, Marshal, Operator, then the **knife**;\n  - 3 team kills per level (1 on the knife level). First team to finish wins, otherwise the furthest team after 10 minutes (`modes.escalation`).\n- **Spike Rush**:\n  - first to 4 rounds;\n  - same random weapon for everyone;\n  - full abilities;\n  - every attacker carries a spike.\n- **Deathmatch**:\n  - free-for-all with 1.5 s respawns;\n  - free weapons for 10 s after spawning;\n  - a kill heals you;\n  - 40 kills or 6 minutes.\n- **Team Deathmatch**: two teams with agents and respawns, 100 kills or 9:30.\n- **Competitive**:\n  - ranks from Iron to Radiant, with 5 placement games;\n  - RR based on result, performance (combat score) and team level gap;\n  - leaving costs RR.\n- Hosts pick the mode when creating a game. `/vc map setmode <map> <mode>` sets a map's default mode.\n\n#### Agents (29 total)\n- 13 new agents: Breach, Astra, Fade, Tejo, Clove, Deadlock, Veto, Iso, Chamber, KAY/O, Vyse, Yoru and Waylay.\n- One new original agent: **Miks** (M-Pulse, Harmonize, Waveform, Bassquake).\n- New status effects:\n  - **suppressed**: no abilities;\n  - **hindered**: lower fire rate, slowed;\n  - **jammed**: no primary weapon;\n  - **immune**: no negative effects.\n- Two-step anchor abilities (Rendezvous, Gatecrash, Refract, Crosscut, Arc Rose): the first use places the anchor, the second uses it.\n- **First-person piloting** for Sova's Owl Drone, Skye's Trailblazer and Tejo's Stealth Drone:\n  - you become the creature, while your body stays behind and can be killed;\n  - left click = creature action, right click = return to your body.\n- **Full agent skins**: during a match, the player's whole skin becomes the agent's (not just a head). The original skin is restored back in the lobby (`agents.full-skin`).\n- **SkinsRestorer support** (optional):\n  - agent skins are signed through MineSkin, so the player also sees their own agent skin (F5 view, arms);\n  - signed skins are created in the background on startup and cached in `data/agent-skins.yml`;\n  - any agent's skin can be replaced with a skin image URL or a Minecraft username (`agents.skins.<agent>`).\n\n#### Abilities\n- **Manual activation**: keys 5–8 select the ability, and left click uses it. Nothing fires just by switching slots. `controls.instant-abilities: true` restores the old behaviour.\n- **White flashes**: a full-screen white overlay that fades in 4 steps. You can't scope while flashed.\n- **Hold-to-throw with trajectory preview**:\n  - hold left click to see the arc (visible only to you), release to throw;\n  - right click = underhand lob;\n  - Sova's bolts go further the longer you hold.\n- **Visible cooldown**: the signature ability icon stays in the hotbar with Minecraft's cooldown sweep while it recharges.\n- **Destructible utility**: enemy bullets destroy deployed utility.\n\n| Utility | HP |\n|---|---|\n| Turret | 125 |\n| Spycam | 70 |\n| Leer, Interceptor | 60 |\n| Sonic Sensor, Chokehold, Trademark, Shear | 40 |\n| Alarmbot, Trapwire, Nanoswarm | 20 |\n\n- **Enemy ultimates**: enemy ult points are shown in the scoreboard, with a chat alert and a sound when an enemy ult is ready.\n- **More faithful kits**:\n  - **Neon**: energy gauge, High Gear toggles the sprint, and crouching while sprinting slides;\n  - **Viper**: fuel gauge, Poison Cloud and Toxic Screen are emitters you toggle on and off;\n  - **Jett**: Tailwind is prepared first, then the dash is triggered;\n  - **Iso**: Kill Contract opens a 1v1 glass arena above the map;\n  - **Chamber**: Tour de Force now has a full-screen sniper scope on right click;\n  - **Brimstone**: smokes are orange.\n- **`abilities.yml`**: price, charges, cooldown, kill recharge and damage per ability, ult cost per agent, global damage and duration multipliers. Applied with `/vc reload`, no recompiling.\n\n#### Maps and loading\n- **On-demand map worlds**:\n  - map worlds stay on disk and are no longer loaded at server startup;\n  - when a match launches, the server loads the world, preloads the spawn chunks and moves everyone in;\n  - an unused world is saved and unloaded (`maps.unload-check`).\n- The **waiting room** and **agent select** now happen in the lobby.\n- **Loading screen**: a menu showing every player's card (banner), agent and title, red team at the top and blue at the bottom, while the map loads (`game.loading-time`).\n- **Player cards are now real banners**: agent color plus a role symbol. They appear in the shop, on the loading screen and in the match summary.\n\n#### Progression and cosmetics\n- **Battle pass**:\n  - 30 levels of 1,000 XP, with XP earned every match (win, loss, kills, assists, rounds won, MVP);\n  - one reward per level, given automatically: Radianite, cards, titles, kill banners, kill sounds, sprays;\n  - `/vc pass` menu. Changing `battlepass.season` resets everyone's level (unlocked rewards are kept).\n- **Kill banners**: on each kill, your symbol is repeated once per kill this round, in your card's color. The victim sees your card and title. 8 styles.\n- **Kill sounds**: the pitch rises with each kill of the round, with a special 5th-kill sound. 7 sets, which you can preview in the shop.\n- **Sprays**:\n  - crouch + F in a match to spray on the targeted wall, floor or ceiling;\n  - text sprays or the emblem of any of the 29 agents;\n  - one per round (every 30 s in respawn modes).\n- **Lobby leaderboards**: holograms placed with `/vc leaderboard set <type>`, refreshed every minute. Types: rank, kills, wins, ACS, headshots, aces, battle pass.\n- **Shop additions**: 14 knives, player cards, 12 titles, kill banners, kill sounds, sprays.\n- **Daily missions**: 3 random missions per day, 150 Radianite each (`/vc missions`).\n- **Match summary**:\n  - combat score, damage, first bloods, ACE announcements;\n  - damage report on death;\n  - end-of-match menu with every player's stats (`/vc resume`).\n\n#### Team play and social\n- **Weapon requests**: clicking a weapon you can't afford asks your team for it. A teammate who has the money clicks **[Buy for …]**: they pay and the weapon goes straight into your inventory.\n- **Parties**:\n  - `/vc party invite|leave|kick|list|chat`;\n  - the party follows its leader into games and stays on the same team.\n- **Team balancing** based on a hidden MMR.\n- **Chat**: rank and title in front of names. Messages starting with `!` go to your team only.\n\n#### Match flow\n- **Reconnect**: a player who disconnects mid-match keeps their slot for 3 minutes and is put back in on return.\n- **Surrender and remake votes**:\n  - `/vc ff`: surrender, from round 5, 80% yes needed;\n  - `/vc remake`: until round 3, if a teammate left.\n- **AFK**: a player who doesn't move gets a warning at 45 s, then is kicked at 90 s.\n- **Lag compensation**: shots are checked against where the shooter saw the target, up to 200 ms back.\n- **Footsteps**:\n  - running is audible to enemies, with a sound that depends on the block underneath;\n  - crouch-walking is silent.\n- **Permanent radar**: a map in the off-hand showing allies, spotted enemies, the spike, the sites and your team's smokes.\n\n#### Admin\n- `/vc forcestart [map]`: starts a match even with a single player. An empty team is never \"eliminated\", and the match doesn't count for ranked.\n- `/vc ult add|set <player> [points]`: adds or sets ult points (`set` without a number fills the ult).\n- `/vc pass addxp <player> <xp>`: gives battle pass XP.\n- `/vc leaderboard set <type> | remove | list`: manages the lobby leaderboards.\n- **All agents unlocked by default** (`progression.default-agents: [ALL]`).\n- **SQLite / MySQL storage** (`storage.type`), with automatic import from `stats.yml`.\n\n### Fixed\n- **Ability icons**:\n  - Harbor's Cove showed a Gekko icon (missing entry in the resource pack);\n  - Chamber's Trademark and Rendezvous icons were swapped;\n  - KAY/O's FRAG/ment and FLASH/drive icons were swapped.\n\n  The pack's ability icon table is now rebuilt from the textures that actually exist.\n- Right click to leave a piloted drone or tiger now works (a dedicated remote item is used).\n- **Sniper scope**: a real full-screen 16:9 scope carried by the helmet. It no longer flickers.\n- **Continuous fire**:\n  - holding left click now fires at the weapon's real fire rate;\n  - weapons can \"mine\" the targeted block up to 64 blocks away (nothing is ever broken), so the client sends a signal every tick;\n  - the arm swing animation is hidden.\n\n---\n\n## 2.1 — Agent Update\n\n### Added\n- **15 playable agents** with an agent select phase and abilities on C / Q / E / X.\n- **Ultimate system**: ult points from kills, deaths, spike and ult orbs.\n- **Ziplines**.\n- **Lobby** with a server selector and matchmaking.\n- **3D models** for every weapon.\n- **Resource pack** served on the Minecraft port itself (Pterodactyl-friendly) and updated automatically; `/vc pack send | remove | info | reload`.\n- **Map import** from ommo.me (`/vc import`), for private servers only (CC BY-NC-ND 4.0 license).\n\n### Fixed\n- The screen no longer \"snaps back\" during sprays: recoil is entirely in the bullet trajectory.\n\n---\n\n## 2.0\n\n### Added\n- **Core game**:\n  - Valorant-style rounds with economy and buy phase;\n  - spike plant and defuse;\n  - walls during the buy phase, overtime.\n- **Weapons**:\n  - the full Valorant arsenal, with damage falloff, spray patterns and wall penetration;\n  - shields.\n- **Maps**: map setup commands (`/vc map ...`).\n- **Server and pack**:\n  - automatic resource pack hosting on the Minecraft port;\n  - Pterodactyl support.\n", "en/commands": "# Commands and Permissions\n\n\nThe main command is `/vc` (aliases `/valocraft`, `/valo`).\n\n## Player commands\n\n| Command | Description |\n|---|---|\n| `/vc join [map]` | Join a game (menu without argument) |\n| `/vc leave` | Leave the game |\n| `/vc list` | List games |\n| `/vc shop` | Buy-phase shop (or key F) |\n| `/vc lobby` | Back to the lobby |\n| `/vc boutique` | Collection shop (in the lobby) |\n| `/vc radianite` | Your Radianite balance |\n| `/vc pass` | Battle pass |\n| `/vc missions` | Daily missions |\n| `/vc resume` | Your last match summary |\n| `/vc rang [player]` | Ranked rank |\n| `/vc party invite\\|accept\\|deny\\|leave\\|kick\\|chat\\|list` | Party |\n| `/vc ff [non]` | Vote to surrender (from round 5) |\n| `/vc remake [non]` | Cancel the game if a teammate left early |\n| `/vc pack send` / `remove` | (Re)receive / remove the resource pack |\n| `!message` (in match) | Team chat |\n\n`/vc buyfor` is used internally by the **[Buy for …]** button of weapon requests.\n\n## Admin commands\n\n| Command | Description |\n|---|---|\n| `/vc setlobby` | Set the lobby at your position |\n| `/vc wand` | Selection wand (left click = pos1 / point A, right click = pos2 / point B) |\n| `/vc start <map>` | Force a game to start (2 players minimum) |\n| `/vc forcestart [map]` | Start **even with a single player** (no map: the game you're in). Doesn't count for ranked. |\n| `/vc stop <map>` | Force a game to stop |\n| `/vc ult add\\|set <player> [points]` | Ult points (`set` without a number = full ult) |\n| `/vc pass addxp <player> <xp>` | Give battle pass XP |\n| `/vc leaderboard set <type>` / `remove` / `list` | Lobby leaderboards ([Progression](page:progression)) |\n| `/vc give <weapon\\|knife\\|spike> [player]` | Give a weapon, the knife or the spike |\n| `/vc reload` | Reload `config.yml`, `weapons.yml` and `abilities.yml` |\n| `/vc pack send\\|remove <player\\|all>` | Send / remove the resource pack |\n| `/vc pack info` / `reload` | Pack mode and link / reload it |\n| `/vc radianite give\\|take\\|set <player> <amount>` | Manage a player's Radianite |\n| `/vc radianite voir <player>` | Check a player's balance |\n| `/vc import list` / `<name>` | Catalog / download a map ([Importing Maps](page:importing-maps)) |\n\n## Map commands (admin)\n\nSee [Map Setup](page:map-setup) for the walkthrough.\n\n| Command | Description |\n|---|---|\n| `/vc map create <id>` / `delete <id>` | Create / delete a map |\n| `/vc map list` / `info <id>` | List / see what's missing |\n| `/vc map setname <id> <name>` | Display name |\n| `/vc map setwaiting <id>` | Waiting room = your position |\n| `/vc map addspawn <id> <attack\\|defend>` | Add a spawn at your position |\n| `/vc map clearspawns <id> <attack\\|defend>` | Clear spawns |\n| `/vc map addsite <id> <A\\|B\\|C...>` / `removesite <id> <site>` | Spike site (selection) / remove it |\n| `/vc map addwall <id> [block]` / `removewall <id> <n>` / `walls <id>` | Pre-round walls |\n| `/vc map previewwalls <id>` | Show / hide walls |\n| `/vc map setplayers <id> <min> <max>` | Player limits |\n| `/vc map setmode <id> <mode>` | Default mode (`unrated`, `competitive`, `swiftplay`, `replication`, `spike_rush`, `deathmatch`, `team_deathmatch`, `escalation`) |\n| `/vc map setmusic <id> <sound\\|none>` | Map music |\n| `/vc map addorb <id>` / `clearorbs <id>` | Ult orbs |\n| `/vc map setminimap <id>` / `clearminimap <id>` | Tactical map area |\n| `/vc map addzipline <id>` / `ziplines <id>` / `removezipline <id> <n>` | Ziplines |\n| `/vc map enable\\|disable <id>` | Enable / disable |\n| `/vc map tp <id>` | Go to the map (loads its world if needed) |\n\n## Permissions\n\n| Permission | Default | Description |\n|---|---|---|\n| `valocraft.play` | Everyone | Play Valocraft |\n| `valocraft.admin` | Operators | Admin commands |\n| `valocraft.agents.all` | Nobody | Unlock every agent (already the case by default with `default-agents: [ALL]`) |\n| `valocraft.skins.all` | Nobody | Unlock every weapon skin |\n", "en/configuration": "# Configuration\n\n\nFiles live in `plugins/Valocraft/`. `/vc reload` reloads `config.yml`, `weapons.yml` and `abilities.yml`. New options are added to `config.yml` automatically on updates.\n\n## Files and folders\n\n| Path | Purpose |\n|---|---|\n| `config.yml` | General settings, modes, controls, progression, battle pass, resource pack, map library |\n| `weapons.yml` | Stats of every weapon (documented at the top of the file) |\n| `abilities.yml` | Price, charges, cooldowns and damage of every ability, ult costs |\n| `stats.yml` / `valocraft.db` | Player profiles (YAML by default, SQLite or MySQL) |\n| `leaderboards.yml` | Lobby leaderboard positions |\n| `resourcepack.zip` | Resource pack extracted from the jar |\n| `maps/<id>.yml` | One file per map |\n| `playerdata/` | Inventories saved during a match, given back after a crash |\n| `data/` | Temporary blocks to restore after a crash, minimaps, signed agent skins (`agent-skins.yml`) |\n\n## Main `config.yml` options\n\n| Key | Purpose |\n|---|---|\n| `game.countdown`, `game.rounds-to-win`, `game.loading-time` | Countdown, rounds to win, minimum loading screen duration |\n| `game.custom-tab`, `game.radar` | Custom scoreboard, off-hand radar |\n| `modes.<mode>.*` | Settings of each [mode](page:modes) (rounds, kills, time, Escalation weapons...) |\n| `maps.unload-check` | Seconds between two checks for map worlds to unload |\n| `controls.fire-button`, `controls.aim-mode` | Fire button (`LEFT` / `RIGHT`) and aiming (`HOLD` / `TOGGLE`) |\n| `controls.continuous-fire`, `controls.semi-auto-hold`, `controls.hide-swing` | Continuous fire ([Controls](page:controls)) |\n| `controls.instant-abilities` | `false` (default): manual ability activation; `true`: trigger on keypress |\n| `agents.select-time` | Agent select duration |\n| `agents.full-skin`, `agents.wear-heads` | Full agent skin / agent heads |\n| `agents.skins-restorer`, `agents.skins.<agent>` | Signed skins through SkinsRestorer / custom skin for an agent (image URL or username) |\n| `agents.tactical-map`, `agents.smokes-hide-players`, `agents.solid-smokes` | Tactical map, smokes that hide, 3D smokes |\n| `progression.*` | Radianite, prices, free agents (`default-agents: [ALL]`), `cosmetic-prices` |\n| `battlepass.*` | Season, levels, XP, rewards ([Progression](page:progression)) |\n| `leaderboards.refresh`, `leaderboards.size` | Lobby leaderboards |\n| `reconnect.*`, `surrender.*`, `remake.*`, `afk.*` | Reconnect, votes, inactivity |\n| `ranked.*`, `missions.*`, `party.*`, `chat.*`, `footsteps.*` | Ranked, missions, parties, chat, footsteps |\n| `storage.type` | `yaml`, `sqlite` or `mysql` (automatic import from `stats.yml`) |\n| `weapons.lag-compensation`, `weapons.practice-mode` | Lag compensation, [Practice Range](page:practice-range) |\n| `player.speed-bonus` | Walking speed bonus (sprinting is disabled) |\n| `resource-pack.*` | Pack hosting ([Resource Pack](page:resource-pack)) |\n| `map-library` | `/vc import` catalog |\n\n## `abilities.yml`\n\nCreated on first startup with the original values, completed automatically when new abilities appear.\n\n```yaml\nglobal:\n  damage-multiplier: 1.0      # damage of every ability\n  duration-multiplier: 1.0    # duration of smokes, fires, traps\nagents:\n  jett:\n    ult-cost: 8\n    cloudburst:\n      price: 200\n      max-charges: 2\n      free-charges: 0\n      cooldown: 0             # seconds to get a free charge back\n      kill-recharge: 0        # comes back after N kills\n      damage-multiplier: 1.0\n```\n\nEdit, then `/vc reload`: no recompiling needed.\n\n## `weapons.yml`\n\nEvery weapon stat: damage, fire rate, inaccuracy, recoil, penetration, zoom and more. See [Weapons](page:weapons).\n", "en/controls": "# Controls\n\n\n| Key | Action |\n|---|---|\n| **Left click** | Shoot; hold while aiming at a block within 64 blocks for continuous fire |\n| **Right click (hold)** | Aim / scope |\n| **Q** | Reload |\n| **Sneak + Q** | Drop the weapon (or the spike) |\n| **F** | Shop during the buy phase, otherwise pick up the weapon you look at |\n| **Sneak + F** | Spray on the wall you look at |\n| **1 / 2 / 3 / 4** | Primary / sidearm / knife / spike |\n| **5 / 6 / 7 / 8**, then **left click** | Take, then use ability **C / Q / E / X** |\n| **F** near a rope | Grab a [zipline](page:ziplines) |\n| **Hold right click** with the spike on a site | Plant (stand still) |\n| **Hold right click** on the spike (defender) | Defuse (stand still) |\n| **Tab** | Scoreboard |\n\n## Abilities\n\n- **Manual activation**: keys 5 to 8 take the ability in hand, **left click** uses it. Nothing fires just by switching slots. To trigger on keypress again (Tailwind, High Gear, Dismiss, instant ultimates...): `controls.instant-abilities: true`.\n- **Thrown abilities**: **hold** left click to see the trajectory (visible only to you), **release** to throw. **Right click**: underhand lob, or the variant when there is one (Curveball to the right, Sova's bolts without bounce, Healing Orb on yourself, quick FLASH/drive, healing M-Pulse).\n- **Sova's bolts**: the longer you hold, the further they go (\"Power\" gauge).\n- **Piloting** (Sova's drone, Skye's tiger, Tejo's drone): you see through the creature's eyes, WASD to move, left click = action, right click = back to your body.\n- **Tactical map**: WASD moves the cursor (sprint to go faster), left click places, right click or sneak cancels.\n- **Anchor abilities**: first click = place, second click = use.\n- **Neon**: sneak during High Gear = slide. **Viper**: clicking a placed emitter turns it on / off.\n- **Tour de Force** (Chamber): right click = scope, left click = shoot.\n- **Jett** glides while holding jump.\n\n## Continuous fire\n\nMinecraft normally sends **one signal per left click**. In a match, Valocraft uses the targeted block (up to **64 blocks**) to receive a signal every tick while the click is held: the weapon fires at its configured rate. No block is broken, no cracks are visible and the arm swing is hidden. A single click fires one bullet; semi-autos also fire continuously at their max rate.\n\nWhen aiming at the sky with no block within 64 blocks, you need to click. The knife always hits within 3 blocks. Settings: `controls.continuous-fire`, `controls.semi-auto-hold`, `controls.hide-swing` ([Configuration](page:configuration)).\n\n## HUD\n\n- **XP bar**: level = bullets in the magazine, bar = magazine / reload progress.\n- **Hearts** = HP (100 HP = 10 hearts), **golden hearts** = shield.\n- **Action bar**: HP, ammo, credits, ultimate and agent gauges.\n- **Off-hand**: radar.\n", "en/development": "# Development\n\n\n## Building from source\n\nRequirements: **Java 21** and **Maven**.\n\n```bash\nmvn package\n```\n\nThe jar is in `target/Valocraft-2.2.jar` (the `resourcepack/valocraft-pack.zip` pack is bundled inside).\n\n## Where to change what\n\n| What | Where |\n|---|---|\n| Ability prices, charges, cooldowns, damage, ult costs | `abilities.yml` (no recompiling) |\n| Ability behaviour | `agent/Kits.java`, `agent/NewKits.java`, engine in `agent/AbilityManager.java` |\n| Agent and ability list | `agent/Agent.java`, `agent/AbilityType.java` |\n| Weapon stats | `weapons.yml` (no recompiling) |\n| General settings | `config.yml` (no recompiling) |\n| Game modes | `game/Mode.java`, `game/Game.java` |\n| Cosmetics (kill banners, sounds, sprays) | `cosmetic/` |\n| Battle pass, progression | `stats/BattlePass.java`, `stats/Progression.java` |\n| Map world loading | `map/MapWorlds.java` |\n| Weapon models | `resourcepack/valocraft-models/`, `resourcepack/ModelGenerator.java` |\n| Generated resources (scope, flashes, smokes, skins, icons) | `resourcepack/PackGenerator22.java` |\n\n## Pack resources\n\n`PackGenerator22.java` generates Valocraft's textures and models into `resourcepack/valocraft-models/` (scope, flash overlays, smokes, scoreboard font, 108 weapon skins) and rebuilds the ability icon table from the images present. Then:\n\n```bash\ncd resourcepack\njava PackGenerator22.java valocraft-pack.zip valocraft-models\njar uf valocraft-pack.zip -C valocraft-models assets\n```\n\nThen rebuild the plugin. Valocraft weapon models open in **Blockbench** (Java Block/Item format).\n\n## Optional integrations\n\n- **SkinsRestorer**: called through reflection (`agent/SkinsRestorerHook.java`), no compile-time dependency. Declared as `softdepend`.\n\n## Contributing\n\n- Open an **issue** for bugs and balance feedback (agent, ability, situation).\n- Pull requests are welcome.\n", "en/gameplay": "# Gameplay\n\n\nValocraft follows Valorant's spike mode: attackers plant the spike, defenders stop them. Other rules exist depending on the [game mode](page:modes).\n\n## Match flow (Unrated / Competitive)\n\n1. **Waiting room in the lobby**, team choice, countdown.\n2. **Agent select (25 s)**, then a **loading screen** while the map loads ([Lobby](page:lobby)).\n3. **Buy phase**: open the shop with `F`. Pre-round walls keep teams in their spawn.\n4. **Round** (100 s): attackers plant, defenders hold or defuse.\n5. **Next round**. Sides swap after **12 rounds**. First to **13** wins.\n6. **Overtime**: start with 5000 credits, win by **2 rounds**.\n\n## Spike\n\n| Action | Duration |\n|---|---|\n| Plant | 4 s (hold right click with the spike on a site, stand still) |\n| Defuse | 7 s (hold right click on the spike, stand still). Half of the progress is kept. |\n| Detonation | 45 s after the plant |\n\nDrop the spike or a weapon: **Sneak + Q**.\n\n## Economy\n\nValorant-style economy (¤ credits): weapons, shield and ability charges are bought in the shop during the buy phase. Charges are in the bottom row; your agent's **signature (E)** is free every round.\n\n**Weapon requests**: in the shop, clicking a weapon you can't afford asks your team for it. A teammate who has the money clicks **[Buy for …]**: they pay and the weapon goes into your inventory (your old weapon is dropped on the ground).\n\n## Health and HUD\n\n- **Hearts** = HP (100 HP = 10 hearts). **Golden hearts** = shield.\n- **XP bar**: level = bullets in the magazine, bar = magazine / reload progress.\n- **Action bar**: HP, ammo, credits, ultimate progress (`X ●●●○○○`) and agent gauges (Neon's energy, Viper's fuel...).\n- **Radar**: a map in the off-hand shows allies, spotted enemies, the spike, the sites and your team's smokes (`game.radar`).\n\n## Scoreboard (Tab)\n\nPress **Tab** to see the map, round, phase, time, score and sides, with players aligned in columns. Allies: credits, weapon in hand, HP/shield, K/D/A and ultimate. Enemies: credits at the start of the buy phase, K/D/A and **ult points** (red when the ult is ready). Dead enemies' names are struck through. `game.custom-tab: false` turns this scoreboard off.\n\n## End of round and match\n\n- **First blood** and **ACE** announcements.\n- **Damage report** in chat on death and at the end of the round.\n- **Kill banner and kill sound** on each kill ([Progression and Cosmetics](page:progression)).\n- End of match: ranking, **Match summary** menu (`/vc resume`), Radianite, battle pass XP and RR in Competitive.\n\n## Reconnect, votes and AFK\n\n- **Reconnect**: a player who disconnects mid-match keeps their slot for 3 minutes and is put back in on return.\n- **Surrender**: `/vc ff`, from round 5, 80% yes.\n- **Remake**: `/vc remake`, until round 3, if a teammate left; everyone must vote yes.\n- **AFK**: warning after 45 s of inactivity, kicked at 90 s.\n\n## Movement and sound\n\n- **Sprinting is disabled**, like in Valorant; walking speed is boosted (`player.speed-bonus`).\n- Stopping or crouching before shooting makes shots accurate. Running or jumping makes them inaccurate.\n- **Footsteps**: running is heard by enemies (sound depends on the block); crouch-walking is silent.\n- [Ziplines](page:ziplines) can be used on maps that have them.\n\n## Pre-round walls\n\nWalls are placed during the buy phase and removed when the round starts. They only fill **empty** blocks and are restored exactly: the map is never damaged.\n\n## See also\n\n- [Game Modes](page:modes)\n- [Controls](page:controls)\n- [Agents](page:agents)\n- [Weapons](page:weapons)\n", "en/home": "<p align=\"center\">\n  <img src=\"https://cdn.modrinth.com/data/5AxXyQzL/39d04a022a5cfb4beb81c95012836130a1a9db6e.png\" alt=\"Valocraft logo\" width=\"260\">\n<\/p>\n\n<h1 align=\"center\">Valocraft Wiki<\/h1>\n\n<p align=\"center\">\n  <b>Valorant in Minecraft<\/b>: 29 agents, 8 game modes, ultimates, ranked, battle pass and on-demand map loading.<br>\n  Version <b>2.2<\/b> · Paper 1.21.4+ · Java 21\n<\/p>\n\n\n---\n\n**Valocraft** is a from-scratch Valorant recreation for Minecraft servers. Two teams of up to five play spike rounds with a Valorant-style economy, hitscan weapons, agent abilities and ultimates. There are also quick modes, deathmatch and Escalation.\n\n> ⚠️ Valocraft 2.x is a complete rewrite. Nothing from 1.x remains, and 1.x configs and maps are not compatible.\n\n## 🚀 Quick start\n\n1. [Install the plugin](page:installation) on a Paper 1.21.4+ server.\n2. Set the lobby with `/vc setlobby`.\n3. [Build a map](page:map-setup) or [import one](page:importing-maps).\n4. Join from the lobby ([Lobby and Matchmaking](page:lobby)) and play.\n\n## 📖 Where to find what\n\n| I want to... | Go to |\n|---|---|\n| Install or update the plugin | [Installation](page:installation) |\n| Join, host, see stats and leaderboards | [Lobby and Matchmaking](page:lobby) |\n| Understand a match (rounds, economy, spike) | [Gameplay](page:gameplay) |\n| Learn the modes (Swiftplay, Escalation...) | [Game Modes](page:modes) |\n| Learn the keys | [Controls](page:controls) |\n| See every agent and ability | [Agents](page:agents) |\n| Understand ult points and orbs | [Ultimate System](page:ultimate) |\n| Learn the weapons | [Weapons](page:weapons) |\n| Battle pass, skins, sprays, banners, ranked | [Progression and Cosmetics](page:progression) |\n| Build my own map | [Map Setup](page:map-setup) |\n| Download a ready-made map | [Importing Maps](page:importing-maps) |\n| Add ziplines | [Ziplines](page:ziplines) |\n| Fix a resource pack problem | [Resource Pack](page:resource-pack) |\n| Find a command | [Commands and Permissions](page:commands) |\n| Configure the plugin | [Configuration](page:configuration) |\n| Test weapons outside a match | [Practice Range](page:practice-range) |\n| Solve a problem | [Troubleshooting](page:troubleshooting) |\n| Build or contribute | [Development](page:development) |\n| Read the release notes | [Changelog](page:changelog) |\n\n## ✨ Highlights\n\n- 🎭 **29 agents** (Duelists, Initiators, Controllers, Sentinels), with their **full skin** in match\n- 🎮 **8 modes**: Unrated, Competitive, Swiftplay, Replication, Spike Rush, Deathmatch, Team Deathmatch, Escalation\n- ⚡ **Faithful abilities**: white flashes, throw trajectories, Neon and Viper gauges, destructible utility, first-person drone piloting\n- 🥇 **Ranked** with ranks and RR, a 30-level **battle pass**, daily missions\n- 🎨 **Cosmetics**: weapon skins, knives, cards (banners), titles, kill banners and kill sounds, sprays\n- 🏆 **Hologram leaderboards** in the lobby\n- 🌍 **On-demand map loading**, with a loading screen showing every player's card and title\n- 🔫 **Hitscan weapons** with continuous fire, recoil, penetration, lag compensation and 3D models\n- 🗺️ **In-game map editor** and import of Ommo's Valorant maps\n- 📦 **Self-hosted resource pack** served on the Minecraft port (Pterodactyl-friendly)\n\n## 🔗 Links\n\n- Download: [Valocraft on Modrinth](https://modrinth.com/plugin/valocraft_stimoi)\n- Report a bug or give balance feedback: open an issue on this repository\n", "en/importing-maps": "# Importing Maps\n\n\nValocraft can download maps from [Ommo's VALORANT x Minecraft](https://ommo.me/valorant-x-minecraft) project directly in game.\n\n## Commands\n\n```\n/vc import list          catalog + required Minecraft version\n/vc import ascent        downloads, installs the vc_ascent world and creates the Valocraft map \"ascent\"\n```\n\n## What the import does\n\n- Downloads the map and installs it as the `vc_<name>` world.\n- Creates a Valocraft map with the same id.\n- The world is then **loaded on demand**: when a match launches on that map, or with `/vc map tp <name>` to set it up. It's unloaded once nobody uses it ([Map Setup](page:map-setup)).\n\n## What's left to do\n\nThe import does **not** place gameplay points. You still need:\n\n- The waiting room\n- Spawns (attack / defend)\n- Spike sites\n- Pre-round walls\n\nGo to the map with `/vc map tp ascent`, follow [Map Setup](page:map-setup), then enable it:\n\n```\n/vc map enable ascent\n```\n\n## Version limits\n\nA map saved in a **newer Minecraft version than the server** is refused. **Lotus, Sunset and Breeze** require **Minecraft 1.21.11**.\n\n## Editing the catalog\n\nThe catalog is the `map-library` section of `config.yml`.\n\n## ⚖️ License\n\nOmmo's maps are licensed **CC BY-NC-ND 4.0**.\n\n- Allowed on a **private server between friends**.\n- A **public** server needs a **commercial license** (contact@ommo.me).\n- **Do not republish** the maps.\n", "en/installation": "# Installation\n\n\n## Requirements\n\n| | |\n|---|---|\n| **Server** | Paper 1.21.4 or newer |\n| **Java** | 21 |\n| **Dependencies** | None required |\n| **Optional** | [SkinsRestorer](https://github.com/SkinsRestorer/SkinsRestorer): signed agent skins, also visible to the player themselves |\n| **Resource pack** | Bundled in the jar, sent automatically |\n\n## Fresh install\n\n1. Put `Valocraft-2.2.jar` in the server's `plugins/` folder (plus SkinsRestorer if you want it).\n2. Start the server. The resource pack is extracted to `plugins/Valocraft/resourcepack.zip`, and `abilities.yml` is created.\n3. Stand where you want the lobby and run `/vc setlobby`.\n4. [Build a map](page:map-setup) or [import one](page:importing-maps), then `/vc map enable <id>`.\n5. Optional: place [leaderboards](page:progression) in the lobby with `/vc leaderboard set <type>`.\n\n## Updating\n\n- From any **2.x**: replace the old jar with `Valocraft-2.2.jar` in `plugins/`. Players get the updated pack automatically. New options are added to `config.yml` on startup.\n- From **1.x**: 2.x is a complete rewrite that shares nothing with 1.x. Remove the old plugin and its data, and start fresh.\n\n## Map worlds\n\nMap worlds (`vc_<map>`) are **no longer loaded at server startup**. They stay on disk, are loaded when a match launches, then unloaded once nobody uses them. A map built in the main world (`world`) stays loaded all the time. See [Map Setup](page:map-setup).\n\n## Resource pack\n\nNothing to configure by default. The pack (HrdaValorant plus Valocraft models) is served **on the Minecraft port itself** and sent to each player on join. The link reuses the address and port the player connected with: no extra port to open, and it also works on Pterodactyl.\n\nSee [Resource Pack](page:resource-pack) for alternatives and troubleshooting.\n\n## SkinsRestorer (optional)\n\nWith SkinsRestorer, agent skins are signed through MineSkin on startup (in the background, one every 3 s), then cached in `plugins/Valocraft/data/agent-skins.yml`. The server needs Internet access on the first startup. Without SkinsRestorer, other players still see the agent skin; only the player themselves keeps their own skin in F5 view.\n\n## Next steps\n\n- [Lobby and Matchmaking](page:lobby)\n- [Map Setup](page:map-setup)\n- [Commands and Permissions](page:commands)\n", "en/lobby": "# Lobby and Matchmaking\n\n\nThe lobby spawn is set with `/vc setlobby` (admin). Players go back to it with `/vc lobby`.\n\n## Lobby items\n\n| Item | Purpose |\n|---|---|\n| ⭐ **Join a match** (nether star) | Joins the fullest waiting game. **Sneak + right click**: list of all games. |\n| 📖 **Statistics** (book) | Your stats (K/D, headshot %, wins, MVPs, favorite agent, rank) and the leaderboards. |\n| 🔨 **Create a game** (anvil) | Pick a free map and a [mode](page:modes), and become the **host**. |\n| 💎 **Shop** (emerald) | Weapon skins, knives, cards, titles, kill banners and sounds, sprays, battle pass, missions. Also `/vc boutique`. See [Progression and Cosmetics](page:progression). |\n\n## Hosting a game\n\n1. Use the **anvil** (Create a game), pick a free map, then the mode.\n2. You become the host. Others join with the star or `/vc join <map>`.\n3. The host gets a **green item** that starts the game from **2 players** (an admin can start alone with `/vc forcestart`).\n\n## Joining by command\n\n| Command | Effect |\n|---|---|\n| `/vc join` | Opens the game list |\n| `/vc join <map>` | Joins a specific map |\n| `/vc list` | Lists games |\n| `/vc leave` | Leaves the game |\n\n## Before the match\n\n1. **Waiting room in the lobby**: players stay in the lobby with the game items (team, mode for the host, start, leave). The map world isn't loaded yet.\n2. **Countdown**, then **agent select** (25 s) in a menu, still in the lobby. See [Agents](page:agents).\n3. **Loading screen**: while the server loads the map world, a menu shows every player's **card (banner)**, **agent** and **title**, red team at the top and blue at the bottom. The boss bar shows progress.\n4. Everyone is moved onto the map and the first round starts.\n\nWhen the match ends, players go back to the lobby and the map world is unloaded.\n\n## Parties\n\n| Command | Effect |\n|---|---|\n| `/vc party invite <player>` | Invite (the player gets [Accept] / [Decline] buttons) |\n| `/vc party leave` / `kick <player>` / `list` | Leave / kick / see the party |\n| `/vc party chat <message>` | Talk to the party |\n\nWhen the leader joins a game, the whole party follows if there's room, and plays on the same team. Teams are balanced on a hidden MMR.\n\n## Lobby leaderboards\n\nLeaderboard holograms (rank, kills, wins, ACS, headshots, aces, battle pass) can be placed in the lobby by an admin. See [Progression and Cosmetics](page:progression).\n\n## Statistics\n\nTracked per player: kills / deaths, assists, headshots, wins, MVPs, first bloods, aces, damage, combat score, favorite agent, rank. Stored in `stats.yml`, SQLite or MySQL ([Configuration](page:configuration)). `/vc resume` reopens your last match summary and `/vc rang [player]` shows a rank.\n", "en/map-setup": "# Map Setup\n\n\nMaps are configured **in game** with `/vc map ...` and the selection wand. This page builds a map called `ascent` from scratch. To skip building, see [Importing Maps](page:importing-maps).\n\n## What a playable map needs\n\n- A **waiting room** (used at the end of a match and on reconnect)\n- **Attack** and **defend** spawns (usually 5 each)\n- At least one **spike site** (A, B, C...)\n- **Pre-round walls**\n- Player limits\n- Being **enabled**\n\n`/vc map info <id>` lists exactly what's missing.\n\n## Full walkthrough\n\n```\n/vc map create ascent\n/vc map setname ascent Ascent\n/vc map setwaiting ascent            (waiting room = your position)\n/vc map addspawn ascent attack       (repeat for each player, usually 5)\n/vc map addspawn ascent defend\n/vc wand                             (left click = pos1, right click = pos2)\n/vc map addsite ascent A             (selection = plant zone of site A)\n/vc map addsite ascent B\n/vc map addwall ascent               (selection = pre-round wall, green glass by default)\n/vc map addwall ascent light_blue_stained_glass\n/vc map previewwalls ascent          (show / hide walls to check them)\n/vc map setplayers ascent 2 10\n/vc map setmode ascent unrated       (default mode, optional)\n/vc map setmusic ascent hrdavalorant.maps.ascent\n/vc map addorb ascent                (ult orbs, optional)\n/vc map addzipline ascent            (ziplines, optional)\n/vc map enable ascent\n```\n\n## Step by step\n\n### 1. Create and name\n\n`/vc map create <id>` then `/vc map setname <id> <display name>`.\n\n### 2. Waiting room and spawns\n\nStand where you want it and run `/vc map setwaiting <id>`. Repeat `/vc map addspawn <id> attack` and `/vc map addspawn <id> defend` at each spawn position. `/vc map clearspawns <id> <attack|defend>` clears a list.\n\n### 3. Spike sites\n\n1. `/vc wand`\n2. **Left click** = pos1, **right click** = pos2.\n3. `/vc map addsite <id> A` (and `B`, `C`...). The selection becomes the plant zone. `/vc map removesite <id> <site>` removes one.\n\n### 4. Pre-round walls\n\nSelect the area with the wand, then `/vc map addwall <id> [block]`. The default block is **green glass**.\n\n- Walls only fill **empty** blocks and are removed exactly when the round starts: the map is **never damaged**.\n- `/vc map previewwalls <id>` shows or hides a preview; `/vc map walls <id>` lists them, `/vc map removewall <id> <n>` removes one.\n\n### 5. Players, mode and music\n\n`/vc map setplayers <id> <min> <max>`, `/vc map setmode <id> <mode>` ([Game Modes](page:modes)), `/vc map setmusic <id> <sound|none>`.\n\n### 6. Options\n\n- [Ult orbs](page:ultimate): `/vc map addorb <id>` / `/vc map clearorbs <id>`\n- [Ziplines](page:ziplines)\n- Tactical map and radar area: computed from spawns, sites, walls and orbs. To set it manually, select the area with the wand and run `/vc map setminimap <id>`; `/vc map clearminimap <id>` goes back to automatic.\n\n### 7. Enable\n\n`/vc map enable <id>` (and `disable` to take it out of rotation).\n\n## Map world: loaded on demand\n\n- A map built in its **own world** (for example `vc_ascent`, created by [importing](page:importing-maps)) is **not loaded at server startup**. The world is loaded **when a match launches**, during the loading screen, then **saved and unloaded** once nobody uses it (checked every 30 s, `maps.unload-check`).\n- `/vc map tp <id>` and `/vc map previewwalls <id>` load the world on demand to set the map up. It's unloaded once you leave.\n- A map built in the **main world** (`world`) works too, but that world always stays loaded.\n\n## Crash protection\n\nPlaced blocks (walls, spike, abilities) are **saved to disk** in `plugins/Valocraft/data/` and **restored the next time the world loads** if the server crashes.\n\n## See also\n\n- [Commands and Permissions](page:commands)\n- [Importing Maps](page:importing-maps)\n", "en/modes": "# Game Modes\n\n\nThe host picks the mode when creating the game (\"Create a game\" menu) or in the waiting room. An admin sets a map's default mode with `/vc map setmode <map> <mode>`. Each mode's settings live in the `modes` section of `config.yml`.\n\n## The 8 modes\n\n| Mode | Key | Rules |\n|---|---|---|\n| **Unrated** | `unrated` | First to 13 rounds, side swap after 12, economy, spike, overtime. |\n| **Competitive** | `competitive` | Like Unrated, with rank and RR. Leaving costs RR. |\n| **Swiftplay** | `swiftplay` | First to **5 rounds**, side swap after 4, economy and spike, no overtime. |\n| **Replication** | `replication` | During agent select, everyone votes for an agent (duplicates allowed); **the whole team plays the most-picked agent**. First to 5 rounds. |\n| **Spike Rush** | `spike_rush` | First to 4 rounds (swap after 3). Same random weapon for everyone, shield, full abilities, +1 ult point per round, every attacker carries a spike. |\n| **Deathmatch** | `deathmatch` | Free-for-all, no agents. 1.5 s respawn, free weapons for 10 s after respawning, a kill heals you. 40 kills or 6 minutes. |\n| **Team Deathmatch** | `team_deathmatch` | Two teams with agents, 2 s respawn, free weapons, ult orbs. 100 kills or 9:30. |\n| **Escalation** | `escalation` | Two teams, respawns, no abilities: each level forces a weapon (see below). |\n\n## Escalation\n\n- Default weapon order: Odin, Ares, Phantom, Vandal, Spectre, Judge, Bulldog, Guardian, Sheriff, Marshal, Operator, then the **knife**.\n- A team needs **3 kills** to reach the next level (`kills-per-level`); on the last level, **a single knife kill** is enough.\n- The whole team switches weapon at once. No shop.\n- The first team to finish the last level wins; otherwise, after 10 minutes, the furthest team wins.\n- The boss bar and the sidebar show each team's level.\n\n```yaml\nmodes:\n  escalation:\n    time-limit: 600\n    kills-per-level: 3\n    levels: [odin, ares, phantom, vandal, spectre, judge, bulldog, guardian, sheriff, marshal, operator, knife]\n```\n\n## Respawn modes\n\nDeathmatch, Team Deathmatch and Escalation: 2 s of spawn protection (unless you shoot), spawn point picked as far as possible from enemies. A spray is available every 30 s.\n\n## Competitive\n\n- Ranks: Iron, Bronze, Silver, Gold, Platinum, Diamond, Ascendant and Immortal (3 divisions each), then Radiant.\n- **5 placement games**, then RR based on the result (+20 / -16), performance (combat score) and the team level gap. Leaving costs -30 RR.\n- A game started with `/vc forcestart` doesn't count for ranked.\n\nSee also [Progression and Cosmetics](page:progression).\n", "en/practice-range": "# Practice Range\n\n\nOutside a match, a weapon obtained with `/vc give` can be fired at **mobs and armor stands**. It never shoots players.\n\nEach hit displays:\n\n- The **zone** hit\n- The **damage** dealt\n- The **distance**\n\nThis is the easiest way to tune `weapons.yml` before opening a match.\n\n## Usage\n\n```\n/vc give <weapon> [player]\n```\n\nShoot at mobs or armor stands, adjust `weapons.yml`, then `/vc reload`.\n\n## Disabling\n\nSet `weapons.practice-mode` to disable it in `config.yml`. See [Configuration](page:configuration).\n\nRelated: [Weapons](page:weapons).\n", "en/progression": "# Progression and Cosmetics\n\n\nEverything happens in the **lobby shop** (emerald, or `/vc boutique`). The currency is **Radianite (◆)**. Purchases take two clicks (the first one asks for confirmation).\n\n## Radianite\n\nEarned at the end of every match (`progression.rewards`):\n\n| Source | Gain |\n|---|---|\n| Win | 150 ◆ |\n| Loss | 60 ◆ |\n| Kill | +5 ◆ |\n| Assist | +2 ◆ |\n| Round won | +5 ◆ |\n| MVP | +50 ◆ |\n\nPlus **daily missions** (3 per day, 150 ◆ each, `/vc missions`) and the **battle pass**. Admin: `/vc radianite give|take|set <player> <amount>`, `/vc radianite voir <player>`.\n\n## Battle pass\n\n- **30 levels of 1,000 XP** (`battlepass.levels`, `battlepass.xp-per-level`).\n- XP every match: win 600, loss 300, draw 400, +20 per kill, +10 per assist, +30 per round won, +150 for MVP (`battlepass.xp`).\n- **One reward per level**, given automatically: Radianite, cards, titles, kill banners and kill sounds, sprays.\n- Menu: `/vc pass` or the **Battle pass** button in the shop.\n- **New season**: changing `battlepass.season` resets everyone to level 0. Unlocked rewards are kept.\n- A level's reward can be changed: `battlepass.rewards.<level>: \"spray:gg\"` (types `radianite`, `card`, `title`, `killbanner`, `killsound`, `spray`).\n- Admin: `/vc pass addxp <player> <xp>`.\n\n## What you can buy\n\n| Category | Content |\n|---|---|\n| **Agents** | All free by default. To charge for them: `progression.default-agents` (e.g. `[JETT, PHOENIX, SOVA, BRIMSTONE, SAGE]`), `agent-price`. |\n| **Weapon skins** | 6 collections × 18 weapons (1,000 to 2,000 ◆), equipped per weapon |\n| **Knives** | 14 knives from the pack (600 to 2,500 ◆) |\n| **Player cards** | One **banner** per agent (agent color, role symbol), 400 ◆ |\n| **Titles** | 12 titles (200 to 3,000 ◆) |\n| **Kill banners** | 8 styles: ❱ (free), ✦ ❤ ☠ ⚡ ✪ ⚔ ♛ |\n| **Kill sounds** | 7 sounds (in-game names): Valorant (free), Carillon, Cloche, Xylophone, Pièces, Rétro 8-bit, Améthyste. Right click to preview. |\n| **Sprays** | Text (GG free, EZ, NICE, ☠, ❤, ?, ACE, VALOCRAFT) and the emblems of all 29 agents |\n\nPrices of banners, sounds and sprays: `progression.cosmetic-prices` (e.g. `killbanner: {couronne: 1000}`).\n\n## Where they show\n\n- **Card and title**: loading screen, match summary, chat (title before the name), statistics, and for your victim when you kill them.\n- **Kill banner**: on each kill, your symbol is shown once per kill this round, in your card's color.\n- **Kill sound**: the pitch rises with each kill of the round, special sound on the 5th.\n- **Spray**: **sneak + F** in a match sticks your spray on the wall, floor or ceiling you look at (6 blocks). One per round, every 30 s in respawn modes; sprays disappear at the next round.\n\n## Ranked\n\nCompetitive mode: ranks from Iron to Radiant, 5 placement games, RR based on result, performance and level gap. See [Game Modes](page:modes). The rank shows in chat, the waiting room, the loading screen, statistics and with `/vc rang`.\n\n## Lobby leaderboards\n\nHolograms refreshed every minute, placed by an admin:\n\n```\n/vc leaderboard set <type>     where you stand\n/vc leaderboard remove         removes the nearest one (5 blocks)\n/vc leaderboard list\n```\n\nTypes: `rank`, `kills`, `wins`, `acs` (from 20 rounds), `headshots`, `aces`, `battlepass`. Settings: `leaderboards.refresh`, `leaderboards.size`. Positions are stored in `plugins/Valocraft/leaderboards.yml`.\n", "en/resource-pack": "# Resource Pack\n\n\nValocraft uses the **HrdaValorant** resource pack (fixed Classic sound) plus Valocraft's own models and textures (weapons, skins, smokes, scope, white flashes). It's **bundled in the plugin jar**.\n\n## Default behaviour\n\n1. On startup, the pack is extracted to `plugins/Valocraft/resourcepack.zip` (and replaced automatically when the plugin is updated).\n2. It's **served on the Minecraft port itself** and sent to each player on join.\n3. The download link reuses **the address and port the player connected with**.\n\nNo extra port to open, and it works on **Pterodactyl**.\n\nA player who declines the pack gets a message: without it, weapons, ability icons and scopes are invisible.\n\n## Player commands\n\n| Command | Effect |\n|---|---|\n| `/vc pack send` | (Re)receive the pack |\n| `/vc pack remove` | Remove the pack |\n\n## Admin commands\n\n| Command | Effect |\n|---|---|\n| `/vc pack send <player\\|all>` | Send the pack to a player or everyone |\n| `/vc pack remove <player\\|all>` | Remove the pack for a player or everyone |\n| `/vc pack info` | Shows the mode and link |\n| `/vc pack reload` | Reloads the pack after a change |\n\n## Alternatives\n\nSet in `config.yml`:\n\n| Goal | Setting |\n|---|---|\n| Use a **dedicated HTTP port** | `resource-pack.self-host.http-port: 8164` |\n| Use an **external URL** | `self-host.enabled: false`, then `resource-pack.url` and `sha1` |\n\n## Reading the console\n\nFor each player, the console shows the **offered link** and the **client's answer**, for example: `ACCEPTED`, `DECLINED`, `FAILED_DOWNLOAD`, `SUCCESSFULLY_LOADED`.\n\nSee [Troubleshooting](page:troubleshooting) if the pack doesn't load, and [Development](page:development) to regenerate the resources.\n", "en/troubleshooting": "# Troubleshooting\n\n\n## The resource pack doesn't load\n\n1. Check the **server console**: it shows the link offered to each player and the client's answer (`ACCEPTED`, `DECLINED`, `FAILED_DOWNLOAD`, `SUCCESSFULLY_LOADED`...).\n2. Ask the player to run `/vc pack send` again.\n3. Admins: `/vc pack info` shows the mode and link, `/vc pack reload` reloads it.\n4. If hosting on the Minecraft port doesn't work for you, use a dedicated port (`resource-pack.self-host.http-port: 8164`) or an external URL. See [Resource Pack](page:resource-pack).\n\n## An ability icon shows the wrong agent\n\nUpdate the plugin: the fixed pack (Cove, Trademark / Rendezvous, FRAG/ment / FLASH/drive icons) is sent automatically. If the old pack is still cached, run `/vc pack send`.\n\n## My map doesn't start / isn't playable\n\nRun `/vc map info <id>`: it lists what's missing (waiting room, spawns, sites, walls, player limits, enabled). See [Map Setup](page:map-setup).\n\n## \"Map world not found\"\n\nThe world folder (`vc_<map>`) no longer exists next to the server, or the world name saved in `maps/<id>.yml` (`world` key) is wrong. Worlds are no longer loaded at startup: it's normal not to see them in `/mv list` or similar until a match launches.\n\n## I can't see my own agent skin in F5\n\nMinecraft only accepts skins signed by Mojang for yourself. Other players do see your agent skin. Install **SkinsRestorer**: skins are then signed through MineSkin and visible to everyone ([Installation](page:installation)). The server needs Internet access on the first startup.\n\n## A game started alone ends immediately\n\nUse `/vc forcestart` (not `/vc start`): an empty team is then never considered eliminated.\n\n## My ability doesn't fire when I press the key\n\nThat's expected: the key takes the ability in hand, **left click** uses it. For the old behaviour: `controls.instant-abilities: true` ([Controls](page:controls)).\n\n## An imported map is refused\n\nThe map was saved in a **newer Minecraft version** than the server. Lotus, Sunset and Breeze need **Minecraft 1.21.11**. See [Importing Maps](page:importing-maps).\n\n## Fire doesn't continue when I hold left click\n\nContinuous fire needs you to aim at a block within **64 blocks**. When aiming at the sky, click instead. Check `controls.continuous-fire` and `controls.semi-auto-hold` ([Controls](page:controls)).\n\n## I can't shoot or use abilities\n\nYou may be **detained**, **suppressed** or **jammed** (Lockdown, Thrash, ZERO/point, Steel Garden...), or piloting a drone. See the status table on [Agents](page:agents).\n\n## A player was removed from the game\n\nThe AFK check removes a player who doesn't move for 90 s (`afk.kick-after`). A disconnected player has 3 minutes to come back (`reconnect.timeout`).\n\n## Players lost their items after a crash\n\nInventories saved during a match are in `plugins/Valocraft/playerdata/` and **given back on reconnect**. Temporary blocks (walls, spike, abilities) are restored the next time the map world loads.\n\n## I updated and something is off\n\n- Keep only `Valocraft-2.2.jar` in `plugins/`. See [Installation](page:installation).\n- Valocraft **1.x** isn't compatible with 2.x.\n\n## Still stuck?\n\nOpen an issue on this repository with the server version, the Valocraft version and the relevant part of the console.\n", "en/ultimate": "# Ultimate System\n\n\nEvery agent has an ultimate on key **8** (X). It costs a number of **ult points** (6 to 9 depending on the agent, listed on the [Agents](page:agents) page and editable in `abilities.yml`).\n\n## Earning points\n\n- **Kills**\n- **Deaths**\n- **Planting** and **defusing** the spike\n- **Ult orbs** (see below)\n- In Spike Rush: +1 point per round\n\nPoints are **kept at half-time**.\n\n## Visual and audio feedback\n\n| Moment | What happens |\n|---|---|\n| Progress | Always shown in the action bar (`X ●●●○○○`). Key **8** shows the ultimate with its points. |\n| **Ult ready** | On-screen title, sound, and a message to your team. **Enemies** get a chat alert. |\n| **Ult used** | Everyone hears the agent's voice line and chat announces it. |\n| Scoreboard | Ult points of allies **and enemies** are visible (red when an enemy ult is ready). |\n\n## Using the ultimate\n\nKey **8** to take it in hand, **left click** to activate it ([manual activation](page:controls)).\n\nSome ultimates turn key 8 into a weapon while active: Blade Storm, Hunter's Fury, Showstopper, Overdrive, Tour de Force (with a right-click scope). **Blade Storm**, **Overdrive** and **Empress** are extended or refilled by kills. **Not Dead Yet** (Clove) triggers by itself on death.\n\n## Ult orbs\n\nOrbs are a map element placed by admins.\n\n- **Place**: `/vc map addorb <map>` where you stand.\n- **Remove all**: `/vc map clearorbs <map>`.\n- **Respawn**: orbs come back **every round** (and in Team Deathmatch).\n- **Collect**: **hold right click for 1.5 s** next to an orb to gain **+1 ult point**.\n\n## Admin commands\n\n| Command | Effect |\n|---|---|\n| `/vc ult add <player> [points]` | Adds points (1 by default) |\n| `/vc ult set <player> [points]` | Sets points; without a number, the ult is full (with the \"ult ready\" alerts) |\n\nSee [Map Setup](page:map-setup) to place orbs.\n", "en/weapons": "# Weapons\n\n\nEvery weapon has a 3D model.\n\n## Arsenal\n\n| Category | Weapons |\n|---|---|\n| Melee | Knife |\n| Sidearms | Classic, Ghost, Sheriff, Shorty, Frenzy |\n| SMGs | Stinger, Spectre |\n| Shotguns | Bucky, Judge |\n| Rifles | Bulldog, Guardian, Phantom, Vandal |\n| Snipers | Marshal, Operator, Outlaw |\n| Heavy | Ares, Odin |\n\nWeapons and charges are bought in the shop during the buy phase (`F`, or `/vc shop`). A weapon you can't afford can be **requested from a teammate** ([Gameplay](page:gameplay)).\n\n## Mechanics\n\n| Mechanic | How it works |\n|---|---|\n| **Shooting** | Hitscan, with **lag compensation** (up to 200 ms) |\n| **Accuracy** | Inaccuracy grows while moving or in the air and changes when crouching. Stopping (or crouching) before shooting makes shots accurate. |\n| **Recoil** | Climb then side sway, entirely built into bullet trajectory (your view doesn't move). |\n| **Damage** | Head / body / legs, with range falloff steps |\n| **Penetration** | Bullets go through walls; they destroy **enemy utility** they hit (turret, camera, traps...) |\n| **Reload** | Key **Q**. Progress shown on the XP bar. |\n| **Aim / scope** | Hold right click. Scopes on Operator, Marshal and Outlaw. No scoping while flashed. |\n| **Shotguns** | Short range (Bucky, Judge) |\n| **Knife** | **x3 damage** from behind |\n\n## Hold to fire\n\nHolding left click while aiming at a block within 64 blocks fires the weapon at its real fire rate. No block is damaged and the arm swing is hidden. Semi-autos fire at their max rate while held. See [Controls](page:controls).\n\n## Scopes\n\nThe Operator, Marshal, Outlaw and Chamber's ultimate (Tour de Force) use a full-screen 16:9 scope: sharp round lens, black around it, thin crosshair and red dot. It's carried by the helmet and doesn't flicker.\n\n## Skins\n\nThe lobby shop offers six collections for the 18 weapons: Prime, Reaver, Glitchpop, Ion, Elderflame and Oni, plus 14 knives. Skins are bought and equipped per weapon; a picked-up weapon keeps its owner's skin. See [Progression and Cosmetics](page:progression).\n\n## Models\n\n- **HrdaValorant pack**: Classic, Ghost, Sheriff, Spectre, Vandal, Ares, Operator, knives, shields.\n- **Valocraft models**, made for the project: Shorty, Frenzy, Stinger, Bucky, Judge, Bulldog, Guardian, Phantom, Marshal, Outlaw, Odin (`item_model` component).\n\n## Tuning\n\nAll stats (damage, fire rate, inaccuracy, recoil, penetration, zoom...) are in `weapons.yml`, documented at the top of the file. Reload with `/vc reload`. To test, use the [Practice Range](page:practice-range).\n", "en/ziplines": "# Ziplines\n\n\nZiplines are a map feature: a rope between two points that players can ride. They can be **horizontal, ascending or descending**.\n\n## Riding a zipline (players)\n\n| Action | Key |\n|---|---|\n| Hook on | **F**, near the rope |\n| Slide | **Forward / backward**, in either direction depending on where you look |\n| Let go | **Jump** or **sneak** |\n\n- At the end of the rope, the player is dropped on the platform.\n- You **can shoot** while riding.\n\n## Creating a zipline (admins)\n\n1. Get the wand: `/vc wand`.\n2. **Left click** a block for point **A**, **right click** a block for point **B**. The points are the **centers of the clicked blocks**.\n3. Run:\n\n```\n/vc map addzipline <map>\n```\n\n### Managing ziplines\n\n```\n/vc map ziplines <map>               list the ziplines\n/vc map removezipline <map> <n>      remove zipline number n\n```\n\n## Technical notes\n\nEach zipline is a **single display entity**, and movement is **interpolated client side**. It is smooth and cheap on the server.\n\nSee also [Map Setup](page:map-setup).\n", "fr/agents": "# Agents\n\n\nValocraft compte **29 agents** répartis en quatre rôles. Tous sont débloqués par défaut (`progression.default-agents: [ALL]`).\n\n## Sélection d'agent\n\nAprès le compte à rebours, la **sélection d'agent** (25 s) s'ouvre **au lobby**, dans un menu :\n\n- Chaque agent est **unique dans une équipe**, sauf en mode [Replication](page:modes) où toute l'équipe joue l'agent le plus choisi.\n- Un joueur qui ne choisit pas reçoit un **agent libre au hasard**.\n- La **réplique** de l'agent est jouée à toute l'équipe au verrouillage.\n- Pendant la partie, le joueur prend le **skin complet** de son agent (voir plus bas).\n\n**Lire les tableaux :** les prix sont en ¤ ; *max* = nombre de charges maximum ; *offert* = donné à chaque round ; *recharge* = temps pour regagner la charge offerte. Le coût des ultimes est en **points** ([Système d'ultime](page:ultimate)). Touches **5 / 6 / 7 / 8** = **C / Q / E / X**, puis **clic gauche** pour utiliser ([Contrôles](page:controls)). Les charges s'achètent sur la ligne du bas de la boutique. Tout est modifiable dans `abilities.yml` ([Configuration](page:configuration)).\n\n## Duellistes\n\n| Agent | C | Q | E (signature) | X (ultime) |\n|---|---|---|---|---|\n| **Jett** | **Cloudburst** : lance une fumée qui bloque la vue (200 ¤, max 2) | **Updraft** : propulse Jett dans les airs (150 ¤, max 2) | **Tailwind** : utilise pour préparer le vent (7,5 s), réutilise pour dasher. Revient après 2 éliminations (offert) | **Blade Storm** : 5 couteaux précis. Une élimination les recharge — **8 pts** |\n| **Phoenix** | **Blaze** : mur de flammes qui bloque la vue et soigne Phoenix (200 ¤) | **Curveball** : flash courbée : clic gauche vers la gauche, clic droit vers la droite (250 ¤, max 2) | **Hot Hands** : boule de feu : zone qui brûle les ennemis et soigne Phoenix (offert) | **Run it Back** : pendant 10 s, si Phoenix meurt il renaît au point de départ — **6 pts** |\n| **Raze** | **Boom Bot** : robot qui fonce vers l'ennemi le plus proche et explose (300 ¤) | **Blast Pack** : charge qui projette tout le monde autour (Raze compris) (200 ¤, max 2) | **Paint Shells** : grenade à fragmentation. Revient après 2 éliminations (offert) | **Showstopper** : lance-roquettes : une roquette dévastatrice — **8 pts** |\n| **Reyna** | **Leer** : œil qui aveugle les ennemis qui le regardent (250 ¤, max 2) | **Devour** : après une élimination (3 s) : récupère 100 PV (200 ¤, max 2) | **Dismiss** : après une élimination (3 s) : invulnérable et rapide 2 s (offert, max 2) | **Empress** : 30 s de frénésie : cadence et vitesse augmentées — **6 pts** |\n| **Neon** | **Fast Lane** : deux murs d'électricité qui bloquent la vue (300 ¤) | **Relay Bolt** : éclair qui rebondit puis sonne les ennemis proches (200 ¤, max 2) | **High Gear** : active / coupe le sprint (jauge d'énergie). Accroupi en sprint : glissade (offert) | **Overdrive** : 12 s : rayon électrique précis et vitesse maximale — **7 pts** |\n| **Iso** | **Contingency** : mur d'énergie qui avance et bloque la vue (200 ¤) | **Undercut** : éclair qui traverse les murs et rend vulnérable (200 ¤, max 2) | **Double Tap** : bouclier qui absorbe une balle (12 s). Revient après 2 éliminations (offert) | **Kill Contract** : contrat : Iso et l'ennemi touché s'affrontent seuls dans une arène (15 s) — **7 pts** |\n| **Yoru** | **Fakeout** : leurre qui avance et aveugle les ennemis qui l'approchent (100 ¤) | **Blindside** : flash qui rebondit (250 ¤, max 2) | **Gatecrash** : pose une faille (clic gauche), puis téléporte-toi dessus (clic gauche) (offert, recharge 35 s) | **Dimensional Drift** : 10 s invisible et intouchable (sans tirer). Clic gauche pour sortir — **8 pts** |\n| **Waylay** | **Saturate** : orbe de lumière qui ralentit et gêne (cadence réduite) (200 ¤) | **Lightspeed** : deux dashes rapides (150 ¤) | **Refract** : pose une balise ici (clic gauche), puis reviens-y (clic gauche, 8 s) (offert, recharge 30 s) | **Convergent Paths** : rayon qui ralentit et gêne tous les ennemis devant toi — **8 pts** |\n\n## Initiateurs\n\n| Agent | C | Q | E (signature) | X (ultime) |\n|---|---|---|---|---|\n| **Sova** | **Owl Drone** : drone guidé par le regard qui révèle les ennemis proches (400 ¤) | **Shock Bolt** : flèche explosive (clic gauche : 1 rebond, clic droit : aucun) (150 ¤, max 2) | **Recon Bolt** : flèche qui révèle les ennemis à portée de vue (offert, recharge 40 s) | **Hunter's Fury** : 3 tirs d'énergie qui traversent les murs — **8 pts** |\n| **Skye** | **Regrowth** : soigne les alliés proches (60 PV) (200 ¤) | **Trailblazer** : tigre guidé par le regard qui sonne l'ennemi touché (250 ¤) | **Guiding Light** : faucon guidé qui explose en flash (offert, +250 ¤, max 2, recharge 40 s) | **Seekers** : 3 traqueurs qui poursuivent les 3 ennemis les plus proches — **8 pts** |\n| **Gekko** | **Mosh Pit** : créature qui explose en flaque très dangereuse (250 ¤) | **Wingman** : créature qui avance et sonne le premier ennemi rencontré (300 ¤) | **Dizzy** : créature volante qui aveugle les ennemis en vue (offert, recharge 30 s) | **Thrash** : créature guidée qui immobilise les ennemis à l'impact — **8 pts** |\n| **Breach** | **Aftershock** : charge à travers un mur : 3 explosions de l'autre côté (200 ¤) | **Flashpoint** : flash qui traverse le mur visé (250 ¤, max 2) | **Fault Line** : onde sismique en ligne droite qui sonne les ennemis (offert, recharge 35 s) | **Rolling Thunder** : séisme en cône : sonne et projette les ennemis — **9 pts** |\n| **Fade** | **Prowler** : créature guidée qui aveugle le premier ennemi rencontré (250 ¤, max 2) | **Seize** : orbe qui immobilise et rend vulnérables les ennemis (200 ¤) | **Haunt** : œil lancé qui révèle les ennemis en vue (offert, recharge 40 s) | **Nightfall** : vague de cauchemar : révèle et affaiblit les ennemis touchés — **8 pts** |\n| **Tejo** | **Stealth Drone** : drone guidé qui révèle, puis supprime en fin de course (300 ¤) | **Special Delivery** : grenade collante qui sonne (200 ¤) | **Guided Salvo** : carte tactique : missile sur le point choisi (offert, max 2, recharge 40 s) | **Armageddon** : carte tactique : tapis de bombes en ligne (dans l'axe de ton regard) — **8 pts** |\n| **KAY/O** | **FRAG/ment** : grenade qui explose plusieurs fois (200 ¤) | **FLASH/drive** : flash : clic gauche normal, clic droit rapide (250 ¤, max 2) | **ZERO/point** : couteau qui supprime les capacités des ennemis proches (offert, recharge 40 s) | **NULL/cmd** : 12 s d'impulsions de suppression, cadence et vitesse — **8 pts** |\n\n## Contrôleurs\n\n| Agent | C | Q | E (signature) | X (ultime) |\n|---|---|---|---|---|\n| **Brimstone** | **Stim Beacon** : zone qui accélère la cadence de tir et la vitesse des alliés (200 ¤) | **Incendiary** : grenade incendia
