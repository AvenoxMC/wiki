<script id="pages-data">window.PAGES={"en/arenas": "# Arenas\n\nArenas are configured with `/arena`. A match is played in a disposable copy, never in the template world.\n\n## Arena worlds\n\n| World | Purpose |\n|---|---|\n| `duels_tpl_<arena>` | Arena template. Unloaded except while using `/arena edit`. |\n| `duels_match_<arena>_<n>` | Temporary match copy, unloaded and deleted when the match ends. |\n\nWhen players choose the same mode, the plugin selects an available arena that is enabled, has at least two spawns, supports the selected kit and is below its `max-instances` limit. It copies the template asynchronously, loads the copy and then teleports the players. `worlds.max-loaded-instances` limits the total loaded instances across the server. Leftover match copies from a crash are removed at startup. Spawn-chunk loading is disabled in these worlds to speed up copying.\n\n## Create an arena\n\n```text\n/arena create <name> <type>             Create an empty world and teleport you there in Creative\n/arena create <name> <type> <world>      Copy an existing world as the template\n   type = duel or devine\n   ... build the map ...\n/arena addspawn <name>                   Add a spawn (repeat; at least two)\n/arena setspec <name>                    Set the optional spectator point\n/arena save <name>                       Save and unload the template\n```\n\nFor a schematic-based arena, see [Schematics](page:schematics).\n\n## Edit an arena later\n\n`/arena edit <name>` loads its template for editing. Matches already in progress are unaffected because they use independent copies. Run `/arena save <name>` when done to save and unload the template.\n\n## Optional settings\n\n| Command | Effect |\n|---|---|\n| `/arena kits <name> add <kit>` | Restrict the arena to selected kits. With no restriction, every kit is accepted. |\n| `/arena set <name> maxinstances <count>` | Set simultaneous matches allowed on the arena. |\n| `/arena set <name> voidy <height>` | Eliminate players who fall below this Y coordinate. Useful for floating and Sumo maps. |\n| `/arena set <name> buildlimit <height>` | Set the maximum building height. |\n| `/arena set <name> displayname <name>` | Set the name displayed in menus. Color codes such as `&a` are supported. |\n| `/arena set <name> icon` | Set the menu icon to the item in your hand. |\n\nAn arena must have at least two spawns to be available for a match.\n", "en/configuration": "# Configuration\n\nConfiguration files are stored in `plugins/Duels/`.\n\n## Files\n\n| File | Contents |\n|---|---|\n| `config.yml` | Lobby, lobby items, worlds, match rules, parties and feature settings. |\n| `messages.yml` | All plugin messages, in French by default, with `&` color codes. |\n| `kits.yml` | Kit definitions, also editable with `/dkit`. |\n| `arenas.yml` | Arena definitions, written by arena commands. |\n| `lobby.yml` | Lobby location. |\n| `stats.yml` | Player statistics. |\n| `schematics/` | Schematic files discovered by the plugin. |\n\n## Notable settings\n\n| Setting | Purpose |\n|---|---|\n| `lobby-server` | Server to send players to when they use `/lobby` or `/hub`; empty returns them to the Duels lobby. |\n| `worlds.max-loaded-instances` | Maximum total loaded match instances across the server. |\n| Arena `max-instances` | Maximum simultaneous copies for one arena. |\n| `schematics.folders` | Directories searched for schematic files. |\n| `schematics.paste-y` | Y coordinate used to center a pasted map (default 64). |\n| `schematics.ms-per-tick` | Limits schematic block writing per tick to reduce server stalls. |\n| `devine` | Guess! time limits, attempts, colors, duplicates and board layout. |\n\nRun `/duels reload` after editing configuration or `kits.yml` manually.\n\n## Admin permission\n\n`duels.admin` is granted to operators by default. It provides access to `/arena`, `/dkit`, `/duels setlobby`, `/duels reload`, Creative building in the lobby, and admin commands during a match. See [Arenas](page:arenas), [Kits](page:kits) and [Schematics](page:schematics) for command usage.\n", "en/game-modes": "# Game Modes\n\n## Duel\n\nArenas of type `duel` host combat matches with the selected kit. A queue match requires a compatible, enabled arena with at least two spawns. Arenas can be restricted to specific kits; see [Arenas](page:arenas).\n\n## Guess! (mastermind)\n\n**Guess!** is a non-combat 1v1 mode played with the automatically created `devine` kit on arenas of type `devine`.\n\n1. Roles are assigned randomly. The **code maker** chooses a secret ordered combination of **four wool colors** within 30 seconds. If time runs out, the combination is completed randomly.\n2. The **guesser** has **two minutes** to find the code. They compose attempts in the menu using the “Combination” item, or let it fill automatically, then submit.\n3. Each color gets a clue: **green** means the correct color and position; **orange** means the color is present but in another position; **red** means the color is absent.\n4. The guesser wins by finding the code in time; otherwise the code maker wins. Forfeit or disconnect awards the win to the other player.\n\nAttempt history is shown on the map board (four wool blocks, a divider and four clue blocks per row), in the menu (the last three attempts), and in chat. The secret combination is revealed at the top of the board when the game ends.\n\n## Create a Guess! arena\n\n```text\n/arena create guess devine                 Create a new mastermind arena\n/arena addspawn guess                      Repeat for both players\n/arena setboard guess                      Face the wall and target the board's bottom-left block\n/arena save guess\n```\n\nThe board is 9 blocks wide and 9 high: eight attempt rows plus the secret combination. It extends right and upward from the targeted block. Existing arenas are type `duel`; change one with `/arena set <name> type devine`. Set a kit's mode with `/dkit set <kit> mode devine`.\n\nThe `devine` section in `config.yml` controls selection and guessing time, maximum attempts, allowed colors, duplicate colors, board row count and board blocks.\n", "en/home": "# Avenox Duels\n\n**Avenox Duels** is a duelling plugin for **Spigot 1.8.8**. It supports 1v1 queues, direct challenges, parties, configurable kits, and arenas copied on demand for each match.\n\n> Every match runs in a fresh copy of its arena. The copy is removed when the match ends, so damage to the map never carries over to the next match.\n\n## Quick start\n\n1. Install the plugin as described in [Installation](page:installation).\n2. Set the lobby with `/duels setlobby`.\n3. Create and save an arena; see [Arenas](page:arenas).\n4. Join a queue with `/queue`, or challenge someone with `/duel`.\n\n## Wiki\n\n| Topic | Page |\n|---|---|\n| Install and build the plugin | [Installation](page:installation) |\n| Create and manage arenas | [Arenas](page:arenas) |\n| Import maps from schematics | [Schematics](page:schematics) |\n| Duel and mastermind game modes | [Game Modes](page:game-modes) |\n| Configure kits | [Kits](page:kits) |\n| Queues, challenges, parties and stats | [Players](page:players) |\n| Configuration and admin commands | [Configuration](page:configuration) |\n\n## Highlights\n\n- **Disposable arena instances**: each match uses a temporary copy of its template world.\n- **Several ways to play**: queue, direct challenge, FFA parties, team parties and party-versus-party.\n- **Map tools**: create arenas in-game or paste supported WorldEdit schematics.\n- **Configurable kits** and the non-combat **Guess!** mastermind mode.\n\n## Compatibility\n\nThe plugin targets **Spigot 1.8.8**. The README does not specify support for other server versions; test compatibility before using another version.\n", "en/installation": "# Installation\n\n## Requirements\n\n| Requirement | Details |\n|---|---|\n| Server | Spigot 1.8.8 |\n| Java | Use a Java version supported by your Spigot 1.8.8 server |\n| Plugin jar | `target/Duels.jar` |\n\n## Install\n\n1. Copy `target/Duels.jar` into the server's `plugins/` folder.\n2. Start the server.\n3. Stand at the desired lobby location and run `/duels setlobby`.\n4. Create at least one arena. Five example kits are created automatically: `nodebuff`, `builduhc`, `sumo`, `combo` and `archer`.\n\n> This plugin is intended for a dedicated duels server or lobby. On join, a player's inventory is cleared and replaced with the lobby items.\n\n## Build from source\n\nInstall Maven and run:\n\n```bash\nmvn package\n```\n\nThe plugin jar is produced at `target/Duels.jar`. Alternatively, compile with `javac` against `spigot-api-1.8.8-R0.1-SNAPSHOT.jar`.\n\n## Next steps\n\n- [Create an arena](page:arenas)\n- [Configure kits](page:kits)\n- [Player commands](page:players)\n", "en/kits": "# Kits\n\nFive example kits are created on first start: `nodebuff`, `builduhc`, `sumo`, `combo` and `archer`. Create and edit kits in-game with `/dkit`, or update `kits.yml` manually and run `/duels reload`.\n\n## Create a kit from your inventory\n\nEquip the inventory, armor and potion effects you want, then run:\n\n```text\n/dkit create <name>                 Create from your inventory; the held item becomes the icon\n/dkit setinv <name>                 Replace the kit contents with your current setup\n/dkit load <name>                   Load the kit to edit it (switch to Creative to rearrange)\n/dkit setname <name> &bNoDebuff     Set the displayed name\n/dkit seticon <name>                Set the icon from the held item\n/dkit set <name> <setting> <value>  Change a kit setting\n```\n\n## Kit settings\n\n| Setting | Effect |\n|---|---|\n| `build` | Allow building, for example in BuildUHC. |\n| `break-map` | Allow breaking map blocks. If disabled, only player-placed blocks can be broken. |\n| `hunger` / `regen` | Configure hunger and natural regeneration. |\n| `no-damage` | Hits deal no damage but preserve knockback, for Sumo. |\n| `water-kills` | Eliminate a player who touches water, for Sumo. |\n| `hit-delay` | Ticks between hits (20 = vanilla, 2 = Combo). |\n| `queue` | Show the kit in the “Play” menu. |\n| `enabled` | Enable or disable the kit. |\n\nA kit can also be restricted to particular arenas with `/arena kits <arena> add <kit>`.\n", "en/players": "# Players\n\n## Queue and direct challenges\n\n| Item or command | Action |\n|---|---|\n| “Play” sword / `/queue` | Open the mode menu; click a kit to join its queue. |\n| `/duel <player> [kit] [arena]` | Challenge a player directly. Choose a kit and arena, then they can accept or refuse with clickable chat options. |\n| Compass / `/spectate [player]` | Browse active matches and spectate, optionally targeting a player. |\n| `/stats [player]` | View wins, losses, kills and deaths. |\n| `/leave` | Leave a queue, forfeit a match or stop spectating. |\n\n## Parties\n\nUse the “Create Party” name tag or `/party` to open the party menu.\n\n| Command | Action |\n|---|---|\n| `/party invite <player>` | Invite a player (clickable message). |\n| `/party accept <leader>` | Accept a leader's invitation. |\n| `/party open` | Make the party public. |\n| `/party chat <message>` or `@message` | Send a party-chat message. |\n\nThe party leader starts a game from the menu:\n\n- **FFA**: every player fights for themselves.\n- **Teams**: the party is split into two random teams.\n- **Challenge a party**: play party versus party; the other party leader accepts.\n\n## Lobby\n\nUse the bed or `/lobby` (`/hub`) to leave a match and return to the lobby. If `lobby-server` is set in `config.yml`, the player is sent to that server (for example, `lobby1`); otherwise they return to the Duels lobby.\n", "en/schematics": "# Schematics\n\nYou can create a new arena from a supported WorldEdit schematic with `/arena fromschem`.\n\n## Supported formats\n\n| Extension | Source | Block format |\n|---|---|---|\n| `.schem` | Sponge v1, v2 or v3, created by WorldEdit 7+ or FAWE in 1.13+ | Modern blocks are converted automatically to 1.8 equivalents. |\n| `.schematic` | MCEdit, created by WorldEdit 6 for 1.8 | Blocks are already in 1.8 format. |\n\n## Find and paste a schematic\n\n1. Put the file in `plugins/Duels/schematics/`. The plugin also scans `plugins/WorldEdit/schematics/` and `plugins/FastAsyncWorldEdit/schematics/`; folders can be changed in `config.yml` under `schematics.folders`.\n2. List available files and create an arena:\n\n```text\n/arena schematics                         List discovered schematics\n/arena fromschem <name> <file> <type>     Create an empty world, paste the map and teleport you there\n   (equivalent: /arena create <name> <type> <file.schem>)\n/arena addspawn <name>                    Add at least two spawns\n/arena setspec <name>                     Set the optional spectator point\n/arena save <name>\n```\n\nThe map is centered at `0 / 64 / 0`. Change the paste height with `schematics.paste-y`. The plugin places the lethal void zone five blocks below the map. `/arena paste <name> <file>` pastes a schematic at your position while editing an arena, similar to `//paste`; this is useful for assembling a map from multiple pieces.\n\n## Conversion and performance\n\nModern blocks are converted using WorldEdit's conversion table while preserving orientation for stairs, slabs, logs, doors, signs and similar blocks. When a block has no 1.8 equivalent, it is approximated; examples include concrete to same-color wool, glazed terracotta to stained clay, crimson/warped/cherry wood to oak, deepslate to cobblestone, and lanterns to air. The plugin lists approximated block types after creation.\n\nBlocks are written directly into chunks. Work is spread across ticks according to `schematics.ms-per-tick` to avoid freezing the server, and progress is shown as a percentage.\n\n## Limitations\n\nAir is not pasted. Block-entity contents are not copied: sign text, chest contents and banners are not preserved.\n", "fr/arenas": "# Arènes\n\nLes arènes se configurent avec `/arena`. Un match se joue dans une copie jetable, jamais dans le monde modèle.\n\n## Mondes d'arène\n\n| Monde | Rôle |\n|---|---|\n| `duels_tpl_<arène>` | Modèle de l'arène. Déchargé sauf pendant `/arena edit`. |\n| `duels_match_<arène>_<n>` | Copie temporaire de match, déchargée puis supprimée à la fin. |\n\nQuand des joueurs choisissent le même mode, le plugin sélectionne une arène disponible : activée, avec au moins deux spawns, compatible avec le kit choisi et sous sa limite `max-instances`. Le monde modèle est copié en asynchrone, la copie est chargée, puis les joueurs y sont téléportés. `worlds.max-loaded-instances` plafonne le nombre total d'instances chargées sur le serveur. Les copies de match restantes après un crash sont supprimées au démarrage. Le chargement des chunks de spawn est désactivé dans ces mondes pour accélérer les copies.\n\n## Créer une arène\n\n```text\n/arena create <nom> <type>               Crée un monde vide et t'y téléporte en créatif\n/arena create <nom> <type> <monde>       Copie un monde existant comme modèle\n   type = duel ou devine\n   ... construire la map ...\n/arena addspawn <nom>                     Ajoute un spawn (répéter, au moins deux)\n/arena setspec <nom>                      Définit le point de spectateur facultatif\n/arena save <nom>                         Sauvegarde et décharge le modèle\n```\n\nPour créer une arène depuis une schématique, voir [Schématiques](page:schematics).\n\n## Modifier une arène\n\n`/arena edit <nom>` charge le modèle pour le modifier. Les matchs en cours ne sont pas affectés : ils jouent sur des copies indépendantes. Lancer `/arena save <nom>` après les modifications pour sauvegarder et décharger le modèle.\n\n## Réglages facultatifs\n\n| Commande | Effet |\n|---|---|\n| `/arena kits <nom> add <kit>` | Limite l'arène aux kits choisis. Sans restriction, tous les kits sont acceptés. |\n| `/arena set <nom> maxinstances <nombre>` | Définit le nombre de matchs simultanés autorisés sur l'arène. |\n| `/arena set <nom> voidy <hauteur>` | Élimine les joueurs qui tombent sous cette coordonnée Y. Utile pour les maps flottantes et Sumo. |\n| `/arena set <nom> buildlimit <hauteur>` | Définit la hauteur maximale de construction. |\n| `/arena set <nom> displayname <nom>` | Définit le nom affiché dans les menus. Les codes couleur comme `&a` sont acceptés. |\n| `/arena set <nom> icon` | Utilise l'objet tenu en main comme icône de menu. |\n\nUne arène doit avoir au moins deux spawns pour être disponible en match.\n", "fr/configuration": "# Configuration\n\nLes fichiers de configuration se trouvent dans `plugins/Duels/`.\n\n## Fichiers\n\n| Fichier | Contenu |\n|---|---|\n| `config.yml` | Lobby, objets du lobby, mondes, règles de match, parties et réglages des fonctionnalités. |\n| `messages.yml` | Tous les messages du plugin, en français par défaut, avec les codes couleur `&`. |\n| `kits.yml` | Définition des kits, également modifiable avec `/dkit`. |\n| `arenas.yml` | Définition des arènes, écrite par les commandes d'arène. |\n| `lobby.yml` | Position du lobby. |\n| `stats.yml` | Statistiques des joueurs. |\n| `schematics/` | Schématiques recherchées par le plugin. |\n\n## Réglages principaux\n\n| Réglage | Rôle |\n|---|---|\n| `lobby-server` | Serveur de destination avec `/lobby` ou `/hub` ; vide, le joueur revient au lobby Duels. |\n| `worlds.max-loaded-instances` | Nombre maximal total d'instances de match chargées sur le serveur. |\n| `max-instances` d'une arène | Nombre maximal de copies simultanées pour une arène. |\n| `schematics.folders` | Dossiers parcourus pour trouver des schématiques. |\n| `schematics.paste-y` | Coordonnée Y de centrage d'une map collée (64 par défaut). |\n| `schematics.ms-per-tick` | Limite le travail d'écriture des blocs par tick pour réduire les ralentissements. |\n| `devine` | Temps, nombre d'essais, couleurs, doublons et disposition du tableau du mode Devine ! |\n\nLancer `/duels reload` après modification de la configuration ou de `kits.yml` à la main.\n\n## Permission admin\n\n`duels.admin` est accordée aux opérateurs par défaut. Elle donne accès à `/arena`, `/dkit`, `/duels setlobby`, `/duels reload`, à la construction en créatif au lobby et aux commandes admin pendant un match. Voir [Arènes](page:arenas), [Kits](page:kits) et [Schématiques](page:schematics) pour les commandes.\n", "fr/game-modes": "# Modes de jeu\n\n## Duel\n\nLes arènes de type `duel` accueillent des combats avec le kit choisi. Un match en file nécessite une arène activée et compatible, avec au moins deux spawns. Une arène peut être réservée à certains kits ; voir [Arènes](page:arenas).\n\n## Devine ! (mastermind)\n\n**Devine !** est un mode 1v1 sans combat, joué avec le kit `devine` créé automatiquement sur une arène de type `devine`.\n\n1. Les rôles sont tirés au sort. Le **maître du code** choisit une combinaison secrète ordonnée de **quatre couleurs de laine** en 30 secondes. Si le délai expire, la combinaison est complétée au hasard.\n2. Le **devineur** a **deux minutes** pour trouver le code. Il compose ses essais dans le menu avec l'objet « Combinaison », ou laisse la combinaison se remplir automatiquement, puis valide.\n3. Chaque couleur reçoit un indice : **vert** signifie bonne couleur et bonne position ; **orange**, couleur présente mais à une autre position ; **rouge**, couleur absente.\n4. Si le devineur trouve le code à temps, il gagne ; sinon, le maître du code gagne. Abandon ou déconnexion : la victoire revient à l'autre joueur.\n\nL'historique apparaît sur le tableau de la map (quatre laines, un séparateur et quatre blocs d'indice par ligne), dans le menu (les trois derniers essais) et dans le chat. La combinaison secrète est révélée en haut du tableau à la fin.\n\n## Créer une arène Devine !\n\n```text\n/arena create devine1 devine                Crée une arène mastermind\n/arena addspawn devine1                     Répéter pour les deux joueurs\n/arena setboard devine1                     Face au mur, viser le bloc en bas à gauche du tableau\n/arena save devine1\n```\n\nLe tableau fait 9 blocs de large et 9 de haut : huit lignes d'essais et la combinaison secrète. Il s'étend vers la droite et vers le haut depuis le bloc visé. Les arènes existantes sont de type `duel` ; changer avec `/arena set <nom> type devine`. Régler le mode d'un kit avec `/dkit set <kit> mode devine`.\n\nLa section `devine` de `config.yml` règle les temps de choix et de devinette, le nombre maximum d'essais, les couleurs autorisées et les doublons, le nombre de lignes et les blocs du tableau.\n", "fr/home": "# Avenox Duels\n\n**Avenox Duels** est un plugin de duels pour **Spigot 1.8.8**. Il propose des files 1v1, des défis directs, des parties entre amis, des kits configurables et des arènes copiées à la demande pour chaque match.\n\n> Chaque match se joue sur une copie neuve de l'arène. Cette copie est supprimée à la fin : les dégâts faits à la map ne persistent pas pour le match suivant.\n\n## Démarrage rapide\n\n1. Installer le plugin comme décrit dans [Installation](page:installation).\n2. Définir le lobby avec `/duels setlobby`.\n3. Créer et sauvegarder une arène ; voir [Arènes](page:arenas).\n4. Rejoindre une file avec `/queue` ou défier un joueur avec `/duel`.\n\n## Wiki\n\n| Sujet | Page |\n|---|---|\n| Installer et compiler le plugin | [Installation](page:installation) |\n| Créer et gérer des arènes | [Arènes](page:arenas) |\n| Importer des maps depuis des schématiques | [Schématiques](page:schematics) |\n| Modes duel et mastermind | [Modes de jeu](page:game-modes) |\n| Configurer les kits | [Kits](page:kits) |\n| Files, défis, parties et statistiques | [Joueurs](page:players) |\n| Configuration et commandes admin | [Configuration](page:configuration) |\n\n## Points forts\n\n- **Instances d'arène jetables** : chaque match utilise une copie temporaire du monde modèle.\n- **Plusieurs modes de jeu** : file, défi direct, parties FFA, en équipes ou contre une autre party.\n- **Outils de map** : création en jeu ou collage de schématiques WorldEdit compatibles.\n- **Kits configurables** et mode mastermind sans combat « Devine ! ».\n\n## Compatibilité\n\nLe plugin cible **Spigot 1.8.8**. Le README ne précise pas la compatibilité avec d'autres versions ; testez avant d'utiliser une autre version.\n", "fr/installation": "# Installation\n\n## Prérequis\n\n| Prérequis | Détails |\n|---|---|\n| Serveur | Spigot 1.8.8 |\n| Java | Version compatible avec votre serveur Spigot 1.8.8 |\n| Jar du plugin | `target/Duels.jar` |\n\n## Installer\n\n1. Copier `target/Duels.jar` dans le dossier `plugins/` du serveur.\n2. Démarrer le serveur.\n3. Se placer à l'emplacement du lobby et lancer `/duels setlobby`.\n4. Créer au moins une arène. Cinq kits d'exemple sont créés automatiquement : `nodebuff`, `builduhc`, `sumo`, `combo` et `archer`.\n\n> Le plugin est prévu pour un serveur de duels ou un lobby dédié. À la connexion, l'inventaire du joueur est vidé et remplacé par les objets du lobby.\n\n## Compiler depuis les sources\n\nInstaller Maven puis lancer :\n\n```bash\nmvn package\n```\n\nLe jar est produit dans `target/Duels.jar`. Autre possibilité : compiler avec `javac` contre `spigot-api-1.8.8-R0.1-SNAPSHOT.jar`.\n\n## Pour commencer\n\n- [Créer une arène](page:arenas)\n- [Configurer les kits](page:kits)\n- [Commandes joueur](page:players)\n", "fr/kits": "# Kits\n\nCinq kits d'exemple sont créés au premier démarrage : `nodebuff`, `builduhc`, `sumo`, `combo` et `archer`. Créer et modifier les kits en jeu avec `/dkit`, ou éditer `kits.yml` manuellement puis lancer `/duels reload`.\n\n## Créer un kit depuis son inventaire\n\nÉquiper l'inventaire, l'armure et les effets de potion souhaités, puis lancer :\n\n```text\n/dkit create <nom>                  Crée le kit depuis l'inventaire ; l'objet tenu devient l'icône\n/dkit setinv <nom>                  Remplace le contenu du kit par l'équipement actuel\n/dkit load <nom>                    Charge le kit pour le modifier (passer en créatif pour réorganiser)\n/dkit setname <nom> &bNoDebuff      Définit le nom affiché\n/dkit seticon <nom>                 Définit l'icône avec l'objet tenu\n/dkit set <nom> <réglage> <valeur>  Modifie un réglage du kit\n```\n\n## Réglages des kits\n\n| Réglage | Effet |\n|---|---|\n| `build` | Autorise la construction, par exemple en BuildUHC. |\n| `break-map` | Autorise à casser la map. Sinon, seuls les blocs posés par les joueurs peuvent être cassés. |\n| `hunger` / `regen` | Règle la faim et la régénération naturelle. |\n| `no-damage` | Les coups n'infligent pas de dégâts mais conservent le knockback (Sumo). |\n| `water-kills` | Élimine un joueur qui touche l'eau (Sumo). |\n| `hit-delay` | Ticks entre deux coups (20 = vanilla, 2 = Combo). |\n| `queue` | Affiche le kit dans le menu « Jouer ». |\n| `enabled` | Active ou désactive le kit. |\n\nUne arène peut aussi être réservée à certains kits avec `/arena kits <arène> add <kit>`.\n", "fr/players": "# Joueurs\n\n## File et défis directs\n\n| Objet ou commande | Action |\n|---|---|\n| Épée « Jouer » / `/queue` | Ouvre le menu des modes ; cliquer sur un kit pour rejoindre sa file. |\n| `/duel <joueur> [kit] [arène]` | Défie directement un joueur. Choisir un kit et une arène ; il peut accepter ou refuser via les options cliquables du chat. |\n| Boussole / `/spectate [joueur]` | Parcourt les matchs en cours et permet de les regarder, éventuellement en ciblant un joueur. |\n| `/stats [joueur]` | Affiche victoires, défaites, éliminations et morts. |\n| `/leave` | Quitte une file, abandonne un match ou arrête le mode spectateur. |\n\n## Parties\n\nUtiliser l'étiquette « Créer une party » ou `/party` pour ouvrir le menu.\n\n| Commande | Action |\n|---|---|\n| `/party invite <joueur>` | Invite un joueur (message cliquable). |\n| `/party accept <chef>` | Accepte l'invitation d'un chef. |\n| `/party open` | Rend la party publique. |\n| `/party chat <message>` ou `@message` | Envoie un message dans le chat de party. |\n\nLe chef lance une partie depuis le menu :\n\n- **FFA** : chacun pour soi.\n- **Équipes** : la party est divisée en deux équipes aléatoires.\n- **Défier une party** : party contre party ; l'autre chef accepte le défi.\n\n## Lobby\n\nUtiliser le lit ou `/lobby` (`/hub`) pour quitter le match et revenir au lobby. Si `lobby-server` est renseigné dans `config.yml`, le joueur est envoyé sur ce serveur (par exemple `lobby1`) ; sinon, il revient au lobby Duels.\n", "fr/schematics": "# Schématiques\n\nUne arène peut être créée depuis une schématique WorldEdit compatible avec `/arena fromschem`.\n\n## Formats acceptés\n\n| Extension | Origine | Format des blocs |\n|---|---|---|\n| `.schem` | Sponge v1, v2 ou v3, créé par WorldEdit 7+ ou FAWE en 1.13+ | Les blocs modernes sont convertis automatiquement en équivalents 1.8. |\n| `.schematic` | MCEdit, créé par WorldEdit 6 pour la 1.8 | Les blocs sont déjà au format 1.8. |\n\n## Trouver et coller une schématique\n\n1. Déposer le fichier dans `plugins/Duels/schematics/`. Le plugin consulte aussi `plugins/WorldEdit/schematics/` et `plugins/FastAsyncWorldEdit/schematics/` ; les dossiers se modifient dans `config.yml`, sous `schematics.folders`.\n2. Lister les fichiers disponibles et créer une arène :\n\n```text\n/arena schematics                         Liste les schématiques trouvées\n/arena fromschem <nom> <fichier> <type>   Crée un monde vide, colle la map et t'y téléporte\n   (équivalent : /arena create <nom> <type> <fichier.schem>)\n/arena addspawn <nom>                     Ajouter au moins deux spawns\n/arena setspec <nom>                      Définir le point de spectateur facultatif\n/arena save <nom>\n```\n\nLa map est centrée en `0 / 64 / 0`. Régler la hauteur de collage avec `schematics.paste-y`. La zone de vide mortelle est posée cinq blocs sous la map. `/arena paste <nom> <fichier>` colle une schématique à ta position pendant l'édition d'une arène, comme `//paste` ; pratique pour assembler la map en plusieurs morceaux.\n\n## Conversion et performances\n\nLes blocs modernes sont convertis avec la table de conversion de WorldEdit, en conservant l'orientation des escaliers, dalles, bûches, portes, panneaux, etc. Si un bloc n'a pas d'équivalent en 1.8, il est approximé : par exemple béton vers laine de même couleur, terre cuite émaillée vers argile colorée, bois crimson/warped/cerisier vers chêne, deepslate vers cobblestone et lanterne vers air. Après la création, le plugin liste les types de blocs approximés.\n\nLes blocs sont écrits directement dans les chunks. Le travail est réparti entre les ticks selon `schematics.ms-per-tick` pour éviter de figer le serveur ; l'avancement est affiché en pourcentage.\n\n## Limites\n\nL'air n'est pas collé. Le contenu des blocs spéciaux n'est pas copié : texte des panneaux, contenu des coffres et bannières.\n"}</script>
<script>
const NAV=[
 [{en:'Getting started',fr:'Démarrage'},[['home','Overview','Accueil'],['installation','Installation','Installation']]],
 [{en:'Setup',fr:'Configuration'},[['arenas','Arenas','Arènes'],['schematics','Schematics','Schématiques'],['kits','Kits','Kits']]],
 [{en:'Play',fr:'Jouer'},[['game-modes','Game Modes','Modes de jeu'],['players','Players','Joueurs']]],
 [{en:'Administration',fr:'Administration'},[['configuration','Configuration','Configuration']]]
];
const UI={en:{nf:'Page not found.',err:'Could not load this page.'},fr:{nf:'Page introuvable.',err:'Impossible de charger cette page.'}};
const $=s=>document.querySelector(s),cache={};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let lang=localStorage.getItem('duels-lang')||((navigator.language||'en').toLowerCase().startsWith('fr')?'fr':'en');
let slug='home';
function inl(s){const k=[];s=s.replace(/`([^`]+)`/g,(m,c)=>{k.push('<code>'+esc(c)+'</code>');return '\u0002'+(k.length-1)+'\u0002'});s=esc(s).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,u)=>u.startsWith('page:')?`<a href="#/${lang}/${u.slice(5)}">${t}</a>`:`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,:;]|$)/g,'$1<em>$2</em>');return s.replace(/\u0002(\d+)\u0002/g,(m,i)=>k[i])}
function md(src){const codes=[];src=src.replace(/```\w*\n([\s\S]*?)```/g,(m,c)=>{codes.push('<pre><code>'+esc(c)+'</code></pre>');return '\n\u0000'+(codes.length-1)+'\u0000\n'});const L=src.split('\n'),out=[],blk=l=>/^(#{1,4} |> |\||[-*] |\d+\. |---+$|<|\u0000)/.test(l);let i=0;while(i<L.length){const l=L[i];if(!l.trim()){i++;continue}if(/^\u0000\d+\u0000$/.test(l)){out.push(codes[+l.slice(1,-1)]);i++;continue}if(l[0]==='<'){const b=[];while(i<L.length&&L[i].trim()){b.push(L[i]);i++}out.push(b.join('\n'));continue}let m=l.match(/^(#{1,4}) (.*)/);if(m){out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);i++;continue}if(/^---+$/.test(l)){out.push('<hr>');i++;continue}if(l[0]==='>'){const b=[];while(i<L.length&&L[i][0]==='>'){b.push(L[i].replace(/^>\s?/,''));i++}out.push('<blockquote>'+inl(b.join(' '))+'</blockquote>');continue}if(l[0]==='|'){const rows=[];while(i<L.length&&L[i][0]==='|'){rows.push(L[i]);i++}const cells=r=>r.trim().replace(/\\\|/g,'\u0001').replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim().replace(/\u0001/g,'|')));out.push('<table><thead><tr>'+cells(rows[0]).map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+rows.slice(2).map(cells).map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table>');continue}if(/^([-*]|\d+\.) /.test(l)){const ol=/^\d/.test(l),b=[];while(i<L.length&&/^([-*]|\d+\.) /.test(L[i])){b.push(L[i].replace(/^([-*]|\d+\.) /,''));i++}out.push((ol?'<ol>':'<ul>')+b.map(x=>`<li>${inl(x)}</li>`).join('')+(ol?'</ol>':'</ul>'));continue}const p=[];while(i<L.length&&L[i].trim()&&(!blk(L[i])||!p.length)){p.push(L[i]);i++}out.push('<p>'+inl(p.join(' '))+'</p>')}return out.join('\n')}
function buildNav(){$('#nav').innerHTML=NAV.map(([g,items])=>`<h4>${g[lang]}</h4>`+items.map(([s,e,f])=>`<a href="#/${lang}/${s}" class="${s===slug?'on':''}">${lang==='fr'?f:e}</a>`).join('')).join('');document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));document.documentElement.lang=lang}
async function route(){const m=location.hash.match(/^#\/(en|fr)\/([\w-]+)$/);if(!m){const u=`#/${lang}/home`;try{history.replaceState(null,'',u);return route()}catch(e){location.hash=u;return}}lang=m[1];slug=m[2];localStorage.setItem('duels-lang',lang);buildNav();$('#nav').classList.remove('open');const known=NAV.some(g=>g[1].some(x=>x[0]===slug)),key=lang+'/'+slug,main=$('#main');try{if(!known)throw 404;if(!cache[key]){if(window.PAGES&&PAGES[key]!=null)cache[key]=PAGES[key];else{const r=await fetch(`pages/${key}.md`);if(!r.ok)throw r.status;cache[key]=await r.text()}}main.innerHTML=md(cache[key]);const t=NAV.flatMap(g=>g[1]).find(x=>x[0]===slug);document.title=(slug==='home'?'':(lang==='fr'?t[2]:t[1])+' – ')+'Avenox Duels Wiki'}catch(e){main.innerHTML=`<h1>${e===404?UI[lang].nf:UI[lang].err}</h1><p><a href="#/${lang}/home">← ${lang==='fr'?'Accueil':'Home'}</a></p>`}scrollTo(0,0)}
const mq=matchMedia('(prefers-color-scheme:dark)'),isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':mq.matches},paint=()=>{$('#theme').textContent=isDark()?'☀️':'🌙'};
$('#theme').onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('vc-theme',t)}catch(e){}paint()};mq.addEventListener('change',paint);paint();document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{location.hash=`#/${b.dataset.l}/${slug}`});$('#menu').onclick=()=>$('#nav').classList.toggle('open');addEventListener('hashchange',route);route();
</script>
